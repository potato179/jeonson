<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Vehicle Incident Map</title>

  <!-- Kakao Maps -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer"
  ></script>

  <style>
    :root {
      --bg: #080b0f;
      --panel: #0d1117;
      --panel-2: #11161d;
      --panel-3: #161c24;

      --text: #f4f6f8;
      --text-soft: #c0c7d0;
      --text-muted: #89929e;

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);

      --accent: #f05a3d;
      --accent-soft: rgba(240, 90, 61, 0.12);
      --accent-border: rgba(240, 90, 61, 0.42);

      --danger: #ff635d;

      --sidebar-width: 390px;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;

      --shadow-lg:
        0 24px 60px rgba(0, 0, 0, 0.35),
        0 4px 14px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      background: var(--bg);
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      position: absolute;
      z-index: 30;

      top: 0;
      left: 0;

      width: var(--sidebar-width);
      height: 100%;

      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          180deg,
          rgba(15, 19, 25, 0.985) 0%,
          rgba(10, 14, 19, 0.99) 100%
        );

      border-right: 1px solid var(--border);

      box-shadow:
        20px 0 55px rgba(0, 0, 0, 0.28);
    }

    .sidebar-handle {
      display: none;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      flex: 0 0 auto;

      padding: 28px 26px 22px;

      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 16px;
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 10px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;

      color: var(--accent);
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 16px rgba(240, 90, 61, 0.65);
    }

    .title {
      font-size: 27px;
      line-height: 1.2;

      letter-spacing: -0.045em;
      font-weight: 800;

      color: var(--text);
    }

    .subtitle {
      margin-top: 8px;

      font-size: 13px;
      line-height: 1.6;

      color: var(--text-muted);
    }

    .brand-mark {
      flex: 0 0 auto;

      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border-strong);
      border-radius: 13px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.02)
        );

      color: var(--accent);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .brand-mark svg {
      width: 21px;
      height: 21px;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 22px;
    }

    .stat {
      min-width: 0;

      padding: 14px 15px;

      border: 1px solid var(--border);
      border-radius: var(--radius-md);

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.018)
        );
    }

    .stat-label {
      display: block;

      margin-bottom: 5px;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;

      color: var(--text-muted);
    }

    .stat-value {
      display: flex;
      align-items: baseline;

      gap: 4px;

      font-size: 21px;
      line-height: 1;

      font-weight: 800;
      letter-spacing: -0.035em;

      color: var(--text);
    }

    .stat-value small {
      font-size: 11px;
      font-weight: 600;

      color: var(--text-muted);
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-section {
      flex: 0 0 auto;

      padding: 18px 20px 14px;
    }

    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;

      top: 50%;
      left: 15px;

      width: 18px;
      height: 18px;

      transform: translateY(-50%);

      pointer-events: none;

      color: var(--text-muted);
    }

    .search {
      width: 100%;
      height: 48px;

      padding: 0 44px;

      outline: none;

      color: var(--text);

      background: var(--panel-3);

      border: 1px solid var(--border);
      border-radius: 14px;

      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .search::placeholder {
      color: #69727f;
    }

    .search:hover {
      background: #181e27;
    }

    .search:focus {
      border-color: var(--accent-border);

      background: #171d25;

      box-shadow:
        0 0 0 3px rgba(240, 90, 61, 0.09);
    }

    .search-clear {
      position: absolute;

      top: 50%;
      right: 8px;

      width: 34px;
      height: 34px;

      display: none;
      place-items: center;

      transform: translateY(-50%);

      border-radius: 9px;

      background: transparent;
      color: var(--text-muted);

      cursor: pointer;
    }

    .search-clear:hover {
      background: rgba(255, 255, 255, 0.06);

      color: var(--text);
    }

    .search-clear.visible {
      display: grid;
    }

    .search-clear svg {
      width: 17px;
      height: 17px;
    }

    /* =========================================================
       LIST HEADER
    ========================================================= */

    .list-header {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px 11px;
    }

    .list-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;

      color: var(--text-muted);
    }

    .result-count {
      font-size: 11px;
      font-weight: 700;

      color: var(--text-muted);
    }

    /* =========================================================
       LIST
    ========================================================= */

    .list {
      flex: 1 1 auto;
      min-height: 0;

      padding: 0 14px 22px;

      overflow-y: auto;
      overflow-x: hidden;

      overscroll-behavior: contain;

      -webkit-overflow-scrolling: touch;

      touch-action: pan-y;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(255, 255, 255, 0.15)
        transparent;
    }

    .list::-webkit-scrollbar {
      width: 6px;
    }

    .list::-webkit-scrollbar-track {
      background: transparent;
    }

    .list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.13);

      border-radius: 999px;
    }

    /* =========================================================
       RECORD
    ========================================================= */

    .record {
      position: relative;

      width: 100%;

      margin-bottom: 8px;

      padding: 16px;

      text-align: left;

      border: 1px solid transparent;
      border-radius: var(--radius-md);

      background: transparent;

      color: inherit;

      cursor: pointer;

      touch-action: manipulation;

      transition:
        background 0.16s ease,
        border-color 0.16s ease,
        transform 0.16s ease;
    }

    .record:hover {
      background: rgba(255, 255, 255, 0.045);

      border-color: var(--border);
    }

    .record:active {
      transform: scale(0.993);
    }

    .record.active {
      background:
        linear-gradient(
          135deg,
          rgba(240, 90, 61, 0.13),
          rgba(240, 90, 61, 0.055)
        );

      border-color: var(--accent-border);
    }

    .record.active::before {
      content: "";

      position: absolute;

      top: 14px;
      bottom: 14px;
      left: 0;

      width: 3px;

      border-radius:
        0 999px 999px 0;

      background: var(--accent);
    }

    .record-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .car-number {
      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 16px;
      line-height: 1.3;

      font-weight: 800;

      letter-spacing: -0.02em;

      color: var(--text);
    }

    .date {
      flex: 0 0 auto;

      padding: 5px 7px;

      border: 1px solid var(--border);

      border-radius: 7px;

      background:
        rgba(255, 255, 255, 0.035);

      font-size: 10px;
      line-height: 1;

      font-weight: 750;

      color: var(--text-soft);
    }

    .date.invalid {
      border-color:
        rgba(255, 99, 93, 0.25);

      background:
        rgba(255, 99, 93, 0.08);

      color: #ff8f8a;
    }

    .car-name {
      margin-top: 7px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 13px;
      line-height: 1.45;

      font-weight: 600;

      color: var(--text-soft);
    }

    .reason {
      margin-top: 8px;

      display: -webkit-box;

      -webkit-box-orient: vertical;

      -webkit-line-clamp: 2;

      overflow: hidden;

      font-size: 12px;

      line-height: 1.6;

      color: var(--text-muted);

      word-break: keep-all;
    }

    .record.active .reason {
      color: #aeb5be;
    }

    .empty {
      padding: 50px 24px;

      text-align: center;

      font-size: 13px;
      line-height: 1.7;

      color: var(--text-muted);
    }

    /* =========================================================
       MAP
    ========================================================= */

    #map {
      position: absolute;

      top: 0;
      right: 0;

      width: calc(100% - var(--sidebar-width));
      height: 100%;
    }

    .map-edge {
      position: absolute;

      z-index: 20;

      top: 0;
      left: var(--sidebar-width);

      width: 24px;
      height: 100%;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.21),
          transparent
        );
    }

    /* =========================================================
       MAP BADGE
    ========================================================= */

    .map-badge {
      position: absolute;

      z-index: 25;

      top: 18px;
      right: 18px;

      display: flex;
      align-items: center;

      gap: 9px;

      padding: 10px 13px;

      border:
        1px solid rgba(0, 0, 0, 0.12);

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.94);

      color: #171a1f;

      box-shadow:
        0 7px 24px rgba(0, 0, 0, 0.18);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      font-size: 11px;

      font-weight: 750;
    }

    .map-badge-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 4px rgba(240, 90, 61, 0.13);
    }

    /* =========================================================
       MOBILE HEADER
    ========================================================= */

    .mobile-map-header {
      display: none;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      position: absolute;

      z-index: 100;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      gap: 14px;

      background:
        rgba(8, 11, 15, 0.96);

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .loading.hidden {
      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border:
        3px solid rgba(255, 255, 255, 0.1);

      border-top-color: var(--accent);

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;
    }

    .loading-text {
      font-size: 12px;

      color: var(--text-muted);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ERROR
    ========================================================= */

    .error-screen {
      position: fixed;

      z-index: 999;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background: var(--bg);
    }

    .error-screen.visible {
      display: flex;
    }

    .error-box {
      width: min(100%, 520px);

      padding: 26px;

      border:
        1px solid rgba(255, 99, 93, 0.22);

      border-radius: 18px;

      background: var(--panel);

      box-shadow: var(--shadow-lg);
    }

    .error-title {
      margin-bottom: 10px;

      font-size: 20px;

      font-weight: 800;

      color: #ff817b;
    }

    .error-message {
      font-size: 13px;

      line-height: 1.8;

      color: var(--text-soft);

      word-break: keep-all;
    }

    /* =========================================================
       INFO WINDOW
    ========================================================= */

    .info-window {
      width: 270px;

      padding: 15px 16px 16px;

      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #171a1f;
    }

    .info-title {
      margin-bottom: 10px;

      font-size: 15px;

      line-height: 1.3;

      font-weight: 800;

      letter-spacing: -0.02em;
    }

    .info-row {
      display: grid;

      grid-template-columns: 48px 1fr;

      gap: 8px;

      margin-top: 6px;

      font-size: 11px;

      line-height: 1.5;
    }

    .info-label {
      color: #7a8089;

      font-weight: 700;
    }

    .info-value {
      color: #2d3137;

      font-weight: 600;

      word-break: break-word;
    }

    .info-reason {
      margin-top: 11px;

      padding-top: 11px;

      border-top: 1px solid #eceef0;

      font-size: 11px;

      line-height: 1.6;

      color: #555b63;

      word-break: keep-all;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {
      :root {
        --mobile-panel-height: 46dvh;
      }

      .app {
        height: 100vh;
        height: 100dvh;
      }

      #map {
        inset: 0;

        width: 100%;
        height: 100%;
      }

      .map-edge,
      .map-badge {
        display: none;
      }

      /* -----------------------------------------
         MOBILE TOP HEADER
      ----------------------------------------- */

      .mobile-map-header {
        position: absolute;

        z-index: 35;

        top: 0;
        left: 0;
        right: 0;

        display: flex;

        align-items: flex-start;
        justify-content: space-between;

        gap: 10px;

        padding:
          calc(12px + env(safe-area-inset-top))
          14px
          10px;

        pointer-events: none;
      }

      .mobile-brand {
        min-width: 0;

        padding: 10px 13px 11px;

        border:
          1px solid rgba(255, 255, 255, 0.12);

        border-radius: 13px;

        background:
          rgba(10, 14, 19, 0.9);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow:
          0 8px 30px rgba(0, 0, 0, 0.28);

        pointer-events: auto;
      }

      .mobile-brand-label {
        margin-bottom: 3px;

        font-size: 9px;

        line-height: 1;

        letter-spacing: 0.12em;

        font-weight: 800;

        color: var(--accent);
      }

      .mobile-brand-title {
        overflow: hidden;

        white-space: nowrap;

        text-overflow: ellipsis;

        font-size: 14px;

        line-height: 1.25;

        font-weight: 800;

        color: var(--text);
      }

      .mobile-stats {
        flex: 0 0 auto;

        display: flex;

        overflow: hidden;

        border:
          1px solid rgba(255, 255, 255, 0.12);

        border-radius: 13px;

        background:
          rgba(10, 14, 19, 0.9);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow:
          0 8px 30px rgba(0, 0, 0, 0.28);

        pointer-events: auto;
      }

      .mobile-stat {
        min-width: 56px;

        padding: 9px 10px 8px;

        text-align: center;
      }

      .mobile-stat + .mobile-stat {
        border-left:
          1px solid rgba(255, 255, 255, 0.1);
      }

      .mobile-stat strong {
        display: block;

        font-size: 15px;

        line-height: 1.15;

        font-weight: 800;

        color: var(--text);
      }

      .mobile-stat span {
        display: block;

        margin-top: 2px;

        font-size: 8px;

        font-weight: 700;

        color: var(--text-muted);
      }

      /* -----------------------------------------
         MOBILE BOTTOM SHEET
      ----------------------------------------- */

      .sidebar {
        top: auto;
        bottom: 0;
        left: 0;

        width: 100%;

        height: var(--mobile-panel-height);

        border-right: 0;

        border-top:
          1px solid var(--border-strong);

        border-radius:
          22px 22px 0 0;

        background:
          linear-gradient(
            180deg,
            rgba(15, 19, 25, 0.985),
            rgba(9, 13, 18, 0.995)
          );

        box-shadow:
          0 -18px 50px rgba(0, 0, 0, 0.36);

        padding-bottom:
          env(safe-area-inset-bottom);
      }

      .sidebar-handle {
        flex: 0 0 auto;

        display: flex;

        align-items: center;
        justify-content: center;

        height: 21px;

        touch-action: none;
      }

      .sidebar-handle::before {
        content: "";

        width: 38px;
        height: 4px;

        border-radius: 999px;

        background:
          rgba(255, 255, 255, 0.17);
      }

      .header {
        display: none;
      }

      .search-section {
        padding:
          0
          14px
          10px;
      }

      .search {
        height: 46px;

        padding-left: 43px;

        border-radius: 13px;

        font-size: 14px;

        background: #171d25;
      }

      .search-icon {
        left: 14px;

        width: 18px;
        height: 18px;
      }

      .list-header {
        padding:
          0
          17px
          9px;
      }

      .list-title {
        font-size: 10px;
      }

      .result-count {
        font-size: 10px;
      }

      /* -----------------------------------------
         IMPORTANT:
         MOBILE LIST SCROLL
      ----------------------------------------- */

      .list {
        flex: 1 1 0;

        min-height: 0;

        overflow-y: auto;
        overflow-x: hidden;

        -webkit-overflow-scrolling: touch;

        overscroll-behavior-y: contain;

        touch-action: pan-y;

        scroll-behavior: smooth;

        padding:
          0
          9px
          calc(18px + env(safe-area-inset-bottom));
      }

      .record {
        margin-bottom: 7px;

        padding:
          13px;

        border-radius: 13px;

        background:
          rgba(255, 255, 255, 0.025);

        border-color:
          rgba(255, 255, 255, 0.045);

        touch-action: manipulation;
      }

      .record:hover {
        background:
          rgba(255, 255, 255, 0.025);
      }

      .record.active {
        background:
          linear-gradient(
            135deg,
            rgba(240, 90, 61, 0.15),
            rgba(240, 90, 61, 0.06)
          );

        border-color:
          rgba(240, 90, 61, 0.43);
      }

      .record.active::before {
        top: 12px;
        bottom: 12px;

        width: 3px;
      }

      .car-number {
        font-size: 16px;
      }

      .date {
        padding: 5px 7px;

        font-size: 9px;
      }

      .car-name {
        margin-top: 5px;

        font-size: 13px;

        color: #b9c0c9;
      }

      .reason {
        margin-top: 6px;

        font-size: 12px;

        line-height: 1.55;

        -webkit-line-clamp: 2;

        color: #868f9b;
      }

      .empty {
        padding: 34px 18px;
      }

      .info-window {
        width: 230px;

        padding:
          13px 14px;
      }

      .info-title {
        font-size: 14px;
      }
    }

    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 480px) {
      :root {
        --mobile-panel-height: 48dvh;
      }

      .mobile-map-header {
        padding-left: 10px;
        padding-right: 10px;
      }

      .mobile-brand {
        max-width:
          calc(100vw - 145px);

        padding-left: 11px;
        padding-right: 11px;
      }

      .mobile-brand-title {
        font-size: 13px;
      }

      .mobile-stat {
        min-width: 53px;

        padding-left: 8px;
        padding-right: 8px;
      }

      .mobile-stat strong {
        font-size: 14px;
      }

      .sidebar {
        border-radius:
          19px 19px 0 0;
      }

      .search-section {
        padding-left: 10px;
        padding-right: 10px;
      }

      .list {
        padding-left: 7px;
        padding-right: 7px;
      }

      .record {
        padding-left: 12px;
        padding-right: 12px;
      }

      .reason {
        -webkit-line-clamp: 2;
      }
    }

    /* =========================================================
       SHORT MOBILE
    ========================================================= */

    @media (max-width: 800px) and (max-height: 650px) {
      :root {
        --mobile-panel-height: 51dvh;
      }

      .mobile-map-header {
        padding-top:
          calc(
            8px +
            env(safe-area-inset-top)
          );
      }

      .mobile-brand {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .mobile-stats {
        transform: scale(0.94);

        transform-origin:
          top right;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- =====================================================
         MOBILE MAP HEADER
    ====================================================== -->

    <div class="mobile-map-header">

      <div class="mobile-brand">
        <div class="mobile-brand-label">
          INCIDENT MAP
        </div>

        <div class="mobile-brand-title">
          Vehicle Incident Records
        </div>
      </div>

      <div class="mobile-stats">

        <div class="mobile-stat">
          <strong id="mobileTotalCount">0</strong>
          <span>사고</span>
        </div>

        <div class="mobile-stat">
          <strong id="mobileCarCount">0</strong>
          <span>차량</span>
        </div>

      </div>

    </div>


    <!-- =====================================================
         SIDEBAR / MOBILE BOTTOM SHEET
    ====================================================== -->

    <aside class="sidebar">

      <div class="sidebar-handle"></div>

      <!-- DESKTOP HEADER -->

      <header class="header">

        <div class="brand-row">

          <div class="brand-copy">

            <div class="eyebrow">
              <span class="eyebrow-dot"></span>
              VEHICLE INCIDENT DATABASE
            </div>

            <h1 class="title">
              Incident Map
            </h1>

            <p class="subtitle">
              차량 사고 및 고장 기록을 지도 기반으로 확인합니다.
            </p>

          </div>

          <div class="brand-mark">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 21s7-4.35 7-11a7 7 0 1 0-14 0c0 6.65 7 11 7 11z"
              />

              <circle
                cx="12"
                cy="10"
                r="2.4"
              />
            </svg>

          </div>

        </div>


        <!-- STATS -->

        <div class="stats">

          <div class="stat">

            <span class="stat-label">
              TOTAL RECORDS
            </span>

            <div class="stat-value">
              <span id="totalCount">0</span>
              <small>건</small>
            </div>

          </div>

          <div class="stat">

            <span class="stat-label">
              VEHICLES
            </span>

            <div class="stat-value">
              <span id="carCount">0</span>
              <small>대</small>
            </div>

          </div>

        </div>

      </header>


      <!-- ===================================================
           SEARCH
      ==================================================== -->

      <div class="search-section">

        <div class="search-wrap">

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle
              cx="11"
              cy="11"
              r="7"
            />

            <path
              d="m20 20-3.5-3.5"
            />
          </svg>

          <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="차량번호, 차종, 사고 내용 검색"
            autocomplete="off"
            spellcheck="false"
          />

          <button
            id="searchClear"
            class="search-clear"
            type="button"
            aria-label="검색어 지우기"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M6 6l12 12"
              />

              <path
                d="M18 6 6 18"
              />
            </svg>

          </button>

        </div>

      </div>


      <!-- ===================================================
           LIST HEADER
      ==================================================== -->

      <div class="list-header">

        <div class="list-title">
          INCIDENT RECORDS
        </div>

        <div
          id="resultCount"
          class="result-count"
        >
          0 records
        </div>

      </div>


      <!-- ===================================================
           RECORD LIST
      ==================================================== -->

      <div
        id="recordList"
        class="list"
      ></div>

    </aside>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>

    <div class="map-edge"></div>

    <div class="map-badge">

      <span class="map-badge-dot"></span>

      LIVE MAP VIEW

    </div>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <div class="loading-text">
        사고 기록을 불러오는 중입니다.
      </div>

    </div>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
      id="errorScreen"
      class="error-screen"
    >

      <div class="error-box">

        <div class="error-title">
          데이터를 불러오지 못했습니다.
        </div>

        <div
          id="errorMessage"
          class="error-message"
        ></div>

      </div>

    </div>

  </div>


  <script>
    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let map = null;

    let clusterer = null;

    let records = [];

    let markers = [];

    let infoWindows = [];

    let activeInfoWindow = null;

    let activeRecordIndex = null;


    /* =========================================================
       DOM
    ========================================================= */

    const recordList =
      document.getElementById(
        "recordList"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const searchClear =
      document.getElementById(
        "searchClear"
      );

    const totalCount =
      document.getElementById(
        "totalCount"
      );

    const carCount =
      document.getElementById(
        "carCount"
      );

    const mobileTotalCount =
      document.getElementById(
        "mobileTotalCount"
      );

    const mobileCarCount =
      document.getElementById(
        "mobileCarCount"
      );

    const resultCount =
      document.getElementById(
        "resultCount"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const errorScreen =
      document.getElementById(
        "errorScreen"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* =========================================================
       UTILITY
    ========================================================= */

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function parseRecordDate(rawDate) {
      const value =
        String(rawDate ?? "").trim();

      if (!/^\d{6}$/.test(value)) {
        return {
          valid: false,
          text: value || "날짜 미상"
        };
      }

      const yy =
        Number(value.slice(0, 2));

      const mm =
        Number(value.slice(2, 4));

      const dd =
        Number(value.slice(4, 6));

      const year =
        2000 + yy;

      const date =
        new Date(
          year,
          mm - 1,
          dd
        );

      const valid =
        mm >= 1 &&
        mm <= 12 &&
        dd >= 1 &&
        dd <= 31 &&
        date.getFullYear() === year &&
        date.getMonth() === mm - 1 &&
        date.getDate() === dd;

      if (!valid) {
        return {
          valid: false,
          text: "날짜 확인 필요"
        };
      }

      return {
        valid: true,

        text:
          String(year).slice(2) +
          "." +
          String(mm).padStart(2, "0") +
          "." +
          String(dd).padStart(2, "0")
      };
    }


    function showError(message) {
      loading.classList.add(
        "hidden"
      );

      errorMessage.innerHTML =
        escapeHtml(message)
          .replace(/\n/g, "<br>");

      errorScreen.classList.add(
        "visible"
      );
    }


    /* =========================================================
       INFO WINDOW CONTROL
    ========================================================= */

    function closeActiveInfoWindow() {
      if (activeInfoWindow) {
        activeInfoWindow.close();

        activeInfoWindow = null;
      }
    }


    /*
     * 하나의 팝업만 열리도록 관리
     *
     * 핀 클릭
     *   ↓
     * 기존 팝업 닫기
     *   ↓
     * 새 팝업 열기
     */
    function openMarkerInfo(
      index,
      marker,
      infoWindow
    ) {
      if (!map) {
        return;
      }

      const item =
        records[index];

      if (!item) {
        return;
      }


      /* 기존 팝업 닫기 */

      closeActiveInfoWindow();


      /* 현재 기록 */

      activeRecordIndex =
        index;


      /* 목록 active 처리 */

      document
        .querySelectorAll(".record")
        .forEach((element) => {

          element.classList.toggle(
            "active",

            Number(
              element.dataset.index
            ) === index
          );

        });


      /* 지도 이동 */

      const position =
        new kakao.maps.LatLng(
          Number(item.latitude),
          Number(item.longitude)
        );

      map.panTo(position);


      /*
       * 팝업 열기
       *
       * 모바일에서도 marker 클릭 이벤트 안에서
       * 직접 open하기 때문에 정상적으로 유지됨
       */

      infoWindow.open(
        map,
        marker
      );


      /* 현재 팝업 저장 */

      activeInfoWindow =
        infoWindow;


      /*
       * 선택된 목록으로 스크롤
       *
       * block: nearest를 사용해서
       * 목록 전체가 과하게 움직이지 않도록 함
       */

      const selectedElement =
        document.querySelector(
          `.record[data-index="${index}"]`
        );

      if (selectedElement) {
        selectedElement.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });
      }
    }


    /* =========================================================
       MAP INITIALIZATION
    ========================================================= */

    function initMap() {
      const mapContainer =
        document.getElementById(
          "map"
        );

      const mapOptions = {
        center:
          new kakao.maps.LatLng(
            37.5665,
            126.9780
          ),

        level: 8
      };


      map =
        new kakao.maps.Map(
          mapContainer,
          mapOptions
        );


      /*
       * Zoom control
       */

      const zoomControl =
        new kakao.maps.ZoomControl();

      map.addControl(
        zoomControl,

        kakao.maps.ControlPosition.RIGHT
      );


      /*
       * Marker clusterer
       */

      clusterer =
        new kakao.maps.MarkerClusterer({
          map: map,

          averageCenter: true,

          minLevel: 6,

          disableClickZoom: false
        });


      /*
       * 중요:
       *
       * 여기서 map 전체 click 이벤트로
       * 팝업을 닫으면 모바일에서 marker 클릭 후
       * 팝업이 바로 닫히는 문제가 발생할 수 있다.
       *
       * 따라서 지도 전체 click 이벤트는 사용하지 않는다.
       */


      loadData();
    }


    /* =========================================================
       LOAD DATA
    ========================================================= */

    async function loadData() {
      try {

        const response =
          await fetch(
            "./list.json",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {
          throw new Error(
            `list.json 요청 실패 (${response.status})`
          );
        }


        const json =
          await response.json();


        if (!Array.isArray(json)) {
          throw new Error(
            "list.json 데이터 형식이 배열이 아닙니다."
          );
        }


        /*
         * 좌표가 정상적인 데이터만 사용
         */

        records =
          json.filter((item) => {

            const lat =
              Number(item.latitude);

            const lng =
              Number(item.longitude);

            return (
              Number.isFinite(lat) &&
              Number.isFinite(lng)
            );

          });


        updateStats();

        renderList(records);

        createMarkers(records);

        fitMap();

        loading.classList.add(
          "hidden"
        );

      } catch (error) {

        console.error(error);

        showError(
          "list.json 파일을 확인해주세요.\n\n" +
          error.message
        );

      }
    }


    /* =========================================================
       STATS
    ========================================================= */

    function updateStats() {

      const uniqueVehicles =
        new Set(
          records
            .map((item) =>
              String(
                item.carnum ?? ""
              ).trim()
            )
            .filter(Boolean)
        );


      const total =
        records.length;

      const vehicles =
        uniqueVehicles.size;


      totalCount.textContent =
        total;

      carCount.textContent =
        vehicles;

      mobileTotalCount.textContent =
        total;

      mobileCarCount.textContent =
        vehicles;
    }


    function updateResultCount(
      count
    ) {
      resultCount.textContent =
        `${count} record${
          count === 1
            ? ""
            : "s"
        }`;
    }


    /* =========================================================
       RENDER LIST
    ========================================================= */

    function renderList(data) {

      recordList.innerHTML = "";

      updateResultCount(
        data.length
      );


      if (!data.length) {

        recordList.innerHTML = `
          <div class="empty">
            검색 조건에 해당하는 기록이 없습니다.
          </div>
        `;

        return;
      }


      const fragment =
        document.createDocumentFragment();


      data.forEach((item) => {

        const originalIndex =
          records.indexOf(item);


        const dateInfo =
          parseRecordDate(
            item.date
          );


        const button =
          document.createElement(
            "button"
          );


        button.type = "button";

        button.className =
          "record";

        button.dataset.index =
          originalIndex;


        if (
          activeRecordIndex ===
          originalIndex
        ) {
          button.classList.add(
            "active"
          );
        }


        button.innerHTML = `
          <div class="record-top">

            <div class="car-number">
              ${escapeHtml(
                item.carnum ||
                "차량번호 없음"
              )}
            </div>

            <div class="date ${
              dateInfo.valid
                ? ""
                : "invalid"
            }">
              ${escapeHtml(
                dateInfo.text
              )}
            </div>

          </div>

          <div class="car-name">
            ${escapeHtml(
              item.car ||
              "차종 정보 없음"
            )}
          </div>

          <div class="reason">
            ${escapeHtml(
              item.reason ||
              "사고 내용 없음"
            )}
          </div>
        `;


        button.addEventListener(
          "click",
          () => {
            selectRecord(
              originalIndex
            );
          }
        );


        fragment.appendChild(
          button
        );

      });


      recordList.appendChild(
        fragment
      );
    }


    /* =========================================================
       CREATE MARKERS
    ========================================================= */

    function createMarkers(data) {

      /*
       * 기존 팝업 닫기
       */

      closeActiveInfoWindow();


      /*
       * 기존 cluster 제거
       */

      clusterer.clear();


      /*
       * 기존 marker 제거
       */

      markers.forEach(
        (marker) => {
          marker.setMap(null);
        }
      );


      markers = [];

      infoWindows = [];


      /*
       * 새 marker 생성
       */

      data.forEach((item) => {

        const originalIndex =
          records.indexOf(item);


        const position =
          new kakao.maps.LatLng(
            Number(item.latitude),
            Number(item.longitude)
          );


        const marker =
          new kakao.maps.Marker({
            position: position
          });


        marker.__recordIndex =
          originalIndex;


        const infoWindow =
          new kakao.maps.InfoWindow({
            removable: false,

            content:
              createInfoWindowContent(
                item
              )
          });


        /*
         * Marker click
         */

        kakao.maps.event.addListener(
          marker,
          "click",
          () => {

            openMarkerInfo(
              originalIndex,

              marker,

              infoWindow
            );

          }
        );


        markers.push(
          marker
        );


        infoWindows.push({
          marker: marker,

          infoWindow: infoWindow,

          originalIndex:
            originalIndex
        });

      });


      /*
       * Clusterer 등록
       */

      clusterer.addMarkers(
        markers
      );
    }


    /* =========================================================
       INFO WINDOW CONTENT
    ========================================================= */

    function createInfoWindowContent(
      item
    ) {

      const dateInfo =
        parseRecordDate(
          item.date
        );


      return `
        <div class="info-window">

          <div class="info-title">
            ${escapeHtml(
              item.carnum ||
              "차량번호 없음"
            )}
          </div>


          <div class="info-row">

            <div class="info-label">
              차종
            </div>

            <div class="info-value">
              ${escapeHtml(
                item.car || "-"
              )}
            </div>

          </div>


          <div class="info-row">

            <div class="info-label">
              일자
            </div>

            <div class="info-value">
              ${escapeHtml(
                dateInfo.text
              )}
            </div>

          </div>


          <div class="info-reason">
            ${escapeHtml(
              item.reason ||
              "사고 내용 없음"
            )}
          </div>

        </div>
      `;
    }


    /* =========================================================
       SELECT RECORD
    ========================================================= */

    function selectRecord(
      index
    ) {

      const item =
        records[index];


      if (!item) {
        return;
      }


      /*
       * 해당 marker / infoWindow 찾기
       */

      const pair =
        infoWindows.find(
          (entry) =>
            entry.originalIndex ===
            index
        );


      if (!pair) {
        return;
      }


      /*
       * 핀 클릭과 동일한 동작
       */

      openMarkerInfo(
        index,

        pair.marker,

        pair.infoWindow
      );
    }


    /* =========================================================
       FIT MAP
    ========================================================= */

    function fitMap() {

      if (
        !map ||
        !markers.length
      ) {
        return;
      }


      /*
       * marker 하나
       */

      if (
        markers.length === 1
      ) {

        map.setCenter(
          markers[0]
            .getPosition()
        );

        map.setLevel(4);

        return;
      }


      /*
       * 여러 marker
       */

      const bounds =
        new kakao.maps.LatLngBounds();


      markers.forEach(
        (marker) => {

          bounds.extend(
            marker.getPosition()
          );

        }
      );


      map.setBounds(
        bounds
      );
    }


    /* =========================================================
       SEARCH
    ========================================================= */

    function runSearch() {

      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();


      /*
       * 검색어 clear 버튼
       */

      searchClear.classList.toggle(
        "visible",

        Boolean(keyword)
      );


      /*
       * 검색 시작 시
       * 현재 팝업과 선택 상태 제거
       */

      activeRecordIndex =
        null;

      closeActiveInfoWindow();


      /*
       * 검색어 없음
       */

      if (!keyword) {

        renderList(
          records
        );

        createMarkers(
          records
        );

        fitMap();

        return;
      }


      /*
       * 검색
       */

      const filtered =
        records.filter(
          (item) => {

            const target = [
              item.carnum,
              item.car,
              item.date,
              item.reason
            ]
              .join(" ")
              .toLowerCase();


            return target.includes(
              keyword
            );
          }
        );


      renderList(
        filtered
      );


      createMarkers(
        filtered
      );


      if (
        filtered.length
      ) {
        fitMap();
      }
    }


    searchInput.addEventListener(
      "input",
      runSearch
    );


    searchClear.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        searchInput.focus();

        runSearch();

      }
    );


    /* =========================================================
       RESIZE
    ========================================================= */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if (!map) {
                return;
              }


              map.relayout();


              if (
                activeRecordIndex !==
                null
              ) {

                const item =
                  records[
                    activeRecordIndex
                  ];


                if (item) {

                  map.setCenter(
                    new kakao.maps.LatLng(
                      Number(
                        item.latitude
                      ),

                      Number(
                        item.longitude
                      )
                    )
                  );

                }

              } else {

                fitMap();

              }

            },

            160
          );
      }
    );


    /* =========================================================
       INIT
    ========================================================= */

    window.addEventListener(
      "load",
      () => {

        if (
          typeof kakao ===
            "undefined" ||
          !kakao.maps
        ) {

          showError(
            "Kakao Maps SDK를 불러오지 못했습니다.\n" +
            "JavaScript 키와 등록된 사이트 도메인을 확인해주세요."
          );

          return;
        }


        kakao.maps.load(
          () => {

            initMap();

          }
        );

      }
    );
  </script>
</body>
</html>
