<title>차량 사고 · 고장 지도</title>

<!-- Kakao Map API -->
<script
    type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a5e88dbf9d33b6b8c88bad5f46391f0d&libraries=clusterer">
</script>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Pretendard",
            "Noto Sans KR",
            sans-serif;

        background: #11161d;
        color: #ffffff;
    }

    button,
    input {
        font: inherit;
    }

    /* ==============================
       전체 레이아웃
    ============================== */

    .app {
        width: 100%;
        height: 100%;

        display: flex;
    }

    /* ==============================
       사이드바
    ============================== */

    .sidebar {
        width: 390px;
        height: 100%;

        flex-shrink: 0;

        display: flex;
        flex-direction: column;

        background: #11161d;
        border-right: 1px solid #252c35;

        z-index: 10;
    }

    .header {
        padding: 24px 22px 18px;

        border-bottom: 1px solid #252c35;
    }

    .title {
        display: flex;
        align-items: center;

        gap: 11px;
    }

    .title-icon {
        width: 40px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 11px;

        background: #e6ff3f;
        color: #11161d;

        font-size: 20px;
        font-weight: 900;
    }

    .title h1 {
        margin: 0;

        font-size: 19px;
        font-weight: 800;

        letter-spacing: -0.7px;
    }

    .subtitle {
        margin-top: 5px;

        color: #707b88;

        font-size: 11px;
    }

    /* ==============================
       통계
    ============================== */

    .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;

        gap: 8px;

        margin-top: 18px;
    }

    .stat {
        padding: 12px 14px;

        border: 1px solid #252c35;
        border-radius: 10px;

        background: #151b23;
    }

    .stat-label {
        margin-bottom: 4px;

        color: #737e8b;

        font-size: 10px;
    }

    .stat-value {
        font-size: 19px;
        font-weight: 800;
    }

    /* ==============================
       검색
    ============================== */

    .search-area {
        padding: 13px 15px;

        border-bottom: 1px solid #252c35;
    }

    .search {
        position: relative;
    }

    .search input {
        width: 100%;
        height: 42px;

        padding: 0 14px 0 39px;

        border: 1px solid #2b333d;
        border-radius: 10px;

        outline: none;

        background: #171d25;
        color: #ffffff;

        font-size: 12px;
    }

    .search input::placeholder {
        color: #606b78;
    }

    .search input:focus {
        border-color: #e6ff3f;
    }

    .search-icon {
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        color: #697481;

        font-size: 16px;
    }

    /* ==============================
       목록 헤더
    ============================== */

    .list-header {
        height: 40px;

        padding: 0 16px;

        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .list-title {
        color: #858f9b;

        font-size: 11px;
    }

    .list-count {
        color: #e6ff3f;

        font-size: 11px;
        font-weight: 700;
    }

    /* ==============================
       차량 목록
    ============================== */

    .vehicle-list {
        flex: 1;

        overflow-y: auto;

        padding: 0 10px 20px;
    }

    .vehicle-list::-webkit-scrollbar {
        width: 5px;
    }

    .vehicle-list::-webkit-scrollbar-thumb {
        background: #303944;
        border-radius: 10px;
    }

    .vehicle-item {
        margin-bottom: 6px;
        padding: 13px;

        border: 1px solid transparent;
        border-radius: 10px;

        background: #151b23;

        cursor: pointer;

        transition:
            background 0.15s,
            border 0.15s;
    }

    .vehicle-item:hover {
        background: #1a222c;
        border-color: #313b47;
    }

    .vehicle-item.active {
        border-color: #e6ff3f;
        background: #1b222b;
    }

    .item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 10px;
    }
```
