<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Vehicle Incident Map</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer"></script>

  <style>
    :root {
      --bg: #080b0f;
      --panel: #0d1117;
      --panel-2: #11161d;
      --panel-3: #171d25;

      --text: #f5f7fa;
      --text-soft: #c4cbd4;
      --text-muted: #89929e;

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);

      --accent: #f05a3d;
      --accent-soft: rgba(240, 90, 61, 0.12);
      --accent-border: rgba(240, 90, 61, 0.42);

      --danger: #ff6962;

      --sidebar-width: 390px;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;

      --sheet-collapsed: 32dvh;
      --sheet-middle: 57dvh;
      --sheet-expanded: 86dvh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================================================
       MAP
    ========================================================= */

    #map {
      position: fixed;
      inset: 0 0 0 var(--sidebar-width);
      background: #111;
    }

    /* =========================================================
       DESKTOP SIDEBAR
    ========================================================= */

    .sidebar {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      bottom: 0;

      width: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          180deg,
          rgba(13, 17, 23, 0.98),
          rgba(8, 11, 15, 0.98)
        );

      border-right: 1px solid var(--border);

      box-shadow: 12px 0 40px rgba(0, 0, 0, 0.28);
    }

    /* =========================================================
       BRAND
    ========================================================= */

    .brand {
      padding: 26px 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand-kicker {
      margin-bottom: 6px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      color: var(--accent);
    }

    .brand-title {
      font-size: 24px;
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .brand-subtitle {
      margin-top: 7px;

      font-size: 12px;
      line-height: 1.5;

      color: var(--text-muted);
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-wrap {
      padding: 14px 16px 10px;
    }

    .search-box {
      position: relative;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 13px;

      width: 16px;
      height: 16px;

      transform: translateY(-50%);

      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;

      padding: 0 14px 0 39px;

      border: 1px solid var(--border);
      border-radius: var(--radius-sm);

      outline: none;

      background: var(--panel-2);
      color: var(--text);

      font-size: 13px;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .search-input::placeholder {
      color: #68717c;
    }

    .search-input:focus {
      border-color: var(--accent-border);
      background: var(--panel-3);
    }

    /* =========================================================
       COMPACT STATS
    ========================================================= */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      padding: 8px 16px 10px;
    }

    .stat-card {
      min-height: 46px;

      padding: 8px 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border: 1px solid var(--border);
      border-radius: var(--radius-sm);

      background: rgba(255, 255, 255, 0.035);
    }

    .stat-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;

      color: var(--text-muted);
    }

    .stat-value {
      font-size: 16px;
      line-height: 1;

      font-weight: 850;
      letter-spacing: -0.03em;

      color: var(--text);
    }

    /* =========================================================
       LIST HEADER
    ========================================================= */

    .list-header {
      height: 42px;

      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .list-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;

      color: var(--text-soft);
    }

    .list-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* =========================================================
       RECORD LIST
    ========================================================= */

    .list {
      flex: 1;

      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 6px 10px 18px;

      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
    }

    .list::-webkit-scrollbar {
      width: 5px;
    }

    .list::-webkit-scrollbar-track {
      background: transparent;
    }

    .list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.13);
      border-radius: 999px;
    }

    .record {
      position: relative;

      width: 100%;

      padding: 13px 12px;
      margin-bottom: 5px;

      border: 1px solid transparent;
      border-radius: var(--radius-md);

      background: transparent;

      cursor: pointer;

      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .record:hover {
      background: rgba(255, 255, 255, 0.035);
    }

    .record.active {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .record::before {
      content: "";

      position: absolute;
      top: 13px;
      bottom: 13px;
      left: 0;

      width: 2px;

      border-radius: 99px;

      background: transparent;
    }

    .record.active::before {
      background: var(--accent);
    }

    .record-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .record-car-number {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .record-date {
      flex-shrink: 0;

      font-size: 10px;
      font-weight: 700;

      color: var(--text-muted);
    }

    .record-date.invalid {
      color: var(--danger);
    }

    .record-car {
      margin-top: 4px;

      font-size: 11px;
      font-weight: 600;

      color: var(--text-soft);
    }

    .record-reason {
      display: -webkit-box;

      margin-top: 7px;

      overflow: hidden;

      font-size: 11px;
      line-height: 1.5;

      color: var(--text-muted);

      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* =========================================================
       EMPTY / ERROR
    ========================================================= */

    .empty {
      padding: 40px 20px;

      text-align: center;

      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .error {
      padding: 20px;

      color: var(--danger);

      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================================================
       MOBILE TOP BRAND
    ========================================================= */

    .mobile-top-brand {
      display: none;
    }

    /* =========================================================
       MOBILE SHEET
    ========================================================= */

    .sidebar-handle-area {
      display: none;
    }

    /* =========================================================
       INFO WINDOW
    ========================================================= */

    .incident-info {
      width: 280px;

      padding: 15px;

      border-radius: 14px;

      background: #11161d;
      border: 1px solid rgba(255, 255, 255, 0.13);

      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.38);

      color: #f5f7fa;

      font-family:
        Inter,
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .incident-info-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 12px;

      padding-bottom: 10px;
      margin-bottom: 10px;

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .incident-info-number {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -0.03em;
    }

    .incident-info-date {
      flex-shrink: 0;

      font-size: 10px;
      font-weight: 700;

      color: #9aa3ae;
    }

    .incident-info-date.invalid {
      color: #ff6962;
    }

    .incident-info-car {
      margin-bottom: 8px;

      font-size: 11px;
      font-weight: 700;

      color: #c4cbd4;
    }

    .incident-info-reason {
      font-size: 12px;
      line-height: 1.6;

      color: #dce1e7;

      word-break: keep-all;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 720px) {
      #map {
        inset: 0;
      }

      .mobile-top-brand {
        position: fixed;
        z-index: 30;

        top: 14px;
        left: 16px;

        display: block;

        pointer-events: none;

        padding: 10px 13px;

        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;

        background: rgba(8, 11, 15, 0.82);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      }

      .mobile-top-brand-title {
        font-size: 13px;
        font-weight: 850;
        letter-spacing: -0.03em;
      }

      .mobile-top-brand-subtitle {
        margin-top: 2px;

        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.07em;

        color: var(--text-muted);
      }

      .sidebar {
        top: auto;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100%;
        height: var(--sheet-expanded);

        border-top: 1px solid var(--border-strong);
        border-right: 0;

        border-radius: 22px 22px 0 0;

        box-shadow:
          0 -16px 45px rgba(0, 0, 0, 0.34);

        transform: translateY(
          calc(
            var(--sheet-expanded) - var(--sheet-collapsed)
          )
        );

        transition: transform 0.28s cubic-bezier(.22, .61, .36, 1);

        pointer-events: none;
      }

      .sidebar.sheet-middle {
        transform: translateY(
          calc(
            var(--sheet-expanded) - var(--sheet-middle)
          )
        );
      }

      .sidebar.sheet-expanded {
        transform: translateY(0);
      }

      .sidebar.sheet-dragging {
        transition: none;
      }

      .brand {
        display: none;
      }

      .sidebar-handle-area {
        position: absolute;
        z-index: 5;

        top: 0;
        left: 0;
        right: 0;

        height: 34px;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: auto;

        touch-action: none;
      }

      .sidebar-handle {
        width: 40px;
        height: 4px;

        border-radius: 999px;

        background: rgba(255, 255, 255, 0.2);
      }

      .search-wrap {
        padding-top: 38px;
      }

      .stats {
        padding: 8px 14px 9px;
        gap: 6px;
      }

      .stat-card {
        min-height: 38px;
        padding: 6px 10px;
      }

      .stat-label {
        font-size: 8px;
      }

      .stat-value {
        font-size: 14px;
      }

      .list-header {
        height: 39px;
        padding: 0 15px;
      }

      .list {
        padding: 5px 9px 22px;
      }

      .record {
        padding: 12px 11px;
        margin-bottom: 4px;
      }

      .record-car-number {
        font-size: 13px;
      }

      .record-car {
        font-size: 10px;
      }

      .record-reason {
        font-size: 10px;
      }

      .incident-info {
        width: min(280px, calc(100vw - 32px));
      }

      .kakao-map-control {
        transform: scale(0.92);
        transform-origin: right top;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- Mobile only -->
  <div class="mobile-top-brand">
    <div class="mobile-top-brand-title">
      Vehicle Incident Map
    </div>
    <div class="mobile-top-brand-subtitle">
      ACCIDENT &amp; BREAKDOWN RECORDS
    </div>
  </div>

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-handle-area" id="sheetHandle">
      <div class="sidebar-handle"></div>
    </div>

    <div class="brand">
      <div class="brand-kicker">Incident Database</div>

      <div class="brand-title">
        Vehicle Incident Map
      </div>

      <div class="brand-subtitle">
        Accident &amp; breakdown records visualized on the map.
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          autocomplete="off"
          placeholder="차량번호, 차종, 사고내용 검색"
        />
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-label">RECORDS</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">VEHICLES</span>
        <span class="stat-value" id="vehicleCount">0</span>
      </div>
    </div>

    <div class="list-header">
      <span class="list-title">INCIDENT LIST</span>
      <span class="list-count" id="listCount">0</span>
    </div>

    <div class="list" id="recordList">
      <div class="empty">
        데이터를 불러오는 중입니다.
      </div>
    </div>

  </aside>

  <script>
    let map = null;
    let clusterer = null;

    let records = [];
    let markers = [];

    let activeInfoWindow = null;
    let activeRecordIndex = null;

    let currentFilteredRecords = [];

    const sidebar = document.getElementById("sidebar");
    const searchInput = document.getElementById("searchInput");
    const recordList = document.getElementById("recordList");

    const totalCount = document.getElementById("totalCount");
    const vehicleCount = document.getElementById("vehicleCount");
    const listCount = document.getElementById("listCount");

    /* =========================================================
       UTILS
    ========================================================= */

    function isMobile() {
      return window.innerWidth <= 720;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseRecordDate(value) {
      const raw = String(value ?? "").trim();

      if (!/^\d{6}$/.test(raw)) {
        return {
          valid: false,
          text: "날짜 확인 필요"
        };
      }

      const year = 2000 + Number(raw.slice(0, 2));
      const month = Number(raw.slice(2, 4));
      const day = Number(raw.slice(4, 6));

      const date = new Date(year, month - 1, day);

      const valid =
        date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day;

      if (!valid) {
        return {
          valid: false,
          text: "날짜 확인 필요"
        };
      }

      return {
        valid: true,
        text:
          `${year}.` +
          `${String(month).padStart(2, "0")}.` +
          `${String(day).padStart(2, "0")}`
      };
    }

    /* =========================================================
       DATE SORT
    ========================================================= */

    function sortRecordsByDate(data) {
      return [...data].sort((a, b) => {
        const aRaw = String(a.date ?? "").trim();
        const bRaw = String(b.date ?? "").trim();

        const aParsed = parseRecordDate(aRaw);
        const bParsed = parseRecordDate(bRaw);

        // 유효한 날짜를 먼저
        if (aParsed.valid && !bParsed.valid) {
          return -1;
        }

        if (!aParsed.valid && bParsed.valid) {
          return 1;
        }

        // 둘 다 잘못된 날짜라면 원래 순서 유지
        if (!aParsed.valid && !bParsed.valid) {
          return 0;
        }

        // 최신 날짜가 먼저
        return bRaw.localeCompare(aRaw);
      });
    }

    /* =========================================================
       STATS
    ========================================================= */

    function updateStats(data) {
      totalCount.textContent = data.length;

      const vehicles = new Set(
        data
          .map(item => String(item.carnum ?? "").trim())
          .filter(Boolean)
      );

      vehicleCount.textContent = vehicles.size;
    }

    /* =========================================================
       INFO WINDOW
    ========================================================= */

    function createInfoWindowContent(item) {
      const parsedDate = parseRecordDate(item.date);

      return `
        <div class="incident-info">

          <div class="incident-info-head">
            <div class="incident-info-number">
              ${escapeHtml(item.carnum || "차량번호 없음")}
            </div>

            <div class="incident-info-date ${parsedDate.valid ? "" : "invalid"}">
              ${escapeHtml(parsedDate.text)}
            </div>
          </div>

          <div class="incident-info-car">
            ${escapeHtml(item.car || "차종 정보 없음")}
          </div>

          <div class="incident-info-reason">
            ${escapeHtml(item.reason || "사고 내용 없음")}
          </div>

        </div>
      `;
    }

    function closeActiveInfoWindow() {
      if (activeInfoWindow) {
        activeInfoWindow.close();
        activeInfoWindow = null;
      }

      activeRecordIndex = null;

      document
        .querySelectorAll(".record.active")
        .forEach(element => {
          element.classList.remove("active");
        });
    }

    /* =========================================================
       MOBILE SHEET
    ========================================================= */

    function getSheetPositions() {
      if (!isMobile()) {
        return null;
      }

      const height = window.innerHeight;

      return {
        expanded: height * 0.14,
        middle: height * 0.43,
        collapsed: height * 0.68
      };
    }

    function setSheetPosition(position, instant = false) {
      if (!isMobile()) {
        return;
      }

      sidebar.classList.remove(
        "sheet-middle",
        "sheet-expanded",
        "sheet-dragging"
      );

      if (position === "middle") {
        sidebar.classList.add("sheet-middle");
      }

      if (position === "expanded") {
        sidebar.classList.add("sheet-expanded");
      }

      if (instant) {
        sidebar.style.transition = "none";

        requestAnimationFrame(() => {
          sidebar.style.transition = "";
        });
      }
    }

    /* =========================================================
       MARKER OPEN
    ========================================================= */

    function openMarkerInfo(originalIndex, marker, infoWindow) {
      if (!map || !marker || !infoWindow) {
        return;
      }

      const item = records.find(
        record => record.originalIndex === originalIndex
      );

      if (!item) {
        return;
      }

      if (activeInfoWindow && activeInfoWindow !== infoWindow) {
        activeInfoWindow.close();
      }

      activeInfoWindow = infoWindow;
      activeRecordIndex = originalIndex;

      document
        .querySelectorAll(".record.active")
        .forEach(element => {
          element.classList.remove("active");
        });

      const activeElement = document.querySelector(
        `.record[data-index="${originalIndex}"]`
      );

      if (activeElement) {
        activeElement.classList.add("active");
      }

      const position = marker.getPosition();

      /*
       * 모바일에서는 목록을 먼저 접어서
       * 지도 영역을 확보한다.
       */
      if (isMobile()) {
        setSheetPosition("collapsed");

        /*
         * marker가 화면 중앙에 오도록 이동.
         */
        map.setCenter(position);

        /*
         * 지도 이동이 완료된 뒤 InfoWindow를 연다.
         */
        setTimeout(() => {
          map.setCenter(position);

          setTimeout(() => {
            infoWindow.open(map, marker);
          }, 120);
        }, 280);
      } else {
        map.panTo(position);

        setTimeout(() => {
          infoWindow.open(map, marker);
        }, 80);
      }

      /*
       * 목록에서도 선택 항목을 보여준다.
       */
      if (activeElement) {
        setTimeout(() => {
          activeElement.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
          });
        }, 120);
      }
    }

    /* =========================================================
       MARKERS
    ========================================================= */

    function createMarkers(data) {
      if (!map || !clusterer) {
        return;
      }

      clusterer.clear();

      markers.forEach(marker => {
        marker.setMap(null);
      });

      markers = [];

      data.forEach(item => {
        const latitude = Number(item.latitude);
        const longitude = Number(item.longitude);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          return;
        }

        const position = new kakao.maps.LatLng(
          latitude,
          longitude
        );

        const marker = new kakao.maps.Marker({
          position
        });

        const infoWindow = new kakao.maps.InfoWindow({
          content: createInfoWindowContent(item),
          removable: false
        });

        kakao.maps.event.addListener(
          marker,
          "click",
          () => {
            openMarkerInfo(
              item.originalIndex,
              marker,
              infoWindow
            );
          }
        );

        markers.push(marker);
      });

      clusterer.addMarkers(markers);
    }

    /* =========================================================
       LIST
    ========================================================= */

    function renderList(data) {
      currentFilteredRecords = data;

      listCount.textContent = data.length;

      if (!data.length) {
        recordList.innerHTML = `
          <div class="empty">
            검색 결과가 없습니다.
          </div>
        `;

        return;
      }

      recordList.innerHTML = data
        .map(item => {
          const parsedDate = parseRecordDate(item.date);

          return `
            <div
              class="record"
              data-index="${item.originalIndex}"
              role="button"
              tabindex="0"
            >

              <div class="record-top">
                <div class="record-car-number">
                  ${escapeHtml(item.carnum || "차량번호 없음")}
                </div>

                <div class="record-date ${parsedDate.valid ? "" : "invalid"}">
                  ${escapeHtml(parsedDate.text)}
                </div>
              </div>

              <div class="record-car">
                ${escapeHtml(item.car || "차종 정보 없음")}
              </div>

              <div class="record-reason">
                ${escapeHtml(item.reason || "사고 내용 없음")}
              </div>

            </div>
          `;
        })
        .join("");

      recordList
        .querySelectorAll(".record")
        .forEach(element => {
          const index = Number(element.dataset.index);

          element.addEventListener("click", () => {
            selectRecord(index);
          });

          element.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectRecord(index);
            }
          });
        });
    }

    /* =========================================================
       SELECT RECORD
    ========================================================= */

    function selectRecord(index) {
      const target = records.find(
        record => record.originalIndex === index
      );

      if (!target) {
        return;
      }

      const markerIndex = markers.findIndex(marker => {
        const position = marker.getPosition();

        return (
          Math.abs(
            position.getLat() - Number(target.latitude)
          ) < 0.000000001 &&
          Math.abs(
            position.getLng() - Number(target.longitude)
          ) < 0.000000001
        );
      });

      if (markerIndex < 0) {
        return;
      }

      const marker = markers[markerIndex];

      const infoWindow = new kakao.maps.InfoWindow({
        content: createInfoWindowContent(target),
        removable: false
      });

      openMarkerInfo(
        index,
        marker,
        infoWindow
      );
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    function filterRecords(keyword) {
      const query = String(keyword ?? "")
        .trim()
        .toLowerCase();

      if (!query) {
        renderList(records);
        createMarkers(records);
        return;
      }

      const filtered = records.filter(item => {
        const text = [
          item.carnum,
          item.car,
          item.reason,
          item.date
        ]
          .map(value => String(value ?? "").toLowerCase())
          .join(" ");

        return text.includes(query);
      });

      renderList(filtered);
      createMarkers(filtered);
    }

    searchInput.addEventListener("input", event => {
      filterRecords(event.target.value);
    });

    /* =========================================================
       FIT MAP
    ========================================================= */

    function fitMap(data = records) {
      if (!map || !data.length) {
        return;
      }

      const bounds = new kakao.maps.LatLngBounds();

      let hasValidPosition = false;

      data.forEach(item => {
        const latitude = Number(item.latitude);
        const longitude = Number(item.longitude);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          return;
        }

        bounds.extend(
          new kakao.maps.LatLng(
            latitude,
            longitude
          )
        );

        hasValidPosition = true;
      });

      if (!hasValidPosition) {
        return;
      }

      map.setBounds(bounds);
    }

    /* =========================================================
       LOAD DATA
    ========================================================= */

    async function loadData() {
      try {
        const response = await fetch("./list.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "list.json 형식이 배열이 아닙니다."
          );
        }

        /*
         * 원본 index를 먼저 저장.
         * 이후 날짜순으로 정렬해도
         * marker/list 연결이 유지된다.
         */
        records = data.map((item, index) => ({
          ...item,
          originalIndex: index
        }));

        /*
         * 최신 날짜 → 과거 날짜 순.
         * 잘못된 날짜는 가장 아래.
         */
        records = sortRecordsByDate(records);

        updateStats(records);
        renderList(records);
        createMarkers(records);

        setTimeout(() => {
          fitMap(records);
        }, 150);

      } catch (error) {
        console.error(error);

        recordList.innerHTML = `
          <div class="error">
            데이터를 불러오지 못했습니다.<br />
            <br />
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    /* =========================================================
       MAP INIT
    ========================================================= */

    function initMap() {
      const container = document.getElementById("map");

      map = new kakao.maps.Map(
        container,
        {
          center: new kakao.maps.LatLng(
            37.5665,
            126.978
          ),
          level: 8
        }
      );

      const zoomControl =
        new kakao.maps.ZoomControl();

      map.addControl(
        zoomControl,
        kakao.maps.ControlPosition.RIGHT
      );

      clusterer =
        new kakao.maps.MarkerClusterer({
          map,
          averageCenter: true,
          minLevel: 6,
          disableClickZoom: false
        });

      loadData();
    }

    /* =========================================================
       MOBILE SHEET DRAG
    ========================================================= */

    let dragStartY = 0;
    let dragStartTranslate = 0;
    let isDraggingSheet = false;

    function getCurrentTranslateY() {
      const style =
        window.getComputedStyle(sidebar);

      const matrix =
        new DOMMatrixReadOnly(
          style.transform
        );

      return matrix.m42;
    }

    function getSheetTranslateValues() {
      const positions = getSheetPositions();

      if (!positions) {
        return null;
      }

      const expanded =
        positions.expanded -
        positions.expanded;

      const middle =
        positions.expanded -
        positions.middle;

      const collapsed =
        positions.expanded -
        positions.collapsed;

      return {
        expanded,
        middle,
        collapsed
      };
    }

    function applySheetDrag(translateY) {
      sidebar.style.transform =
        `translateY(${translateY}px)`;
    }

    function finishSheetDrag() {
      if (!isDraggingSheet) {
        return;
      }

      isDraggingSheet = false;

      sidebar.classList.remove(
        "sheet-dragging"
      );

      sidebar.style.transform = "";

      const positions =
        getSheetTranslateValues();

      if (!positions) {
        return;
      }

      const current =
        getCurrentTranslateY();

      const candidates = [
        {
          name: "expanded",
          value: positions.expanded
        },
        {
          name: "middle",
          value: positions.middle
        },
        {
          name: "collapsed",
          value: positions.collapsed
        }
      ];

      candidates.sort(
        (a, b) =>
          Math.abs(current - a.value) -
          Math.abs(current - b.value)
      );

      setSheetPosition(
        candidates[0].name
      );
    }

    const sheetHandle =
      document.getElementById(
        "sheetHandle"
      );

    sheetHandle.addEventListener(
      "touchstart",
      event => {
        if (!isMobile()) {
          return;
        }

        isDraggingSheet = true;

        dragStartY =
          event.touches[0].clientY;

        dragStartTranslate =
          getCurrentTranslateY();

        sidebar.classList.add(
          "sheet-dragging"
        );
      },
      {
        passive: true
      }
    );

    sheetHandle.addEventListener(
      "touchmove",
      event => {
        if (
          !isDraggingSheet ||
          !isMobile()
        ) {
          return;
        }

        const currentY =
          event.touches[0].clientY;

        const delta =
          currentY - dragStartY;

        const positions =
          getSheetTranslateValues();

        if (!positions) {
          return;
        }

        const min =
          positions.expanded;

        const max =
          positions.collapsed;

        const next =
          Math.min(
            max,
            Math.max(
              min,
              dragStartTranslate + delta
            )
          );

        applySheetDrag(next);
      },
      {
        passive: true
      }
    );

    sheetHandle.addEventListener(
      "touchend",
      finishSheetDrag,
      {
        passive: true
      }
    );

    sheetHandle.addEventListener(
      "touchcancel",
      finishSheetDrag,
      {
        passive: true
      }
    );

    /* =========================================================
       RESIZE
    ========================================================= */

    let resizeTimer = null;

    window.addEventListener(
      "resize",
      () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
          if (!map) {
            return;
          }

          if (!isMobile()) {
            sidebar.classList.remove(
              "sheet-middle",
              "sheet-expanded",
              "sheet-dragging"
            );

            sidebar.style.transform = "";
          }

          kakao.maps.event.trigger(
            map,
            "resize"
          );
        }, 120);
      }
    );

    /* =========================================================
       START
    ========================================================= */

    window.addEventListener(
      "load",
      () => {
        if (
          typeof kakao === "undefined" ||
          !kakao.maps
        ) {
          recordList.innerHTML = `
            <div class="error">
              Kakao Map SDK를 불러오지 못했습니다.
            </div>
          `;

          return;
        }

        kakao.maps.load(() => {
          initMap();
        });
      }
    );
  </script>
</body>
</html>
