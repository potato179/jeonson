<style>

        width: 390px;
        height: 100%;

        flex-shrink: 0;

        display: flex;
        flex-direction: column;

        background: #11161d;

    .title {

    }

        display: flex;
        align-items: center;

        padding: 0 16px;

    }

    }

    .list-count {

        font-weight: 700;

        border-color: #e6ff3f;

    }

        display: flex;
        align-items: center;

        font-size: 10px;

    .reason {

    .map-wrap {

    }

    /* ==============================
       지도 컨트롤

    .map-control {

        z-index: 5;

        display: flex;

        gap: 6px;
    }

    .map-btn {
        width: 40px;
        height: 40px;

        border: 1px solid #d5d9de;
        border-radius: 9px;

        background: rgba(255,255,255,0.96);
        color: #20252b;

        cursor: pointer;

        font-size: 17px;
        font-weight: 700;

        box-shadow:
            0 2px 8px rgba(0,0,0,0.13);
    }

    .map-btn:hover {
        background: #f2f3f4;
    }

    /* ==============================

    .info-window {

    .info-header {

    }

    .info-number {

    }

    .info-date {
        color: #7d858e;

    }

    .info-car {

    .info-reason {

        color: #333940;

    /* ==============================
       모바일

    @media (max-width: 800px) {

        .sidebar {

        }

        .vehicle-list {

        }

        .map-control {

        }
    }

</style>

</div>

<script>

    /* ==========================================================
       전역 변수
    ========================================================== */

    let vehicleData = [];

    let map;

    let markers = [];

    let markerMap = new Map();

    let clusterer;

    let activeInfoWindow = null;

    let activeIndex = null;


    /* ==========================================================
       카카오맵 초기화
    ========================================================== */

    const container =
        document.getElementById("map");


    const options = {

        center:
            new kakao.maps.LatLng(
                36.5,
                127.8
            ),

        level: 13

    };


    map =
        new kakao.maps.Map(
            container,
            options
        );


    /* ==========================================================
       카카오 기본 줌 컨트롤
    ========================================================== */

    const zoomControl =
        new kakao.maps.ZoomControl();


    map.addControl(
        zoomControl,
        kakao.maps.ControlPosition.RIGHT
    );


    /* ==========================================================
       클러스터러
    ========================================================== */

    clusterer =
        new kakao.maps.MarkerClusterer({

            map: map,

            averageCenter: true,

            minLevel: 7,

            disableClickZoom: true,

            styles: [

                {
                    width: "46px",
                    height: "46px",

                    background: "#11161d",

                    border:
                        "3px solid #e6ff3f",

                    borderRadius: "50%",

                    color: "#e6ff3f",

                    textAlign: "center",

                    lineHeight: "40px",

                    fontSize: "13px",

                    fontWeight: "900"
                }

            ]

        });


    /* ==========================================================
       JSON 불러오기
    ========================================================== */

    fetch("./list.json")

        .then((response) => {

            if (!response.ok) {

                throw new Error(
                    "list.json을 불러오지 못했습니다."
                );

            }

            return response.json();

        })

        .then((json) => {

            vehicleData = json;

            initialize();

        })

        .catch((error) => {

            console.error(error);

            document.getElementById(
                "vehicleList"
            ).innerHTML = `
                <div class="empty">
                    데이터를 불러오지 못했습니다.
                </div>
            `;

        });


    /* ==========================================================
       초기화
    ========================================================== */

    function initialize() {

        updateStatistics();

        createMarkers();

        renderList(
            vehicleData.map(
                (item, index) => ({
                    item,
                    index
                })
            )
        );

        fitMap();

    }


    /* ==========================================================
       마커 생성
    ========================================================== */

    function createMarkers() {

        markers = [];

        markerMap.clear();

        vehicleData.forEach(
            (item, index) => {

                const position =
                    new kakao.maps.LatLng(
                        item.latitude,
                        item.longitude
                    );


                const marker =
                    new kakao.maps.Marker({

                        position:
                            position

                    });


                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function() {

                        selectMarker(index);

                    }
                );


                markers.push(marker);

                markerMap.set(
                    index,
                    marker
                );

            }
        );


        clusterer.clear();

        clusterer.addMarkers(
            markers
        );

    }


    /* ==========================================================
       마커 선택
    ========================================================== */

    function selectMarker(index) {

        const item =
            vehicleData[index];

        const marker =
            markerMap.get(index);


        if (!marker) {
            return;
        }


        if (activeInfoWindow) {

            activeInfoWindow.close();

        }


        const infoWindow =
            new kakao.maps.InfoWindow({

                content:
                    createInfoWindow(item),

                removable: true

            });


        infoWindow.open(
            map,
            marker
        );


        activeInfoWindow =
            infoWindow;

        activeIndex =
            index;


        map.setCenter(
            new kakao.maps.LatLng(
                item.latitude,
                item.longitude
            )
        );


        map.setLevel(4);


        document
            .querySelectorAll(".vehicle-item")
            .forEach((element) => {

                element.classList.remove(
                    "active"
                );

            });


        const selected =
            document.querySelector(
                `.vehicle-item[data-index="${index}"]`
            );


        if (selected) {

            selected.classList.add(
                "active"
            );

            selected.scrollIntoView({

                behavior: "smooth",

                block: "nearest"

            });

        }

    }


    /* ==========================================================
       정보창
    ========================================================== */

    function createInfoWindow(item) {

        return `

            <div class="info-window">

                <div class="info-header">

                    <div class="info-number">
                        ${escapeHtml(item.carnum)}
                    </div>

                    <div class="info-date">
                        ${formatDate(item.date)}
                    </div>

                </div>


                <div class="info-car">
                    ${escapeHtml(item.car)}
                </div>


                <div class="info-reason">
                    ${escapeHtml(item.reason)}
                </div>

            </div>

        `;

    }


    /* ==========================================================
       목록 출력
    ========================================================== */

    function renderList(data) {

        const list =
            document.getElementById(
                "vehicleList"
            );


        list.innerHTML = "";


        if (data.length === 0) {

            list.innerHTML = `

                <div class="empty">
                    검색 결과가 없습니다.
                </div>

            `;

            return;

        }


        data.forEach(
            ({ item, index }) => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "vehicle-item";


                element.dataset.index =
                    index;


                element.innerHTML = `

                    <div class="item-top">

                        <div class="car-number">
                            ${escapeHtml(item.carnum)}
                        </div>

                        <div class="date">
                            ${formatDate(item.date)}
                        </div>

                    </div>


                    <div class="car-name">
                        ${escapeHtml(item.car)}
                    </div>


                    <div class="reason">
                        ${escapeHtml(item.reason)}
                    </div>

                `;


                element.addEventListener(
                    "click",
                    function() {

                        selectMarker(index);

                    }
                );


                list.appendChild(
                    element
                );

            }
        );


        document.getElementById(
            "listCount"
        ).textContent =
            `${data.length}건`;

    }


    /* ==========================================================
       검색
    ========================================================== */

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            function() {

                const keyword =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!keyword) {

                    renderList(
                        vehicleData.map(
                            (item, index) => ({
                                item,
                                index
                            })
                        )
                    );

                    return;

                }


                const result = [];


                vehicleData.forEach(
                    (item, index) => {

                        const target = [

                            item.carnum,

                            item.car,

                            item.date,

                            item.reason

                        ]
                            .join(" ")
                            .toLowerCase();


                        if (
                            target.includes(
                                keyword
                            )
                        ) {

                            result.push({
                                item,
                                index
                            });

                        }

                    }
                );


                renderList(result);

            }
        );


    /* ==========================================================
       통계
    ========================================================== */

    function updateStatistics() {

        document.getElementById(
            "totalCount"
        ).textContent =
            vehicleData.length;


        const uniqueCars =
            new Set(
                vehicleData.map(
                    item =>
                        item.carnum
                )
            );


        document.getElementById(
            "carCount"
        ).textContent =
            uniqueCars.size;

    }


    /* ==========================================================
       전체 지도 보기
    ========================================================== */

    function fitMap() {

        if (
            !vehicleData.length
        ) {
            return;
        }


        const bounds =
            new kakao.maps.LatLngBounds();


        vehicleData.forEach(
            (item) => {

                bounds.extend(

                    new kakao.maps.LatLng(

                        item.latitude,

                        item.longitude

                    )

                );

            }
        );


        map.setBounds(
            bounds
        );

    }


    /* ==========================================================
       날짜 포맷
    ========================================================== */

    function formatDate(value) {

        if (
            !/^\d{6}$/.test(value)
        ) {

            return "날짜 확인 필요";

        }


        const year =
            Number(
                value.substring(
                    0,
                    2
                )
            );


        const month =
            Number(
                value.substring(
                    2,
                    4
                )
            );


        const day =
            Number(
                value.substring(
                    4,
                    6
                )
            );


        if (
            month < 1 ||
            month > 12 ||
            day < 1 ||
            day > 31
        ) {

            return "날짜 확인 필요";

        }


        return (
            `20${String(year).padStart(2, "0")}.` +
            `${String(month).padStart(2, "0")}.` +
            `${String(day).padStart(2, "0")}`
        );

    }


    /* ==========================================================
       지도 버튼
    ========================================================== */

    document
        .getElementById("zoomIn")
        .addEventListener(
            "click",
            function() {

                map.setLevel(
                    map.getLevel() - 1
                );

            }
        );


    document
        .getElementById("zoomOut")
        .addEventListener(
            "click",
            function() {

                map.setLevel(
                    map.getLevel() + 1
                );

            }
        );


    document
        .getElementById("resetMap")
        .addEventListener(
            "click",
            function() {

                fitMap();


                if (activeInfoWindow) {

                    activeInfoWindow.close();

                }


                document
                    .querySelectorAll(
                        ".vehicle-item"
                    )
                    .forEach(
                        (element) => {

                            element.classList.remove(
                                "active"
                            );

                        }
                    );

            }
        );


    /* ==========================================================
       HTML Escape
    ========================================================== */

    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ==========================================================
       창 크기 변경
    ========================================================== */

    window.addEventListener(
        "resize",
        function() {

            map.relayout();

        }
    );

</script>
