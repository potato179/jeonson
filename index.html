<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <title>전손맵</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1115;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #ddd;

      /*
       * Firefox 모바일에서 지도 터치 영역이
       * 다른 fixed 요소에 의해 방해되는 것을 최소화
       */
      touch-action: pan-x pan-y;
    }

    /* =========================================================
       DESKTOP SIDEBAR
       ========================================================= */

    #sidebar {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;

      width: 390px;
      height: 100%;

      display: flex;
      flex-direction: column;

      color: #f5f7fa;
      background: rgba(15, 17, 21, 0.97);

      border-right: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 8px 0 30px rgba(0, 0, 0, 0.22);

      overflow: hidden;
    }

    .sidebar-header {
      flex: 0 0 auto;

      padding: 22px 22px 18px;

      border-bottom: 1px solid #252931;
    }

    .brand {
      color: #fff;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1.2px;
    }

    .subtitle {
      margin-top: 5px;

      color: #858b96;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .stats {
      display: flex;
      gap: 9px;
      margin-top: 18px;
    }

    .stat {
      flex: 1;
      min-width: 0;

      padding: 11px 13px;

      background: #191c22;
      border: 1px solid #282c34;
      border-radius: 11px;
    }

    .stat-label {
      color: #777e89;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .stat-value {
      margin-top: 3px;

      color: #f4f6f8;
      font-size: 19px;
      font-weight: 900;
    }

    .search-wrap {
      flex: 0 0 auto;

      padding: 13px 18px;

      background: #111318;
      border-bottom: 1px solid #252931;
    }

    #search,
    #mobileSearch {
      width: 100%;
      height: 42px;

      padding: 0 14px;

      outline: none;

      border: 1px solid #30343d;
      border-radius: 10px;

      color: #f4f6f8;
      background: #1a1d23;

      font-size: 13px;

      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    #search:focus,
    #mobileSearch:focus {
      border-color: #e66a3c;
      background: #1d2027;
    }

    #search::placeholder,
    #mobileSearch::placeholder {
      color: #6f7580;
    }

    #list {
      flex: 1 1 auto;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;

      padding: 6px 0;
    }

    /* =========================================================
       RECORD CARD
       ========================================================= */

    .record {
      position: relative;

      margin: 5px 10px;
      padding: 14px 14px 13px;

      background: #191c22;

      border: 1px solid #292d35;
      border-radius: 10px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;

      /*
       * Firefox 모바일에서 카드 터치 동작을 명확하게 처리
       */
      touch-action: manipulation;
    }

    .record:hover {
      background: #1d2026;
      border-color: #373c46;
    }

    .record:active {
      transform: scale(0.992);
    }

    .record.active {
      background: #211e1c;
      border-color: #b85b38;
    }

    .record.active::before {
      content: "";

      position: absolute;

      left: -1px;
      top: 10px;
      bottom: 10px;

      width: 3px;

      border-radius: 0 3px 3px 0;

      background: #e66a3c;
    }

    .record-top {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 12px;
    }

    .record-carnum {
      min-width: 0;

      color: #f1f3f5;

      font-size: 16px;
      font-weight: 900;

      line-height: 1.3;
      letter-spacing: -0.2px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .record-date {
      flex: 0 0 auto;

      padding-top: 2px;

      color: #8e949e;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.1px;
    }

    .record-car {
      min-width: 0;

      margin-top: 5px;

      color: #aeb4bd;

      font-size: 11px;
      font-weight: 600;

      line-height: 1.35;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .record-bottom {
      display: flex;

      align-items: center;

      margin-top: 9px;
      gap: 7px;

      min-width: 0;
    }

    .record-reason {
      min-width: 0;

      padding: 4px 7px;

      color: #aeb4bd;
      background: #22262d;

      border: 1px solid #30343c;
      border-radius: 5px;

      font-size: 10px;
      font-weight: 700;

      line-height: 1.2;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .record.active .record-carnum {
      color: #f0a17e;
    }

    .record.active .record-car {
      color: #c5c9cf;
    }

    .record.active .record-reason {
      color: #e89a78;
      background: #2a211d;
      border-color: #593a2f;
    }

    .empty {
      padding: 45px 20px;

      color: #717782;

      text-align: center;

      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================================================
       MAP TOOLS
       ========================================================= */

    .map-tools {
      position: absolute;
      z-index: 10;

      top: 18px;
      right: 18px;

      display: flex;
      gap: 7px;
    }

    .map-btn {
      height: 38px;

      padding: 0 13px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;

      color: #f7f8fa;
      background: rgba(17, 19, 23, 0.92);

      cursor: pointer;

      font-size: 11px;
      font-weight: 800;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .map-btn:hover {
      background: #20242b;
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* =========================================================
       INFO WINDOW
       ========================================================= */

    .info-window {
      min-width: 190px;

      padding: 12px 14px;

      color: #111;
      background: #fff;

      border-radius: 11px;

      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.22);
    }

    .info-title {
      color: #15171a;

      font-size: 14px;
      font-weight: 900;
    }

    .info-date {
      margin-top: 4px;

      color: #73777d;

      font-size: 11px;
    }

    .info-reason {
      margin-top: 8px;

      color: #d9572c;

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================================================
       MOBILE SHEET
       ========================================================= */

    #mobileSheet {
      display: none;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {
      html,
      body {
        width: 100%;
        height: 100%;

        overflow: hidden !important;

        position: fixed;
        inset: 0;
      }

      #app {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;
      }

      #map {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        /*
         * Firefox 모바일 지도 터치 전달
         */
        touch-action: pan-x pan-y;
      }

      #sidebar {
        display: none;
      }

      .map-tools {
        top: calc(12px + env(safe-area-inset-top));
        right: 12px;
      }

      .map-btn {
        height: 36px;

        padding: 0 11px;

        font-size: 10px;
      }

      #mobileSheet {
        display: flex;

        position: fixed;

        z-index: 100;

        left: 0;
        right: 0;
        bottom: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        flex-direction: column;
        justify-content: flex-end;

        transform:
          translate3d(
            0,
            calc(100% - 105px),
            0
          );

        transition: transform 0.28s ease;

        will-change: transform;

        /*
         * Firefox에서 fixed sheet 자체가
         * 지도 클릭을 막지 않도록 유지
         */
        touch-action: none;
      }

      #mobileSheet.dragging {
        transition: none;
      }

      .sheet-inner {
        width: 100%;
        height: calc(100% - env(safe-area-inset-top));

        max-height: calc(100% - env(safe-area-inset-top));

        display: flex;
        flex-direction: column;

        background: rgba(15, 17, 21, 0.98);

        border: 1px solid rgba(255, 255, 255, 0.07);
        border-bottom: 0;

        border-radius: 18px 18px 0 0;

        overflow: hidden;

        pointer-events: auto;

        box-shadow: 0 -8px 35px rgba(0, 0, 0, 0.3);

        /*
         * 시트 내부에서는 자체 터치 동작 허용
         */
        touch-action: pan-y;
      }

      .sheet-handle-area {
        flex: 0 0 auto;

        height: 32px;

        display: flex;

        justify-content: center;
        align-items: center;

        touch-action: none;

        cursor: grab;
      }

      .sheet-handle-area:active {
        cursor: grabbing;
      }

      .sheet-handle {
        width: 42px;
        height: 4px;

        border-radius: 999px;

        background: #555b65;
      }

      .mobile-header {
        flex: 0 0 auto;

        padding: 0 17px 12px;
      }

      .mobile-brand {
        color: #fff;

        font-size: 18px;
        font-weight: 900;

        letter-spacing: -0.8px;
      }

      .mobile-subtitle {
        margin-top: 3px;

        color: #7d838d;

        font-size: 10px;
        font-weight: 600;
      }

      .mobile-search {
        flex: 0 0 auto;

        padding: 0 14px 10px;
      }

      #mobileSearch {
        height: 39px;

        font-size: 12px;
      }

      .mobile-list {
        flex: 1 1 auto;

        min-height: 0;

        overflow-x: hidden;
        overflow-y: auto;

        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;

        padding:
          2px 4px
          calc(10px + env(safe-area-inset-bottom));
      }

      .mobile-list .record {
        margin: 5px 6px;

        padding: 13px 13px 12px;

        border-radius: 10px;

        /*
         * Firefox 모바일에서 카드 탭 처리 안정화
         */
        touch-action: manipulation;
      }

      .mobile-list .record-carnum {
        font-size: 15px;
      }

      .mobile-list .record-car {
        font-size: 10px;
      }

      .mobile-list .record-date {
        font-size: 10px;
      }

      .mobile-list .record-reason {
        font-size: 9px;
      }

      .mobile-list .record:last-child {
        margin-bottom: 5px;
      }
    }

    @media (min-width: 701px) {
      .mobile-list {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <div id="map"></div>

    <div class="map-tools">
      <button class="map-btn" id="fitBtn">
        전체보기
      </button>
    </div>

    <!-- =======================================================
         DESKTOP SIDEBAR
         ======================================================= -->

    <aside id="sidebar">

      <div class="sidebar-header">

        <div class="brand">
          🤪 전손맵
        </div>

        <div class="subtitle">
          다음은 너다!!! -사고차주 일동-
        </div>

        <div class="stats">

          <div class="stat">
            <div class="stat-label">
              RECORDS
            </div>

            <div class="stat-value" id="recordCount">
              0
            </div>
          </div>

          <div class="stat">
            <div class="stat-label">
              VEHICLES
            </div>

            <div class="stat-value" id="vehicleCount">
              0
            </div>
          </div>

        </div>
      </div>

      <div class="search-wrap">

        <input
          id="search"
          type="search"
          placeholder="차량번호, 차종, 사고사유 검색"
          autocomplete="off"
        />

      </div>

      <div id="list"></div>

    </aside>

    <!-- =======================================================
         MOBILE BOTTOM SHEET
         ======================================================= -->

    <section id="mobileSheet">

      <div class="sheet-inner">

        <div
          class="sheet-handle-area"
          id="sheetHandle"
        >
          <div class="sheet-handle"></div>
        </div>

        <div class="mobile-header">

          <div class="mobile-brand">
            🤪 전손맵
          </div>

          <div class="mobile-subtitle">
            다음은 너다!!! -사고차주 일동-
          </div>

        </div>

        <div class="mobile-search">

          <input
            id="mobileSearch"
            type="search"
            placeholder="차량번호, 차종, 사고사유 검색"
            autocomplete="off"
          />

        </div>

        <div
          class="mobile-list"
          id="mobileList"
        ></div>

      </div>

    </section>

  </div>

  <script>
    /* =========================================================
       GLOBAL STATE
       ========================================================= */

    let map;

    let allRecords = [];
    let filteredRecords = [];

    const recordById = new Map();
    const markerByRecordId = new Map();

    let selectedRecordId = null;
    let selectedInfoWindow = null;

    let mobileSheetPosition = "collapsed";

    const mobileSheet =
      document.getElementById("mobileSheet");

    const mobileList =
      document.getElementById("mobileList");

    const sheetHandle =
      document.getElementById("sheetHandle");


    /* =========================================================
       UTILITIES
       ========================================================= */

    function isMobile() {
      return window.innerWidth <= 700;
    }


    function formatDate(value) {
      if (!value) return "";

      const str = String(value);

      if (str.length !== 6) {
        return str;
      }

      return (
        `20${str.slice(0, 2)}.` +
        `${str.slice(2, 4)}.` +
        `${str.slice(4, 6)}`
      );
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function normalize(value) {
      return String(value ?? "")
        .toLowerCase()
        .replace(/\s+/g, "");
    }


    /* =========================================================
       MAP INITIALIZATION
       ========================================================= */

    function initMap() {
      const container =
        document.getElementById("map");

      map = new kakao.maps.Map(
        container,
        {
          center:
            new kakao.maps.LatLng(
              37.5665,
              126.9780
            ),

          level: 12
        }
      );


      /*
       * 지도 빈 영역 클릭
       */
      kakao.maps.event.addListener(
        map,
        "click",
        function() {

          if (selectedInfoWindow) {
            selectedInfoWindow.close();
            selectedInfoWindow = null;
          }

          selectedRecordId = null;

          updateActiveRecord();
        }
      );


      /*
       * 화면 크기 변경
       */
      window.addEventListener(
        "resize",
        function() {

          if (!map) return;

          map.relayout();
        }
      );
    }


    /* =========================================================
       DATA
       ========================================================= */

    async function loadData() {

      try {

        const response =
          await fetch(
            "./list.json",
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "list.json을 불러오지 못했습니다."
          );
        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {
          throw new Error(
            "list.json 형식이 올바르지 않습니다."
          );
        }


        /*
         * 원본 index를 recordId로 사용
         *
         * 정렬 이후에도 marker/list 대응이
         * 변하지 않도록 유지
         */
        allRecords =
          data.map(
            (item, index) => ({
              ...item,
              recordId: index
            })
          );


        /*
         * 날짜 내림차순
         * 최신 날짜가 위로
         */
        allRecords.sort(
          (a, b) =>
            String(b.date ?? "")
              .localeCompare(
                String(a.date ?? "")
              )
        );


        recordById.clear();


        allRecords.forEach(
          record => {
            recordById.set(
              record.recordId,
              record
            );
          }
        );


        filteredRecords =
          [...allRecords];


        updateStats();

        renderList();

        renderMarkers();

        fitMap();

      } catch (error) {

        console.error(error);

        document.getElementById(
          "list"
        ).innerHTML =
          `<div class="empty">
            데이터를 불러오지 못했습니다.
          </div>`;

        mobileList.innerHTML =
          `<div class="empty">
            데이터를 불러오지 못했습니다.
          </div>`;
      }
    }


    /* =========================================================
       STATS
       ========================================================= */

    function updateStats() {

      const records =
        allRecords.length;

      const vehicles =
        new Set(
          allRecords.map(
            record => record.carnum
          )
        ).size;


      document.getElementById(
        "recordCount"
      ).textContent = records;


      document.getElementById(
        "vehicleCount"
      ).textContent = vehicles;
    }


    /* =========================================================
       RECORD ELEMENT
       ========================================================= */

    function createRecordElement(record) {

      const element =
        document.createElement("div");


      element.className = "record";

      element.dataset.recordId =
        record.recordId;


      element.innerHTML = `

        <div class="record-top">

          <div class="record-carnum">
            ${escapeHtml(
              record.carnum || "-"
            )}
          </div>

          <div class="record-date">
            ${escapeHtml(
              formatDate(record.date)
            )}
          </div>

        </div>


        <div class="record-car">
          ${escapeHtml(
            record.car ||
            "차량 정보 없음"
          )}
        </div>


        ${
          record.reason
            ? `
              <div class="record-bottom">

                <div class="record-reason">
                  ${escapeHtml(
                    record.reason
                  )}
                </div>

              </div>
            `
            : ""
        }

      `;


      /*
       * Firefox 모바일 대응:
       *
       * click 이벤트 외에 pointerup을 이용해
       * 터치 탭이 정상적으로 전달되도록 한다.
       *
       * 단, 동일 탭에서 click이 중복 실행되지 않도록
       * 짧은 시간 동안 중복 호출을 방지한다.
       */

      let pointerHandled = false;


      element.addEventListener(
        "pointerup",
        function(event) {

          if (
            event.pointerType !== "touch"
          ) {
            return;
          }


          if (pointerHandled) {
            return;
          }


          pointerHandled = true;


          const id =
            Number(
              this.dataset.recordId
            );


          selectRecord(id);


          setTimeout(
            () => {
              pointerHandled = false;
            },
            350
          );
        },
        {
          passive: true
        }
      );


      element.addEventListener(
        "click",
        function() {

          /*
           * touch pointerup으로 이미 처리된 경우
           * Firefox/Chrome의 synthetic click 무시
           */
          if (pointerHandled) {
            return;
          }


          const id =
            Number(
              this.dataset.recordId
            );


          selectRecord(id);
        }
      );


      return element;
    }


    /* =========================================================
       RENDER LIST
       ========================================================= */

    function renderList() {

      const desktopList =
        document.getElementById(
          "list"
        );


      if (
        filteredRecords.length === 0
      ) {

        desktopList.innerHTML =
          `<div class="empty">
            검색 결과가 없습니다.
          </div>`;

        mobileList.innerHTML =
          `<div class="empty">
            검색 결과가 없습니다.
          </div>`;

        return;
      }


      const desktopFragment =
        document.createDocumentFragment();

      const mobileFragment =
        document.createDocumentFragment();


      filteredRecords.forEach(
        record => {

          desktopFragment.appendChild(
            createRecordElement(record)
          );

          mobileFragment.appendChild(
            createRecordElement(record)
          );

        }
      );


      desktopList.innerHTML = "";

      desktopList.appendChild(
        desktopFragment
      );


      mobileList.innerHTML = "";

      mobileList.appendChild(
        mobileFragment
      );


      updateActiveRecord();
    }


    /* =========================================================
       ACTIVE RECORD
       ========================================================= */

    function updateActiveRecord() {

      document
        .querySelectorAll(".record")
        .forEach(element => {

          const id =
            Number(
              element.dataset.recordId
            );


          element.classList.toggle(
            "active",
            id === selectedRecordId
          );

        });
    }


    /* =========================================================
       SEARCH
       ========================================================= */

    function filterRecords(keyword) {

      const query =
        normalize(keyword);


      if (!query) {

        filteredRecords =
          [...allRecords];

      } else {

        filteredRecords =
          allRecords.filter(
            record =>
              [
                record.carnum,
                record.car,
                record.date,
                record.reason
              ]
                .map(normalize)
                .some(
                  value =>
                    value.includes(query)
                )
          );
      }


      renderList();
    }


    document
      .getElementById("search")
      .addEventListener(
        "input",
        function() {

          filterRecords(
            this.value
          );
        }
      );


    document
      .getElementById("mobileSearch")
      .addEventListener(
        "input",
        function() {

          filterRecords(
            this.value
          );
        }
      );


    /* =========================================================
       MARKERS
       ========================================================= */

    function renderMarkers() {

      /*
       * 기존 marker 제거
       */
      markerByRecordId.forEach(
        marker => {
          marker.setMap(null);
        }
      );


      markerByRecordId.clear();


      allRecords.forEach(
        record => {

          const lat =
            Number(
              record.latitude
            );

          const lng =
            Number(
              record.longitude
            );


          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
          ) {
            return;
          }


          const position =
            new kakao.maps.LatLng(
              lat,
              lng
            );


          /*
           * Firefox 모바일 대응의 핵심
           *
           * clickable: true를 명시하여
           * Kakao Maps Marker가 터치/클릭
           * 이벤트 대상임을 확실하게 지정
           */
          const marker =
            new kakao.maps.Marker({
              position,
              map,

              clickable: true
            });


          markerByRecordId.set(
            record.recordId,
            marker
          );


          /*
           * Kakao Maps 기본 click 이벤트
           */
          kakao.maps.event.addListener(
            marker,
            "click",
            function() {

              openMarkerInfo(
                record.recordId,
                false
              );
            }
          );

        }
      );
    }


    /* =========================================================
       INFO WINDOW
       ========================================================= */

    function createInfoWindow(record) {

      const content = `

        <div class="info-window">

          <div class="info-title">
            ${escapeHtml(
              record.carnum ||
              record.car ||
              "차량"
            )}
          </div>


          ${
            record.car
              ? `
                <div class="info-date">
                  ${escapeHtml(
                    record.car
                  )}
                </div>
              `
              : ""
          }


          <div class="info-date">
            ${escapeHtml(
              formatDate(record.date)
            )}
          </div>


          ${
            record.reason
              ? `
                <div class="info-reason">
                  ${escapeHtml(
                    record.reason
                  )}
                </div>
              `
              : ""
          }

        </div>

      `;


      return new kakao.maps.InfoWindow({
        content,

        removable: false
      });
    }


    /* =========================================================
       OPEN MARKER
       ========================================================= */

    function openMarkerInfo(
      recordId,
      fromList = false
    ) {

      const record =
        recordById.get(
          recordId
        );

      const marker =
        markerByRecordId.get(
          recordId
        );


      if (!record || !marker) {
        return;
      }


      selectedRecordId =
        recordId;


      updateActiveRecord();


      /*
       * 목록에서 선택한 경우에만
       * 모바일 바텀시트를 접는다.
       *
       * 핀을 직접 클릭했을 때는
       * 바텀시트를 움직이지 않는다.
       */
      if (
        isMobile() &&
        fromList
      ) {

        setSheetPosition(
          "collapsed",
          true
        );
      }


      /*
       * 기존 InfoWindow 닫기
       */
      if (selectedInfoWindow) {

        selectedInfoWindow.close();

        selectedInfoWindow = null;
      }


      /*
       * 새 InfoWindow
       */
      const infoWindow =
        createInfoWindow(
          record
        );


      selectedInfoWindow =
        infoWindow;


      infoWindow.open(
        map,
        marker
      );


      /*
       * 핀 클릭 시 지도 확대
       *
       * 요청한 정확한 동작 유지
       */
      map.setLevel(4);


      map.panTo(
        marker.getPosition()
      );
    }


    /* =========================================================
       RECORD SELECT
       ========================================================= */

    function selectRecord(recordId) {

      openMarkerInfo(
        recordId,
        true
      );
    }


    /* =========================================================
       FIT MAP
       ========================================================= */

    function fitMap() {

      const bounds =
        new kakao.maps.LatLngBounds();

      let count = 0;


      allRecords.forEach(
        record => {

          const lat =
            Number(
              record.latitude
            );

          const lng =
            Number(
              record.longitude
            );


          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
          ) {
            return;
          }


          bounds.extend(
            new kakao.maps.LatLng(
              lat,
              lng
            )
          );


          count++;
        }
      );


      if (count === 0) {
        return;
      }


      map.setBounds(bounds);
    }


    document
      .getElementById("fitBtn")
      .addEventListener(
        "click",
        function() {

          fitMap();
        }
      );


    /* =========================================================
       MOBILE SHEET
       ========================================================= */

    function getSheetTranslate(
      position
    ) {

      const height =
        window.innerHeight;


      if (
        position === "expanded"
      ) {
        return 0;
      }


      if (
        position === "middle"
      ) {

        return Math.max(
          0,

          height -
            Math.min(
              height * 0.52,
              520
            )
        );
      }


      return Math.max(
        0,
        height - 105
      );
    }


    function setSheetPosition(
      position,
      animate = true
    ) {

      if (!isMobile()) {
        return;
      }


      mobileSheetPosition =
        position;


      if (animate) {

        mobileSheet.classList.remove(
          "dragging"
        );

      } else {

        mobileSheet.classList.add(
          "dragging"
        );
      }


      const translate =
        getSheetTranslate(
          position
        );


      mobileSheet.style.transform =
        `translate3d(0, ${translate}px, 0)`;
    }


    /* =========================================================
       MOBILE SHEET DRAG
       ========================================================= */

    let dragging = false;

    let dragStartY = 0;
    let dragStartTranslate = 0;
    let currentTranslate = 0;


    function getCurrentTranslate() {

      const matrix =
        window.getComputedStyle(
          mobileSheet
        ).transform;


      if (
        !matrix ||
        matrix === "none"
      ) {

        return getSheetTranslate(
          mobileSheetPosition
        );
      }


      const values =
        matrix
          .replace(
            "matrix3d(",
            ""
          )
          .replace(
            "matrix(",
            ""
          )
          .replace(
            ")",
            ""
          )
          .split(",");


      if (
        values.length === 16
      ) {

        return (
          Number(
            values[13]
          ) || 0
        );
      }


      if (
        values.length === 6
      ) {

        return (
          Number(
            values[5]
          ) || 0
        );
      }


      return getSheetTranslate(
        mobileSheetPosition
      );
    }


    function onDragStart(
      clientY
    ) {

      if (!isMobile()) {
        return;
      }


      dragging = true;


      mobileSheet.classList.add(
        "dragging"
      );


      dragStartY =
        clientY;


      dragStartTranslate =
        getCurrentTranslate();


      currentTranslate =
        dragStartTranslate;
    }


    function onDragMove(
      clientY
    ) {

      if (!dragging) {
        return;
      }


      const delta =
        clientY -
        dragStartY;


      let next =
        dragStartTranslate +
        delta;


      const min = 0;

      const max =
        window.innerHeight -
        105;


      next =
        Math.max(
          min,
          Math.min(
            max,
            next
          )
        );


      currentTranslate =
        next;


      mobileSheet.style.transform =
        `translate3d(0, ${next}px, 0)`;
    }


    function onDragEnd() {

      if (!dragging) {
        return;
      }


      dragging = false;


      mobileSheet.classList.remove(
        "dragging"
      );


      const positions = [
        {
          name: "expanded",
          value:
            getSheetTranslate(
              "expanded"
            )
        },

        {
          name: "middle",
          value:
            getSheetTranslate(
              "middle"
            )
        },

        {
          name: "collapsed",
          value:
            getSheetTranslate(
              "collapsed"
            )
        }
      ];


      let nearest =
        positions[0];


      positions.forEach(
        position => {

          if (
            Math.abs(
              position.value -
              currentTranslate
            ) <
            Math.abs(
              nearest.value -
              currentTranslate
            )
          ) {

            nearest =
              position;
          }

        }
      );


      setSheetPosition(
        nearest.name,
        true
      );
    }


    /* =========================================================
       TOUCH DRAG
       ========================================================= */

    sheetHandle.addEventListener(
      "touchstart",
      function(event) {

        if (
          !event.touches.length
        ) {
          return;
        }


        onDragStart(
          event.touches[0].clientY
        );

      },
      {
        passive: true
      }
    );


    sheetHandle.addEventListener(
      "touchmove",
      function(event) {

        if (
          !event.touches.length
        ) {
          return;
        }


        if (!dragging) {
          return;
        }


        event.preventDefault();


        onDragMove(
          event.touches[0].clientY
        );

      },
      {
        passive: false
      }
    );


    sheetHandle.addEventListener(
      "touchend",
      function() {

        onDragEnd();

      },
      {
        passive: true
      }
    );


    /* =========================================================
       MOUSE DRAG
       ========================================================= */

    sheetHandle.addEventListener(
      "mousedown",
      function(event) {

        onDragStart(
          event.clientY
        );


        const move =
          e => {

            onDragMove(
              e.clientY
            );
          };


        const up =
          () => {

            onDragEnd();


            document.removeEventListener(
              "mousemove",
              move
            );


            document.removeEventListener(
              "mouseup",
              up
            );
          };


        document.addEventListener(
          "mousemove",
          move
        );


        document.addEventListener(
          "mouseup",
          up
        );
      }
    );


    /* =========================================================
       MOBILE INITIALIZATION
       ========================================================= */

    function initializeMobileSheet() {

      if (isMobile()) {

        setSheetPosition(
          "collapsed",
          false
        );

      } else {

        mobileSheet.style.transform =
          "";
      }
    }


    /* =========================================================
       RESIZE
       ========================================================= */

    window.addEventListener(
      "resize",
      function() {

        if (isMobile()) {

          setSheetPosition(
            mobileSheetPosition,
            false
          );

        }
      }
    );


    /* =========================================================
       PREVENT DOCUMENT SCROLL
       ========================================================= */

    window.addEventListener(
      "scroll",
      function() {

        if (
          window.scrollY !== 0
        ) {

          window.scrollTo(
            0,
            0
          );
        }

      },
      {
        passive: true
      }
    );


    /* =========================================================
       INITIALIZE
       ========================================================= */

    initMap();

    initializeMobileSheet();

    loadData();

  </script>
</body>
</html>
