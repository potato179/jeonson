<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Vehicle Incident Map</title>

  <!-- Kakao Maps -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer"
  ></script>

  <style>
    :root {
      --bg: #080b0f;
      --panel: #0d1117;
      --panel-2: #11161d;
      --panel-3: #171d25;

      --text: #f5f7fa;
      --text-soft: #c4cbd4;
      --text-muted: #89929e;

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);

      --accent: #f05a3d;
      --accent-soft: rgba(240, 90, 61, 0.12);
      --accent-border: rgba(240, 90, 61, 0.42);

      --danger: #ff6962;

      --sidebar-width: 390px;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      background: var(--bg);
    }

    /* =========================================================
       MAP
    ========================================================= */

    #map {
      position: absolute;

      top: 0;
      right: 0;

      width: calc(100% - var(--sidebar-width));
      height: 100%;
    }

    .map-edge {
      position: absolute;

      z-index: 20;

      top: 0;
      left: var(--sidebar-width);

      width: 24px;
      height: 100%;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.2),
          transparent
        );
    }

    .map-badge {
      position: absolute;

      z-index: 25;

      top: 18px;
      right: 18px;

      display: flex;
      align-items: center;

      gap: 9px;

      padding: 10px 13px;

      border:
        1px solid rgba(0, 0, 0, 0.12);

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.94);

      color: #171a1f;

      box-shadow:
        0 7px 24px rgba(0, 0, 0, 0.18);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      font-size: 11px;
      font-weight: 750;
    }

    .map-badge-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 4px rgba(240, 90, 61, 0.13);
    }

    /* =========================================================
       DESKTOP SIDEBAR
    ========================================================= */

    .sidebar {
      position: absolute;

      z-index: 30;

      top: 0;
      left: 0;

      width: var(--sidebar-width);
      height: 100%;

      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          180deg,
          rgba(15, 19, 25, 0.985),
          rgba(9, 13, 18, 0.995)
        );

      border-right: 1px solid var(--border);

      box-shadow:
        20px 0 55px rgba(0, 0, 0, 0.28);
    }

    .sidebar-handle {
      display: none;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      flex: 0 0 auto;

      padding: 28px 26px 22px;

      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 16px;
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 10px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;

      color: var(--accent);
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 16px rgba(240, 90, 61, 0.65);
    }

    .title {
      font-size: 27px;
      line-height: 1.2;

      font-weight: 800;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin-top: 8px;

      font-size: 13px;
      line-height: 1.6;

      color: var(--text-muted);
    }

    .brand-mark {
      flex: 0 0 auto;

      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border-strong);
      border-radius: 13px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.02)
        );

      color: var(--accent);
    }

    .brand-mark svg {
      width: 21px;
      height: 21px;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 22px;
    }

    .stat {
      padding: 14px 15px;

      border: 1px solid var(--border);
      border-radius: var(--radius-md);

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.018)
        );
    }

    .stat-label {
      display: block;

      margin-bottom: 5px;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.04em;

      color: var(--text-muted);
    }

    .stat-value {
      display: flex;
      align-items: baseline;

      gap: 4px;

      font-size: 21px;
      line-height: 1;

      font-weight: 800;

      letter-spacing: -0.035em;
    }

    .stat-value small {
      font-size: 11px;
      font-weight: 600;

      color: var(--text-muted);
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-section {
      flex: 0 0 auto;

      padding: 18px 20px 14px;
    }

    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;

      top: 50%;
      left: 15px;

      width: 18px;
      height: 18px;

      transform: translateY(-50%);

      pointer-events: none;

      color: var(--text-muted);
    }

    .search {
      width: 100%;
      height: 48px;

      padding: 0 44px;

      outline: none;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--panel-3);

      color: var(--text);

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .search::placeholder {
      color: #69727f;
    }

    .search:focus {
      border-color: var(--accent-border);

      box-shadow:
        0 0 0 3px rgba(240, 90, 61, 0.09);
    }

    .search-clear {
      position: absolute;

      top: 50%;
      right: 8px;

      width: 34px;
      height: 34px;

      display: none;
      place-items: center;

      transform: translateY(-50%);

      border-radius: 9px;

      background: transparent;

      color: var(--text-muted);

      cursor: pointer;
    }

    .search-clear.visible {
      display: grid;
    }

    .search-clear:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .search-clear svg {
      width: 17px;
      height: 17px;
    }

    /* =========================================================
       LIST HEADER
    ========================================================= */

    .list-header {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px 11px;
    }

    .list-title {
      font-size: 11px;
      font-weight: 800;

      letter-spacing: 0.08em;

      color: var(--text-muted);
    }

    .result-count {
      font-size: 11px;
      font-weight: 700;

      color: var(--text-muted);
    }

    /* =========================================================
       LIST
    ========================================================= */

    .list {
      flex: 1 1 auto;

      min-height: 0;

      padding:
        0 14px 22px;

      overflow-y: auto;
      overflow-x: hidden;

      overscroll-behavior: contain;

      -webkit-overflow-scrolling: touch;

      touch-action: pan-y;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(255, 255, 255, 0.15)
        transparent;
    }

    .list::-webkit-scrollbar {
      width: 6px;
    }

    .list::-webkit-scrollbar-track {
      background: transparent;
    }

    .list::-webkit-scrollbar-thumb {
      background:
        rgba(255, 255, 255, 0.13);

      border-radius: 999px;
    }

    /* =========================================================
       RECORD
    ========================================================= */

    .record {
      position: relative;

      width: 100%;

      margin-bottom: 8px;

      padding: 16px;

      text-align: left;

      border: 1px solid transparent;
      border-radius: var(--radius-md);

      background: transparent;

      color: inherit;

      cursor: pointer;

      touch-action: manipulation;

      transition:
        background 0.16s ease,
        border-color 0.16s ease,
        transform 0.16s ease;
    }

    .record:hover {
      background:
        rgba(255, 255, 255, 0.045);

      border-color: var(--border);
    }

    .record:active {
      transform: scale(0.993);
    }

    .record.active {
      background:
        linear-gradient(
          135deg,
          rgba(240, 90, 61, 0.13),
          rgba(240, 90, 61, 0.055)
        );

      border-color:
        var(--accent-border);
    }

    .record.active::before {
      content: "";

      position: absolute;

      top: 14px;
      bottom: 14px;
      left: 0;

      width: 3px;

      border-radius:
        0 999px 999px 0;

      background: var(--accent);
    }

    .record-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .car-number {
      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 16px;
      line-height: 1.3;

      font-weight: 800;

      letter-spacing: -0.02em;
    }

    .date {
      flex: 0 0 auto;

      padding: 5px 7px;

      border: 1px solid var(--border);

      border-radius: 7px;

      background:
        rgba(255, 255, 255, 0.035);

      font-size: 10px;
      line-height: 1;

      font-weight: 750;

      color: var(--text-soft);
    }

    .date.invalid {
      border-color:
        rgba(255, 99, 93, 0.25);

      background:
        rgba(255, 99, 93, 0.08);

      color: #ff8f8a;
    }

    .car-name {
      margin-top: 7px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 13px;
      line-height: 1.45;

      font-weight: 600;

      color: var(--text-soft);
    }

    .reason {
      margin-top: 8px;

      display: -webkit-box;

      -webkit-box-orient: vertical;

      -webkit-line-clamp: 2;

      overflow: hidden;

      font-size: 12px;

      line-height: 1.6;

      color: var(--text-muted);

      word-break: keep-all;
    }

    .empty {
      padding: 50px 24px;

      text-align: center;

      font-size: 13px;
      line-height: 1.7;

      color: var(--text-muted);
    }

    /* =========================================================
       MOBILE TOP BAR
    ========================================================= */

    .mobile-map-header {
      display: none;
    }

    /* =========================================================
       INFO WINDOW
    ========================================================= */

    .info-window {
      width: 270px;

      padding: 15px 16px 16px;

      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #171a1f;
    }

    .info-title {
      margin-bottom: 10px;

      font-size: 15px;

      line-height: 1.3;

      font-weight: 800;

      letter-spacing: -0.02em;
    }

    .info-row {
      display: grid;

      grid-template-columns: 48px 1fr;

      gap: 8px;

      margin-top: 6px;

      font-size: 11px;

      line-height: 1.5;
    }

    .info-label {
      color: #7a8089;
      font-weight: 700;
    }

    .info-value {
      color: #2d3137;
      font-weight: 600;

      word-break: break-word;
    }

    .info-reason {
      margin-top: 11px;

      padding-top: 11px;

      border-top: 1px solid #eceef0;

      font-size: 11px;

      line-height: 1.6;

      color: #555b63;

      word-break: keep-all;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      position: absolute;

      z-index: 100;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      gap: 14px;

      background:
        rgba(8, 11, 15, 0.96);

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;

      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border:
        3px solid rgba(255, 255, 255, 0.1);

      border-top-color:
        var(--accent);

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;
    }

    .loading-text {
      font-size: 12px;

      color: var(--text-muted);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ERROR
    ========================================================= */

    .error-screen {
      position: fixed;

      z-index: 999;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background: var(--bg);
    }

    .error-screen.visible {
      display: flex;
    }

    .error-box {
      width: min(100%, 520px);

      padding: 26px;

      border:
        1px solid rgba(255, 99, 93, 0.22);

      border-radius: 18px;

      background: var(--panel);

      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .error-title {
      margin-bottom: 10px;

      font-size: 20px;

      font-weight: 800;

      color: #ff817b;
    }

    .error-message {
      font-size: 13px;

      line-height: 1.8;

      color: var(--text-soft);

      word-break: keep-all;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {
      :root {
        /*
         * Bottom Sheet 높이
         *
         * collapsed:
         * 화면 하단 약 32vh
         *
         * middle:
         * 약 57vh
         *
         * expanded:
         * 약 86vh
         */
        --sheet-collapsed: 32dvh;
        --sheet-middle: 57dvh;
        --sheet-expanded: 86dvh;
      }

      #map {
        inset: 0;

        width: 100%;
        height: 100%;
      }

      .map-edge,
      .map-badge {
        display: none;
      }

      /* =====================================================
         MOBILE MAP HEADER
      ===================================================== */

      .mobile-map-header {
        position: absolute;

        z-index: 35;

        top: 0;
        left: 0;
        right: 0;

        display: flex;

        align-items: flex-start;
        justify-content: space-between;

        gap: 10px;

        padding:
          calc(11px + env(safe-area-inset-top))
          12px
          10px;

        pointer-events: none;
      }

      .mobile-brand {
        min-width: 0;

        padding:
          10px 12px;

        border:
          1px solid rgba(255, 255, 255, 0.12);

        border-radius: 13px;

        background:
          rgba(10, 14, 19, 0.9);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow:
          0 8px 30px rgba(0, 0, 0, 0.28);

        pointer-events: auto;
      }

      .mobile-brand-label {
        margin-bottom: 3px;

        font-size: 9px;

        line-height: 1;

        letter-spacing: 0.12em;

        font-weight: 800;

        color: var(--accent);
      }

      .mobile-brand-title {
        overflow: hidden;

        white-space: nowrap;

        text-overflow: ellipsis;

        font-size: 13px;

        line-height: 1.25;

        font-weight: 800;
      }

      .mobile-stats {
        flex: 0 0 auto;

        display: flex;

        overflow: hidden;

        border:
          1px solid rgba(255, 255, 255, 0.12);

        border-radius: 13px;

        background:
          rgba(10, 14, 19, 0.9);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow:
          0 8px 30px rgba(0, 0, 0, 0.28);

        pointer-events: auto;
      }

      .mobile-stat {
        min-width: 54px;

        padding:
          9px 8px;

        text-align: center;
      }

      .mobile-stat + .mobile-stat {
        border-left:
          1px solid rgba(255, 255, 255, 0.1);
      }

      .mobile-stat strong {
        display: block;

        font-size: 14px;

        line-height: 1.15;

        font-weight: 800;
      }

      .mobile-stat span {
        display: block;

        margin-top: 2px;

        font-size: 8px;

        font-weight: 700;

        color: var(--text-muted);
      }

      /* =====================================================
         REAL MOBILE BOTTOM SHEET
      ===================================================== */

      .sidebar {
        position: absolute;

        top: auto;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100%;

        /*
         * Sheet의 전체 최대 높이
         */
        height: var(--sheet-expanded);

        /*
         * 처음에는 아래로 내려놓는다.
         *
         * expanded 높이가 86vh이고
         * collapsed 상태에서 보여줄 부분이 32vh이므로
         *
         * 86vh - 32vh = 54vh
         *
         * 만큼 아래로 이동.
         */
        transform:
          translate3d(
            0,
            calc(
              var(--sheet-expanded) -
              var(--sheet-collapsed)
            ),
            0
          );

        display: flex;

        flex-direction: column;

        border:
          1px solid rgba(255, 255, 255, 0.1);

        border-bottom: 0;

        border-radius:
          22px 22px 0 0;

        background:
          linear-gradient(
            180deg,
            rgba(15, 19, 25, 0.99),
            rgba(9, 13, 18, 0.995)
          );

        box-shadow:
          0 -18px 60px rgba(0, 0, 0, 0.4);

        /*
         * JS가 drag 중에 직접 transform을 변경한다.
         */
        will-change: transform;

        /*
         * 초기 snap 이후 transition 활성화
         */
        transition:
          transform 0.34s
          cubic-bezier(
            0.22,
            0.8,
            0.24,
            1
          );

        padding-bottom:
          env(safe-area-inset-bottom);
      }

      /*
       * 드래그 중에는 transition을 제거해서
       * 손가락과 패널이 1:1로 움직이게 함
       */
      .sidebar.is-dragging {
        transition: none;

        user-select: none;
      }

      /* =====================================================
         HANDLE
      ===================================================== */

      .sidebar-handle {
        flex: 0 0 auto;

        height: 31px;

        display: flex;

        align-items: center;
        justify-content: center;

        cursor: grab;

        touch-action: none;

        user-select: none;
      }

      .sidebar-handle:active {
        cursor: grabbing;
      }

      .sidebar-handle::before {
        content: "";

        width: 42px;
        height: 4px;

        border-radius: 999px;

        background:
          rgba(255, 255, 255, 0.19);
      }

      /* =====================================================
         MOBILE HEADER HIDDEN
      ===================================================== */

      .header {
        display: none;
      }

      /* =====================================================
         MOBILE SEARCH
      ===================================================== */

      .search-section {
        flex: 0 0 auto;

        padding:
          0 12px 10px;
      }

      .search {
        height: 46px;

        font-size: 14px;

        border-radius: 13px;

        background:
          #171d25;
      }

      /* =====================================================
         MOBILE LIST HEADER
      ===================================================== */

      .list-header {
        flex: 0 0 auto;

        padding:
          0 15px 9px;
      }

      .list-title {
        font-size: 10px;
      }

      .result-count {
        font-size: 10px;
      }

      /* =====================================================
         MOBILE LIST
      ===================================================== */

      .list {
        flex: 1 1 0;

        min-height: 0;

        overflow-y: auto;
        overflow-x: hidden;

        /*
         * 패널 드래그와 분리.
         *
         * 목록 안에서는 세로 스크롤이 우선이다.
         */
        touch-action: pan-y;

        overscroll-behavior-y: contain;

        -webkit-overflow-scrolling: touch;

        scroll-behavior: smooth;

        padding:
          0 8px
          calc(
            16px +
            env(safe-area-inset-bottom)
          );
      }

      /* =====================================================
         MOBILE RECORD
      ===================================================== */

      .record {
        margin-bottom: 7px;

        padding:
          13px;

        border-radius: 13px;

        background:
          rgba(255, 255, 255, 0.025);

        border-color:
          rgba(255, 255, 255, 0.045);

        touch-action: manipulation;
      }

      .record:hover {
        background:
          rgba(255, 255, 255, 0.025);
      }

      .record.active {
        background:
          linear-gradient(
            135deg,
            rgba(240, 90, 61, 0.15),
            rgba(240, 90, 61, 0.06)
          );

        border-color:
          rgba(240, 90, 61, 0.43);
      }

      .record.active::before {
        top: 12px;
        bottom: 12px;

        width: 3px;
      }

      .car-number {
        font-size: 16px;
      }

      .date {
        padding:
          5px 7px;

        font-size: 9px;
      }

      .car-name {
        margin-top: 5px;

        font-size: 13px;

        color: #b9c0c9;
      }

      .reason {

  <script>
    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let map = null;

    let clusterer = null;

    let records = [];

    let markers = [];

    let infoWindows = [];

    let activeInfoWindow = null;

    let activeRecordIndex = null;


    /* =========================================================
       DOM
    ========================================================= */

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const sidebarHandle =
      document.getElementById(
        "sidebarHandle"
      );

    const recordList =
      document.getElementById(
        "recordList"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const searchClear =
      document.getElementById(
        "searchClear"
      );

    const totalCount =
      document.getElementById(
        "totalCount"
      );

    const carCount =
      document.getElementById(
        "carCount"
      );

    const mobileTotalCount =
      document.getElementById(
        "mobileTotalCount"
      );

    const mobileCarCount =
      document.getElementById(
        "mobileCarCount"
      );

    const resultCount =
      document.getElementById(
        "resultCount"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const errorScreen =
      document.getElementById(
        "errorScreen"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* =========================================================
       MOBILE BOTTOM SHEET STATE
    ========================================================= */

    const sheetState = {
      current: "collapsed",

      dragging: false,

      startY: 0,

      startTranslate: 0,

      currentTranslate: 0,

      lastY: 0,

      lastTime: 0,

      velocity: 0
    };


    /*
     * 실제 pixel 기준 snap 위치
     *
     * expanded:
     *   panel이 화면 위쪽까지 거의 올라온 상태
     *
     * middle:
     *   중간 상태
     *
     * collapsed:
     *   하단에 일부만 보이는 상태
     */

    function getSheetPositions() {
      if (
        window.innerWidth > 800
      ) {
        return null;
      }


      const viewportHeight =
        window.innerHeight;


      const expanded =
        viewportHeight * 0.14;


      const middle =
        viewportHeight * 0.43;


      const collapsed =
        viewportHeight * 0.68;


      return {
        expanded,
        middle,
        collapsed
      };
    }


    function isMobile() {
      return window.innerWidth <= 800;
    }


    function getCurrentSheetTranslate() {
      const positions =
        getSheetPositions();

      if (!positions) {
        return 0;
      }


      return sheetState.current ===
        "expanded"
        ? positions.expanded
        : sheetState.current ===
          "middle"
          ? positions.middle
          : positions.collapsed;
    }


    function setSheetPosition(
      state,
      animate = true
    ) {
      if (!isMobile()) {
        return;
      }


      const positions =
        getSheetPositions();

      if (!positions) {
        return;
      }


      sheetState.current =
        state;


      const translate =
        state === "expanded"
          ? positions.expanded
          : state === "middle"
            ? positions.middle
            : positions.collapsed;


      sheetState.currentTranslate =
        translate;


      sidebar.classList.toggle(
        "is-dragging",
        !animate
      );


      sidebar.style.transform =
        `translate3d(0, ${translate}px, 0)`;


      if (!animate) {
        requestAnimationFrame(
          () => {
            sidebar.classList.remove(
              "is-dragging"
            );
          }
        );
      }
    }


    function getNearestSheetState(
      translate
    ) {
      const positions =
        getSheetPositions();

      if (!positions) {
        return "collapsed";
      }


      const candidates = [
        {
          name: "expanded",
          value: positions.expanded
        },

        {
          name: "middle",
          value: positions.middle
        },

        {
          name: "collapsed",
          value: positions.collapsed
        }
      ];


      let nearest =
        candidates[0];


      let minDistance =
        Math.abs(
          translate -
          nearest.value
        );


      for (
        let i = 1;
        i < candidates.length;
        i++
      ) {
        const distance =
          Math.abs(
            translate -
            candidates[i].value
          );


        if (
          distance <
          minDistance
        ) {
          minDistance =
            distance;

          nearest =
            candidates[i];
        }
      }


      return nearest.name;
    }


    function clampSheetTranslate(
      value
    ) {
      const positions =
        getSheetPositions();

      if (!positions) {
        return value;
      }


      return Math.max(
        positions.expanded,
        Math.min(
          positions.collapsed,
          value
        )
      );
    }


    /* =========================================================
       BOTTOM SHEET DRAG
    ========================================================= */

    function startSheetDrag(
      event
    ) {
      if (!isMobile()) {
        return;
      }


      /*
       * 목록 자체에서 시작한 터치는
       * Bottom Sheet 드래그로 처리하지 않는다.
       *
       * 목록은 독립적으로 스크롤해야 하기 때문.
       */

      if (
        event.target.closest(
          ".list"
        )
      ) {
        return;
      }


      /*
       * input에 대한 터치도 제외
       */

      if (
        event.target.closest(
          "input, button"
        )
      ) {
        return;
      }


      const touch =
        event.touches
          ? event.touches[0]
          : event;


      sheetState.dragging =
        true;

      sheetState.startY =
        touch.clientY;

      sheetState.startTranslate =
        getCurrentSheetTranslate();

      sheetState.currentTranslate =
        sheetState.startTranslate;

      sheetState.lastY =
        touch.clientY;

      sheetState.lastTime =
        performance.now();

      sheetState.velocity =
        0;


      sidebar.classList.add(
        "is-dragging"
      );


      /*
       * 문서 전체에서 touchmove를 잡기 위해
       * preventDefault 가능한 상태로 둔다.
       */

      if (
        event.cancelable
      ) {
        event.preventDefault();
      }
    }


    function moveSheetDrag(
      event
    ) {
      if (
        !sheetState.dragging ||
        !isMobile()
      ) {
        return;
      }


      const touch =
        event.touches
          ? event.touches[0]
          : event;


      const currentY =
        touch.clientY;


      const delta =
        currentY -
        sheetState.startY;


      let translate =
        sheetState.startTranslate +
        delta;


      translate =
        clampSheetTranslate(
          translate
        );


      const now =
        performance.now();


      const dt =
        now -
        sheetState.lastTime;


      if (dt > 0) {
        sheetState.velocity =
          (currentY -
            sheetState.lastY) /
          dt;
      }


      sheetState.lastY =
        currentY;

      sheetState.lastTime =
        now;


      sheetState.currentTranslate =
        translate;


      sidebar.style.transform =
        `translate3d(0, ${translate}px, 0)`;


      if (
        event.cancelable
      ) {
        event.preventDefault();
      }
    }


    function endSheetDrag() {
      if (
        !sheetState.dragging
      ) {
        return;
      }


      sheetState.dragging =
        false;


      sidebar.classList.remove(
        "is-dragging"
      );


      let translate =
        sheetState.currentTranslate;


      /*
       * 빠르게 스와이프한 경우
       * 현재 위치보다 한 단계 더 이동
       */

      const velocity =
        sheetState.velocity;


      const positions =
        getSheetPositions();


      if (!positions) {
        return;
      }


      /*
       * 위로 빠르게 스와이프
       *
       * velocity < 0
       */

      if (
        velocity <
        -0.65
      ) {
        if (
          translate >
          positions.middle
        ) {
          translate =
            positions.middle;
        } else {
          translate =
            positions.expanded;
        }
      }

      /*
       * 아래로 빠르게 스와이프
       *
       * velocity > 0
       */

      else if (
        velocity >
        0.65
      ) {
        if (
          translate <
          positions.middle
        ) {
          translate =
            positions.middle;
        } else {
          translate =
            positions.collapsed;
        }
      }


      const state =
        getNearestSheetState(
          translate
        );


      setSheetPosition(
        state,
        true
      );
    }


    /*
     * Handle
     */

    sidebarHandle.addEventListener(
      "touchstart",
      startSheetDrag,
      {
        passive: false
      }
    );


    sidebarHandle.addEventListener(
      "touchmove",
      moveSheetDrag,
      {
        passive: false
      }
    );


    sidebarHandle.addEventListener(
      "touchend",
      endSheetDrag
    );


    sidebarHandle.addEventListener(
      "touchcancel",
      endSheetDrag
    );


    /*
     * Search / list header 영역에서도
     * 패널을 잡고 이동할 수 있게 한다.
     *
     * 단, 실제 input은 제외된다.
     */

    sidebar.addEventListener(
      "touchstart",
      startSheetDrag,
      {
        passive: false
      }
    );


    sidebar.addEventListener(
      "touchmove",
      moveSheetDrag,
      {
        passive: false
      }
    );


    sidebar.addEventListener(
      "touchend",
      endSheetDrag
    );


    sidebar.addEventListener(
      "touchcancel",
      endSheetDrag
    );


    /* =========================================================
       DESKTOP / MOBILE SWITCH
    ========================================================= */

    function updateSheetForViewport() {
      if (!isMobile()) {

        sidebar.style.transform =
          "";

        sidebar.classList.remove(
          "is-dragging"
        );

        return;
      }


      /*
       * 모바일 최초 상태
       */

      const current =
        sheetState.current;


      setSheetPosition(
        current,
        false
      );
    }


    /* =========================================================
       UTILITY
    ========================================================= */

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function parseRecordDate(
      rawDate
    ) {
      const value =
        String(
          rawDate ?? ""
        ).trim();


      if (
        !/^\d{6}$/.test(
          value
        )
      ) {
        return {
          valid: false,

          text:
            value ||
            "날짜 미상"
        };
      }


      const yy =
        Number(
          value.slice(0, 2)
        );

      const mm =
        Number(
          value.slice(2, 4)
        );

      const dd =
        Number(
          value.slice(4, 6)
        );


      const year =
        2000 + yy;


      const date =
        new Date(
          year,
          mm - 1,
          dd
        );


      const valid =
        mm >= 1 &&
        mm <= 12 &&
        dd >= 1 &&
        dd <= 31 &&
        date.getFullYear() ===
          year &&
        date.getMonth() ===
          mm - 1 &&
        date.getDate() ===
          dd;


      if (!valid) {
        return {
          valid: false,

          text:
            "날짜 확인 필요"
        };
      }


      return {
        valid: true,

        text:
          String(year).slice(2) +
          "." +
          String(mm).padStart(
            2,
            "0"
          ) +
          "." +
          String(dd).padStart(
            2,
            "0"
          )
      };
    }


    function showError(
      message
    ) {
      loading.classList.add(
        "hidden"
      );

      errorMessage.innerHTML =
        escapeHtml(message)
          .replace(
            /\n/g,
            "<br>"
          );

      errorScreen.classList.add(
        "visible"
      );
    }


    /* =========================================================
       INFO WINDOW CONTROL
    ========================================================= */

    function closeActiveInfoWindow() {
      if (
        activeInfoWindow
      ) {
        activeInfoWindow.close();

        activeInfoWindow =
          null;
      }
    }


    function openMarkerInfo(
      index,
      marker,
      infoWindow
    ) {
      if (!map) {
        return;
      }


      const item =
        records[index];


      if (!item) {
        return;
      }


      /*
       * 다른 팝업 닫기
       */

      closeActiveInfoWindow();


      /*
       * 현재 기록
       */

      activeRecordIndex =
        index;


      /*
       * 목록 active
       */

      document
        .querySelectorAll(
          ".record"
        )
        .forEach(
          (element) => {

            element.classList.toggle(
              "active",

              Number(
                element.dataset.index
              ) === index
            );

          }
        );


      /*
       * 지도 이동
       */

      const position =
        new kakao.maps.LatLng(
          Number(
            item.latitude
          ),

          Number(
            item.longitude
          )
        );


      map.panTo(
        position
      );


      /*
       * 팝업 열기
       */

      infoWindow.open(
        map,
        marker
      );


      activeInfoWindow =
        infoWindow;


      /*
       * 모바일에서 팝업을 보기 쉽게
       * 패널을 살짝 내려서 지도 공간 확보
       *
       * 단, 이미 collapsed 상태면 그대로 둔다.
       */

      if (
        isMobile() &&
        sheetState.current ===
          "expanded"
      ) {
        setSheetPosition(
          "middle",
          true
        );
      }


      /*
       * 선택 목록으로 이동
       */

      const selectedElement =
        document.querySelector(
          `.record[data-index="${index}"]`
        );


      if (
        selectedElement
      ) {
        selectedElement.scrollIntoView(
          {
            behavior:
              "smooth",

            block:
              "nearest"
          }
        );
      }
    }


    /* =========================================================
       MAP INITIALIZATION
    ========================================================= */

    function initMap() {
      const mapContainer =
        document.getElementById(
          "map"
        );


      const mapOptions = {
        center:
          new kakao.maps.LatLng(
            37.5665,
            126.9780
          ),

        level: 8
      };


      map =
        new kakao.maps.Map(
          mapContainer,
          mapOptions
        );


      /*
       * Zoom
       */

      const zoomControl =
        new kakao.maps.ZoomControl();


      map.addControl(
        zoomControl,

        kakao.maps.ControlPosition.RIGHT
      );


      /*
       * Clusterer
       */

      clusterer =
        new kakao.maps.MarkerClusterer({
          map: map,

          averageCenter: true,

          minLevel: 6,

          disableClickZoom: false
        });


      /*
       * 중요
       *
       * 지도 전체 click 이벤트로
       * 팝업을 닫지 않는다.
       *
       * 그래야 모바일에서 핀을 터치했을 때
       * InfoWindow가 바로 닫히지 않는다.
       */

      loadData();
    }


    /* =========================================================
       LOAD DATA
    ========================================================= */

    async function loadData() {
      try {

        const response =
          await fetch(
            "./list.json",
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {
          throw new Error(
            `list.json 요청 실패 (${response.status})`
          );
        }


        const json =
          await response.json();


        if (
          !Array.isArray(
            json
          )
        ) {
          throw new Error(
            "list.json 데이터 형식이 배열이 아닙니다."
          );
        }


        records =
          json.filter(
            (item) => {

              const lat =
                Number(
                  item.latitude
                );

              const lng =
                Number(
                  item.longitude
                );


              return (
                Number.isFinite(
                  lat
                ) &&
                Number.isFinite(
                  lng
                )
              );
            }
          );


        updateStats();

        renderList(
          records
        );

        createMarkers(
          records
        );

        fitMap();


        loading.classList.add(
          "hidden"
        );


      } catch (
        error
      ) {

        console.error(
          error
        );


        showError(
          "list.json 파일을 확인해주세요.\n\n" +
          error.message
        );
      }
    }


    /* =========================================================
       STATS
    ========================================================= */

    function updateStats() {

      const uniqueVehicles =
        new Set(
          records
            .map(
              (item) =>
                String(
                  item.carnum ??
                    ""
                ).trim()
            )
            .filter(
              Boolean
            )
        );


      const total =
        records.length;


      const vehicles =
        uniqueVehicles.size;


      totalCount.textContent =
        total;

      carCount.textContent =
        vehicles;

      mobileTotalCount.textContent =
        total;

      mobileCarCount.textContent =
        vehicles;
    }


    function updateResultCount(
      count
    ) {
      resultCount.textContent =
        `${count} record${
          count === 1
            ? ""
            : "s"
        }`;
    }


    /* =========================================================
       RENDER LIST
    ========================================================= */

    function renderList(
      data
    ) {
      recordList.innerHTML =
        "";


      updateResultCount(
        data.length
      );


      if (
        !data.length
      ) {

        recordList.innerHTML = `
          <div class="empty">
            검색 조건에 해당하는 기록이 없습니다.
          </div>
        `;

        return;
      }


      const fragment =
        document.createDocumentFragment();


      data.forEach(
        (item) => {

          const originalIndex =
            records.indexOf(
              item
            );


          const dateInfo =
            parseRecordDate(
              item.date
            );


          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "record";


          button.dataset.index =
            originalIndex;


          if (
            activeRecordIndex ===
            originalIndex
          ) {
            button.classList.add(
              "active"
            );
          }


          button.innerHTML = `
            <div class="record-top">

              <div class="car-number">
                ${escapeHtml(
                  item.carnum ||
                  "차량번호 없음"
                )}
              </div>

              <div class="date ${
                dateInfo.valid
                  ? ""
                  : "invalid"
              }">
                ${escapeHtml(
                  dateInfo.text
                )}
              </div>

            </div>

            <div class="car-name">
              ${escapeHtml(
                item.car ||
                "차종 정보 없음"
              )}
            </div>

            <div class="reason">
              ${escapeHtml(
                item.reason ||
                "사고 내용 없음"
              )}
            </div>
          `;


          button.addEventListener(
            "click",
            () => {

              selectRecord(
                originalIndex
              );

            }
          );


          fragment.appendChild(
            button
          );

        }
      );


      recordList.appendChild(
        fragment
      );
    }


    /* =========================================================
       CREATE MARKERS
    ========================================================= */

    function createMarkers(
      data
    ) {

      /*
       * 기존 팝업
       */

      closeActiveInfoWindow();


      /*
       * 기존 cluster
       */

      if (
        clusterer
      ) {
        clusterer.clear();
      }


      /*
       * 기존 marker
       */

      markers.forEach(
        (marker) => {

          marker.setMap(
            null
          );

        }
      );


      markers =
        [];

      infoWindows =
        [];


      /*
       * marker 생성
       */

      data.forEach(
        (item) => {

          const originalIndex =
            records.indexOf(
              item
            );


          const position =
            new kakao.maps.LatLng(
              Number(
                item.latitude
              ),

              Number(
                item.longitude
              )
            );


          const marker =
            new kakao.maps.Marker({
              position
            });


          marker.__recordIndex =
            originalIndex;


          const infoWindow =
            new kakao.maps.InfoWindow({
              removable:
                false,

              content:
                createInfoWindowContent(
                  item
                )
            });


          /*
           * Marker click
           *
           * 이 이벤트 안에서 직접 InfoWindow를
           * 열기 때문에 모바일에서도 유지된다.
           */

          kakao.maps.event.addListener(
            marker,
            "click",
            () => {

              openMarkerInfo(
                originalIndex,

                marker,

                infoWindow
              );

            }
          );


          markers.push(
            marker
          );


          infoWindows.push({
            marker,

            infoWindow,

            originalIndex
          });

        }
      );


      if (
        clusterer
      ) {
        clusterer.addMarkers(
          markers
        );
      }
    }


    /* =========================================================
       INFO WINDOW
    ========================================================= */

    function createInfoWindowContent(
      item
    ) {

      const dateInfo =
        parseRecordDate(
          item.date
        );


      return `
        <div class="info-window">

          <div class="info-title">
            ${escapeHtml(
              item.carnum ||
              "차량번호 없음"
            )}
          </div>

          <div class="info-row">

            <div class="info-label">
              차종
            </div>

            <div class="info-value">
              ${escapeHtml(
                item.car ||
                "-"
              )}
            </div>

          </div>

          <div class="info-row">

            <div class="info-label">
              일자
            </div>

            <div class="info-value">
              ${escapeHtml(
                dateInfo.text
              )}
            </div>

          </div>

          <div class="info-reason">
            ${escapeHtml(
              item.reason ||
              "사고 내용 없음"
            )}
          </div>

        </div>
      `;
    }


    /* =========================================================
       SELECT RECORD
    ========================================================= */

    function selectRecord(
      index
    ) {

      const item =
        records[index];


      if (!item) {
        return;
      }


      const pair =
        infoWindows.find(
          (entry) =>
            entry.originalIndex ===
            index
        );


      if (!pair) {
        return;
      }


      openMarkerInfo(
        index,

        pair.marker,

        pair.infoWindow
      );
    }


    /* =========================================================
       FIT MAP
    ========================================================= */

    function fitMap() {

      if (
        !map ||
        !markers.length
      ) {
        return;
      }


      if (
        markers.length === 1
      ) {

        map.setCenter(
          markers[0].getPosition()
        );

        map.setLevel(
          4
        );

        return;
      }


      const bounds =
        new kakao.maps.LatLngBounds();


      markers.forEach(
        (marker) => {

          bounds.extend(
            marker.getPosition()
          );

        }
      );


      map.setBounds(
        bounds
      );
    }


    /* =========================================================
       SEARCH
    ========================================================= */

    function runSearch() {

      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();


      searchClear.classList.toggle(
        "visible",

        Boolean(
          keyword
        )
      );


      activeRecordIndex =
        null;


      closeActiveInfoWindow();


      /*
       * 검색어 없음
       */

      if (
        !keyword
      ) {

        renderList(
          records
        );

        createMarkers(
          records
        );

        fitMap();

        return;
      }


      /*
       * 검색
       */

      const filtered =
        records.filter(
          (item) => {

            const target =
              [
                item.carnum,
                item.car,
                item.date,
                item.reason
              ]
                .join(" ")
                .toLowerCase();


            return target.includes(
              keyword
            );
          }
        );


      renderList(
        filtered
      );


      createMarkers(
        filtered
      );


      if (
        filtered.length
      ) {
        fitMap();
      }
    }


    searchInput.addEventListener(
      "input",
      runSearch
    );


    searchClear.addEventListener(
      "click",
      () => {

        searchInput.value =
          "";

        searchInput.focus();

        runSearch();

      }
    );


    /* =========================================================
       RESIZE
    ========================================================= */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if (
                !map
              ) {
                return;
              }


              map.relayout();


              if (
                isMobile()
              ) {

                /*
                 * 현재 Bottom Sheet 위치 유지
                 */

                setSheetPosition(
                  sheetState.current,
                  false
                );

              }


              if (
                activeRecordIndex !==
                null
              ) {

                const item =
                  records[
                    activeRecordIndex
                  ];


                if (
                  item
                ) {

                  map.setCenter(
                    new kakao.maps.LatLng(
                      Number(
                        item.latitude
                      ),

                      Number(
                        item.longitude
                      )
                    )
                  );

                }

              } else {

                fitMap();

              }

            },

            160
          );

      }
    );


    /* =========================================================
       INIT
    ========================================================= */

    window.addEventListener(
      "load",
      () => {

        /*
         * 모바일 Bottom Sheet 초기 위치
         */

        if (
          isMobile()
        ) {

          setSheetPosition(
            "collapsed",
            false
          );

        }


        /*
         * Kakao SDK 확인
         */

        if (
          typeof kakao ===
            "undefined" ||
          !kakao.maps
        ) {

          showError(
            "Kakao Maps SDK를 불러오지 못했습니다.\n" +
            "JavaScript 키와 등록된 사이트 도메인을 확인해주세요."
          );

          return;
        }


        kakao.maps.load(
          () => {

            initMap();

          }
        );

      }
    );
  </script>

</body>
</html>
