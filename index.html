<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Vehicle Incident Map</title>

  <style>
    :root {
      --bg: #080b0f;
      --panel: #0d1117;
      --panel-2: #11161d;
      --panel-3: #171d25;

      --text: #f5f7fa;
      --text-soft: #c4cbd4;
      --text-muted: #89929e;

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);

      --accent: #f05a3d;
      --accent-soft: rgba(240, 90, 61, 0.12);
      --accent-border: rgba(240, 90, 61, 0.42);

      --danger: #ff6962;

      --sidebar-width: 390px;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;

      --sheet-collapsed: 32dvh;
      --sheet-middle: 57dvh;
      --sheet-expanded: 86dvh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    body {
      position: relative;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      outline: 0;
    }

    #app {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }

    /* =========================================================
       MAP
    ========================================================= */

    #map {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #10151b;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      position: absolute;

      z-index: 30;

      top: 0;
      left: 0;
      bottom: 0;

      width: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(13, 17, 23, 0.98),
          rgba(8, 11, 15, 0.98)
        );

      border-right: 1px solid var(--border);

      box-shadow:
        12px 0 40px rgba(0, 0, 0, 0.28);
    }

    .sidebar-header {
      flex: 0 0 auto;

      padding:
        28px
        24px
        20px;

      border-bottom:
        1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 22px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #ff704f,
          #c93622
        );

      color: #fff;

      font-size: 17px;
      font-weight: 900;

      box-shadow:
        0 8px 22px
        rgba(240, 90, 61, 0.22);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;

      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      margin-top: 2px;

      color: var(--text-muted);

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.04em;

      text-transform: uppercase;
    }

    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;

      left: 14px;
      top: 50%;

      width: 16px;
      height: 16px;

      transform:
        translateY(-50%);

      color: var(--text-muted);

      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 46px;

      padding:
        0
        14px
        0
        42px;

      border:
        1px solid var(--border);

      border-radius: 13px;

      outline: none;

      background: var(--panel-2);
      color: var(--text);

      font-size: 13px;
      font-weight: 600;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    #search::placeholder {
      color: #66707c;
    }

    #search:focus {
      border-color:
        var(--accent-border);

      background:
        var(--panel-3);
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      padding:
        16px
        24px;

      border-bottom:
        1px solid var(--border);
    }

    .stat {
      padding: 14px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-md);

      background:
        rgba(255, 255, 255, 0.025);
    }

    .stat-label {
      color: var(--text-muted);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.05em;

      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;

      color: var(--text);

      font-size: 22px;
      font-weight: 850;

      letter-spacing: -0.04em;
    }

    /* =========================================================
       LIST HEADER
    ========================================================= */

    .list-header {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        15px
        24px
        11px;
    }

    .list-title {
      font-size: 12px;
      font-weight: 800;

      letter-spacing: -0.01em;
    }

    .list-count {
      color: var(--text-muted);

      font-size: 11px;
      font-weight: 700;
    }

    /* =========================================================
       LIST
    ========================================================= */

    .list {
      flex: 1 1 auto;

      min-height: 0;

      padding:
        0
        12px
        20px;

      overflow-y: auto;

      overscroll-behavior: contain;

      touch-action: pan-y;

      scrollbar-width: thin;

      scrollbar-color:
        #2b333d
        transparent;
    }

    .list::-webkit-scrollbar {
      width: 5px;
    }

    .list::-webkit-scrollbar-track {
      background: transparent;
    }

    .list::-webkit-scrollbar-thumb {
      background: #2b333d;

      border-radius: 10px;
    }

    .record {
      width: 100%;

      display: block;

      margin:
        0
        0
        7px;

      padding: 15px;

      border:
        1px solid transparent;

      border-radius:
        var(--radius-md);

      background:
        rgba(255, 255, 255, 0.025);

      color: var(--text);

      text-align: left;

      cursor: pointer;

      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .record:hover {
      background:
        rgba(255, 255, 255, 0.045);

      border-color:
        var(--border);
    }

    .record:active {
      transform:
        scale(0.99);
    }

    .record.active {
      background:
        var(--accent-soft);

      border-color:
        var(--accent-border);
    }

    .record-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .record-car-number {
      color: var(--text);

      font-size: 14px;
      font-weight: 850;

      letter-spacing: -0.02em;
    }

    .record-date {
      flex: 0 0 auto;

      padding:
        4px
        7px;

      border-radius: 7px;

      background:
        rgba(255, 255, 255, 0.06);

      color: var(--text-muted);

      font-size: 10px;
      font-weight: 700;
    }

    .record-date.invalid {
      color: #ff8179;

      background:
        rgba(255, 105, 98, 0.1);
    }

    .record-car {
      margin-top: 5px;

      color: var(--text-soft);

      font-size: 12px;
      font-weight: 650;

      line-height: 1.45;
    }

    .record-reason {
      margin-top: 8px;

      color: var(--text-muted);

      font-size: 11px;
      font-weight: 500;

      line-height: 1.55;

      display: -webkit-box;

      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;

      overflow: hidden;
    }

    /* =========================================================
       STATUS
    ========================================================= */

    .status {
      padding:
        28px
        18px;

      color: var(--text-muted);

      font-size: 12px;

      line-height: 1.6;

      text-align: center;
    }

    .status.error {
      color: var(--danger);
    }

    /* =========================================================
       MAP ACTIONS
    ========================================================= */

    .map-actions {
      position: absolute;

      z-index: 10;

      top: 20px;
      right: 20px;

      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .map-button {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border:
        1px solid rgba(0, 0, 0, 0.12);

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.96);

      color: #252b31;

      cursor: pointer;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.16);
    }

    .map-button:hover {
      background: #fff;
    }

    .map-button svg {
      width: 18px;
      height: 18px;
    }

    /* =========================================================
       MOBILE HANDLE
    ========================================================= */

    .sidebar-handle-area {
      display: none;
    }

    /* =========================================================
       INFO WINDOW
    ========================================================= */

    .custom-info {
      min-width: 245px;
      max-width: 300px;

      padding:
        15px
        16px;

      color: #16191d;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    .custom-info-title {
      margin-bottom: 3px;

      font-size: 14px;
      font-weight: 850;

      letter-spacing: -0.02em;
    }

    .custom-info-car {
      color: #59616b;

      font-size: 11px;
      font-weight: 650;
    }

    .custom-info-date {
      margin-top: 9px;

      color: #777f88;

      font-size: 10px;
      font-weight: 700;
    }

    .custom-info-reason {
      margin-top: 8px;

      color: #353b42;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.5;

      word-break: keep-all;
    }

    /* =========================================================
       DESKTOP
    ========================================================= */

    @media (min-width: 801px) {
      #map {
        left: var(--sidebar-width);

        width:
          calc(
            100% -
            var(--sidebar-width)
          );
      }

      .map-actions {
        top: 20px;
        right: 20px;
      }
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {
      .sidebar {
        top: auto;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100%;

        height:
          var(--sheet-expanded);

        border-top:
          1px solid
          rgba(255, 255, 255, 0.09);

        border-right: 0;

        border-radius:
          22px
          22px
          0
          0;

        box-shadow:
          0 -12px 40px
          rgba(0, 0, 0, 0.38);

        transform:
          translate3d(
            0,
            calc(
              var(--sheet-expanded) -
              var(--sheet-collapsed)
            ),
            0
          );

        transition:
          transform
          0.34s
          cubic-bezier(
            .22,
            .8,
            .24,
            1
          );

        will-change: transform;
      }

      .sidebar.dragging {
        transition: none;
      }

      .sidebar-handle-area {
        display: flex;

        flex:
          0 0 auto;

        height: 32px;

        align-items: center;
        justify-content: center;

        cursor: grab;

        touch-action: none;
      }

      .sidebar-handle-area:active {
        cursor: grabbing;
      }

      .sidebar-handle {
        width: 42px;
        height: 5px;

        border-radius: 99px;

        background:
          rgba(255, 255, 255, 0.25);
      }

      .sidebar-header {
        padding:
          0
          18px
          15px;
      }

      .brand {
        margin-bottom: 14px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;

        border-radius: 10px;
      }

      .stats {
        padding:
          12px
          18px;
      }

      .list-header {
        padding:
          13px
          18px
          9px;
      }

      .list {
        padding:
          0
          10px
          calc(
            20px +
            env(safe-area-inset-bottom)
          );
      }

      .record {
        padding: 14px;
      }

      .map-actions {
        top: 14px;
        right: 14px;
      }

      .map-button {
        width: 40px;
        height: 40px;
      }

      .custom-info {
        min-width: 220px;
        max-width: 270px;

        padding:
          13px
          14px;
      }
    }

    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 420px) {
      .brand-title {
        font-size: 14px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        padding: 12px;
      }

      .stat-value {
        font-size: 19px;
      }

      #search {
        height: 43px;
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- MAP -->
    <div id="map"></div>

    <!-- MAP ACTIONS -->
    <div class="map-actions">
      <button
        type="button"
        class="map-button"
        id="fitButton"
        aria-label="전체 보기"
        title="전체 보기"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M16 3h3a2 2 0 0 1 2 2v3" />
          <path d="M21 16v3a2 2 0 0 1-2 2h-3" />
          <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
        </svg>
      </button>
    </div>

    <!-- SIDEBAR -->
    <aside
      class="sidebar"
      id="sidebar"
    >

      <!-- MOBILE HANDLE -->
      <div
        class="sidebar-handle-area"
        id="sheetHandle"
      >
        <div class="sidebar-handle"></div>
      </div>

      <!-- HEADER -->
      <div class="sidebar-header">

        <div class="brand">

          <div class="brand-mark">
            V
          </div>

          <div class="brand-text">

            <div class="brand-title">
              Vehicle Incident Map
            </div>

            <div class="brand-subtitle">
              Accident & Breakdown Records
            </div>

          </div>

        </div>

        <!-- SEARCH -->
        <div class="search-wrap">

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle
              cx="11"
              cy="11"
              r="7"
            ></circle>

            <path
              d="m20 20-4-4"
            ></path>
          </svg>

          <input
            id="search"
            type="search"
            placeholder="차량번호, 차종, 날짜, 사고내용 검색"
            autocomplete="off"
          />

        </div>

      </div>

      <!-- STATS -->
      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            Records
          </div>

          <div
            class="stat-value"
            id="totalCount"
          >
            0
          </div>

        </div>

        <div class="stat">

          <div class="stat-label">
            Vehicles
          </div>

          <div
            class="stat-value"
            id="vehicleCount"
          >
            0
          </div>

        </div>

      </div>

      <!-- LIST HEADER -->
      <div class="list-header">

        <div class="list-title">
          INCIDENT RECORDS
        </div>

        <div
          class="list-count"
          id="listCount"
        >
          0
        </div>

      </div>

      <!-- LIST -->
      <div
        class="list"
        id="recordList"
      >
        <div class="status">
          데이터를 불러오는 중...
        </div>
      </div>

    </aside>
  </div>

  <!-- KAKAO MAP -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer"
  ></script>

  <script>
    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let map = null;
    let clusterer = null;

    let records = [];
    let markers = [];

    let activeRecordIndex = -1;
    let activeInfoWindow = null;

    const sheetState = {
      current: "collapsed",

      dragging: false,

      startY: 0,
      startTranslate: 0,

      currentTranslate: 0,

      lastY: 0,
      lastTime: 0,

      velocity: 0
    };

    /* =========================================================
       DOM
    ========================================================= */

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const sheetHandle =
      document.getElementById(
        "sheetHandle"
      );

    const recordList =
      document.getElementById(
        "recordList"
      );

    const searchInput =
      document.getElementById(
        "search"
      );

    const totalCount =
      document.getElementById(
        "totalCount"
      );

    const vehicleCount =
      document.getElementById(
        "vehicleCount"
      );

    const listCount =
      document.getElementById(
        "listCount"
      );

    const fitButton =
      document.getElementById(
        "fitButton"
      );

    /* =========================================================
       MOBILE
    ========================================================= */

    function isMobile() {
      return window.innerWidth <= 800;
    }

    function getSheetPositions() {
      if (!isMobile()) {
        return null;
      }

      const viewportHeight =
        window.innerHeight;

      const expanded =
        viewportHeight * 0.14;

      const middle =
        viewportHeight * 0.43;

      const collapsed =
        viewportHeight * 0.68;

      return {
        expanded,
        middle,
        collapsed
      };
    }

    function getCurrentSheetTranslate() {
      if (!isMobile()) {
        return 0;
      }

      return sheetState.currentTranslate;
    }

    function clampSheetTranslate(
      value
    ) {
      const positions =
        getSheetPositions();

      if (!positions) {
        return value;
      }

      return Math.max(
        positions.expanded,
        Math.min(
          positions.collapsed,
          value
        )
      );
    }

    function getNearestSheetState(
      translate,
      velocity = 0
    ) {
      const positions =
        getSheetPositions();

      if (!positions) {
        return "collapsed";
      }

      const states = [
        {
          name: "expanded",
          value: positions.expanded
        },
        {
          name: "middle",
          value: positions.middle
        },
        {
          name: "collapsed",
          value: positions.collapsed
        }
      ];

      if (
        Math.abs(velocity) > 0.45
      ) {
        if (velocity < 0) {
          if (
            translate >
            positions.middle
          ) {
            return "middle";
          }

          return "expanded";
        }

        if (
          translate <
          positions.middle
        ) {
          return "middle";
        }

        return "collapsed";
      }

      let closest =
        states[0];

      let distance =
        Math.abs(
          translate -
          states[0].value
        );

      for (
        let i = 1;
        i < states.length;
        i++
      ) {
        const currentDistance =
          Math.abs(
            translate -
            states[i].value
          );

        if (
          currentDistance <
          distance
        ) {
          closest =
            states[i];

          distance =
            currentDistance;
        }
      }

      return closest.name;
    }

    function setSheetPosition(
      state,
      animate = true
    ) {
      if (!isMobile()) {
        return;
      }

      const positions =
        getSheetPositions();

      if (!positions) {
        return;
      }

      const translate =
        positions[state];

      if (
        typeof translate !==
        "number"
      ) {
        return;
      }

      sheetState.current =
        state;

      sheetState.currentTranslate =
        translate;

      sidebar.classList.toggle(
        "dragging",
        !animate
      );

      sidebar.style.transform =
        `translate3d(0, ${translate}px, 0)`;
    }

    function updateSheetForViewport() {
      if (!isMobile()) {
        sidebar.style.transform =
          "";

        return;
      }

      setSheetPosition(
        sheetState.current,
        false
      );
    }

    /* =========================================================
       SHEET DRAG
    ========================================================= */

    function getTouchY(event) {
      if (
        event.touches &&
        event.touches.length
      ) {
        return event.touches[0].clientY;
      }

      if (
        event.changedTouches &&
        event.changedTouches.length
      ) {
        return event.changedTouches[0].clientY;
      }

      return 0;
    }

    function startSheetDrag(
      event
    ) {
      if (!isMobile()) {
        return;
      }

      /*
       * 리스트 내부에서는 Bottom Sheet가
       * 터치를 가로채지 않도록 한다.
       */
      if (
        event.target.closest(
          ".list"
        )
      ) {
        return;
      }

      if (
        event.target.closest(
          "input, button"
        )
      ) {
        return;
      }

      const positions =
        getSheetPositions();

      if (!positions) {
        return;
      }

      const y =
        getTouchY(event);

      sheetState.dragging =
        true;

      sheetState.startY =
        y;

      sheetState.startTranslate =
        getCurrentSheetTranslate();

      sheetState.currentTranslate =
        sheetState.startTranslate;

      sheetState.lastY =
        y;

      sheetState.lastTime =
        performance.now();

      sheetState.velocity =
        0;

      sidebar.classList.add(
        "dragging"
      );
    }

    function moveSheetDrag(
      event
    ) {
      if (
        !isMobile() ||
        !sheetState.dragging
      ) {
        return;
      }

      event.preventDefault();

      const y =
        getTouchY(event);

      const now =
        performance.now();

      const deltaY =
        y -
        sheetState.startY;

      const nextTranslate =
        clampSheetTranslate(
          sheetState.startTranslate +
          deltaY
        );

      const dt =
        Math.max(
          now -
          sheetState.lastTime,
          1
        );

      sheetState.velocity =
        (
          (y - sheetState.lastY) /
          dt
        ) * 16;

      sheetState.lastY =
        y;

      sheetState.lastTime =
        now;

      sheetState.currentTranslate =
        nextTranslate;

      sidebar.style.transform =
        `translate3d(0, ${nextTranslate}px, 0)`;
    }

    function endSheetDrag() {
      if (
        !isMobile() ||
        !sheetState.dragging
      ) {
        return;
      }

      sheetState.dragging =
        false;

      const nextState =
        getNearestSheetState(
          sheetState.currentTranslate,
          sheetState.velocity
        );

      setSheetPosition(
        nextState,
        true
      );
    }

    sidebar.addEventListener(
      "touchstart",
      startSheetDrag,
      {
        passive: true
      }
    );

    sidebar.addEventListener(
      "touchmove",
      moveSheetDrag,
      {
        passive: false
      }
    );

    sidebar.addEventListener(
      "touchend",
      endSheetDrag,
      {
        passive: true
      }
    );

    sidebar.addEventListener(
      "touchcancel",
      endSheetDrag,
      {
        passive: true
      }
    );

    sheetHandle.addEventListener(
      "touchstart",
      startSheetDrag,
      {
        passive: true
      }
    );

    sheetHandle.addEventListener(
      "touchmove",
      moveSheetDrag,
      {
        passive: false
      }
    );

    sheetHandle.addEventListener(
      "touchend",
      endSheetDrag,
      {
        passive: true
      }
    );

    /* =========================================================
       DATE
    ========================================================= */

    function parseRecordDate(
      value
    ) {
      if (
        value === null ||
        value === undefined
      ) {
        return {
          valid: false,
          text: "날짜 확인 필요"
        };
      }

      const raw =
        String(value).trim();

      if (
        !/^\d{6}$/.test(raw)
      ) {
        return {
          valid: false,
          text: "날짜 확인 필요"
        };
      }

      const year =
        2000 +
        Number(
          raw.slice(0, 2)
        );

      const month =
        Number(
          raw.slice(2, 4)
        );

      const day =
        Number(
          raw.slice(4, 6)
        );

      const date =
        new Date(
          year,
          month - 1,
          day
        );

      const valid =
        date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day;

      if (!valid) {
        return {
          valid: false,
          text: "날짜 확인 필요"
        };
      }

      return {
        valid: true,
        text:
          `${year}.${String(month).padStart(2, "0")}.${String(day).padStart(2, "0")}`
      };
    }

    /* =========================================================
       ESCAPE
    ========================================================= */

    function escapeHtml(
      value
    ) {
      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }

    /* =========================================================
       STATS
    ========================================================= */

    function updateStats(
      data
    ) {
      totalCount.textContent =
        data.length;

      const uniqueCars =
        new Set(
          data
            .map(
              item =>
                String(
                  item.carnum ??
                  ""
                ).trim()
            )
            .filter(Boolean)
        );

      vehicleCount.textContent =
        uniqueCars.size;

      listCount.textContent =
        data.length;
    }

    /* =========================================================
       LIST
    ========================================================= */

    function renderList(
      data
    ) {
      if (!data.length) {
        recordList.innerHTML =
          `
            <div class="status">
              검색 결과가 없습니다.
            </div>
          `;

        listCount.textContent =
          "0";

        return;
      }

      listCount.textContent =
        data.length;

      recordList.innerHTML =
        data
          .map(
            item => {
              const originalIndex =
                item.originalIndex;

              const date =
                parseRecordDate(
                  item.date
                );

              return `
                <button
                  type="button"
                  class="record ${
                    activeRecordIndex ===
                    originalIndex
                      ? "active"
                      : ""
                  }"
                  data-index="${originalIndex}"
                >

                  <div class="record-top">

                    <div class="record-car-number">
                      ${escapeHtml(
                        item.carnum
                      )}
                    </div>

                    <div
                      class="record-date ${
                        date.valid
                          ? ""
                          : "invalid"
                      }"
                    >
                      ${escapeHtml(
                        date.text
                      )}
                    </div>

                  </div>

                  <div class="record-car">
                    ${escapeHtml(
                      item.car
                    )}
                  </div>

                  <div class="record-reason">
                    ${escapeHtml(
                      item.reason
                    )}
                  </div>

                </button>
              `;
            }
          )
          .join("");

      recordList
        .querySelectorAll(
          ".record"
        )
        .forEach(
          element => {
            element.addEventListener(
              "click",
              () => {
                const index =
                  Number(
                    element.dataset.index
                  );

                selectRecord(
                  index
                );
              }
            );
          }
        );
    }

    /* =========================================================
       INFO WINDOW
    ========================================================= */

    function createInfoWindowContent(
      item
    ) {
      const date =
        parseRecordDate(
          item.date
        );

      return `
        <div class="custom-info">

          <div class="custom-info-title">
            ${escapeHtml(
              item.carnum
            )}
          </div>

          <div class="custom-info-car">
            ${escapeHtml(
              item.car
            )}
          </div>

          <div class="custom-info-date">
            ${escapeHtml(
              date.text
            )}
          </div>

          <div class="custom-info-reason">
            ${escapeHtml(
              item.reason
            )}
          </div>

        </div>
      `;
    }

    function closeActiveInfoWindow() {
      if (
        activeInfoWindow
      ) {
        activeInfoWindow.close();

        activeInfoWindow =
          null;
      }
    }

    /* =========================================================
       MOBILE MARKER POSITION
    ========================================================= */

    function panToMarkerForMobile(
      position
    ) {
      if (!map) {
        return;
      }

      const mapNode =
        document.getElementById(
          "map"
        );

      if (!mapNode) {
        map.panTo(position);
        return;
      }

      const mapHeight =
        mapNode
          .getBoundingClientRect()
          .height;

      /*
       * 마커를 화면 상단 약 27% 지점에 배치한다.
       */
      const targetRatio =
        0.27;

      const targetY =
        mapHeight *
        targetRatio;

      const centerY =
        mapHeight / 2;

      const projection =
        map.getProjection();

      if (!projection) {
        map.panTo(position);
        return;
      }

      const center =
        map.getCenter();

      const centerPoint =
        projection.pointFromCoords(
          center
        );

      const markerPoint =
        projection.pointFromCoords(
          position
        );

      const markerScreenY =
        markerPoint.y -
        centerPoint.y +
        centerY;

      const deltaY =
        markerScreenY -
        targetY;

      const newCenterPoint =
        new kakao.maps.Point(
          centerPoint.x,
          centerPoint.y +
            deltaY
        );

      const newCenter =
        projection.coordsFromPoint(
          newCenterPoint
        );

      map.panTo(
        newCenter
      );
    }

    /* =========================================================
       OPEN MARKER INFO
    ========================================================= */

    function openMarkerInfo(
      index,
      marker,
      infoWindow
    ) {
      if (!map) {
        return;
      }

      const item =
        records[index];

      if (!item) {
        return;
      }

      /*
       * 기존 팝업 제거
       */
      closeActiveInfoWindow();

      activeRecordIndex =
        index;

      /*
       * 리스트 활성화
       */
      document
        .querySelectorAll(
          ".record"
        )
        .forEach(
          element => {
            element.classList.toggle(
              "active",
              Number(
                element.dataset.index
              ) === index
            );
          }
        );

      const position =
        new kakao.maps.LatLng(
          Number(
            item.latitude
          ),
          Number(
            item.longitude
          )
        );

      /*
       * 핵심:
       *
       * 선택된 위치를 Level 4로 확대한다.
       *
       * Kakao Maps는 숫자가 작을수록
       * 더 확대된 상태다.
       */
      map.setLevel(4);

      if (isMobile()) {

        /*
         * Bottom Sheet를 접는다.
         */
        setSheetPosition(
          "collapsed",
          true
        );

        /*
         * 핀이 팝업과 함께 보이도록
         * 화면 위쪽으로 이동한다.
         */
        panToMarkerForMobile(
          position
        );

      } else {

        /*
         * 데스크톱
         */
        map.panTo(
          position
        );
      }

      /*
       * 확대/이동 이후 InfoWindow 표시
       */
      setTimeout(
        () => {
          if (!map) {
            return;
          }

          infoWindow.open(
            map,
            marker
          );

          activeInfoWindow =
            infoWindow;
        },
        isMobile()
          ? 250
          : 150
      );

      /*
       * 선택된 리스트 항목으로
       * 스크롤
       */
      const selectedElement =
        document.querySelector(
          `.record[data-index="${index}"]`
        );

      if (
        selectedElement
      ) {
        selectedElement.scrollIntoView(
          {
            behavior: "smooth",
            block: "nearest"
          }
        );
      }
    }

    /* =========================================================
       MARKERS
    ========================================================= */

    function createMarkers(
      data
    ) {
      if (
        !map ||
        !clusterer
      ) {
        return;
      }

      clusterer.clear();

      markers.forEach(
        marker => {
          marker.setMap(null);
        }
      );

      markers = [];

      data.forEach(
        item => {
          const latitude =
            Number(
              item.latitude
            );

          const longitude =
            Number(
              item.longitude
            );

          if (
            !Number.isFinite(
              latitude
            ) ||
            !Number.isFinite(
              longitude
            )
          ) {
            return;
          }

          const position =
            new kakao.maps.LatLng(
              latitude,
              longitude
            );

          const marker =
            new kakao.maps.Marker(
              {
                position
              }
            );

          const infoWindow =
            new kakao.maps.InfoWindow(
              {
                content:
                  createInfoWindowContent(
                    item
                  ),

                removable: false
              }
            );

          const originalIndex =
            item.originalIndex;

          /*
           * 지도에서 핀을 직접 클릭해도
           * 동일하게 확대 + 팝업 표시
           */
          kakao.maps.event.addListener(
            marker,
            "click",
            () => {
              openMarkerInfo(
                originalIndex,
                marker,
                infoWindow
              );
            }
          );

          markers.push(
            marker
          );
        }
      );

      clusterer.addMarkers(
        markers
      );
    }

    /* =========================================================
       SELECT RECORD
    ========================================================= */

    function selectRecord(
      index
    ) {
      const target =
        records[index];

      if (!target) {
        return;
      }

      const markerIndex =
        markers.findIndex(
          marker => {
            const position =
              marker.getPosition();

            return (
              Math.abs(
                position.getLat() -
                Number(
                  target.latitude
                )
              ) <
                0.000000001 &&
              Math.abs(
                position.getLng() -
                Number(
                  target.longitude
                )
              ) <
                0.000000001
            );
          }
        );

      if (
        markerIndex < 0
      ) {
        return;
      }

      const marker =
        markers[markerIndex];

      const infoWindow =
        new kakao.maps.InfoWindow(
          {
            content:
              createInfoWindowContent(
                target
              ),

            removable: false
          }
        );

      /*
       * 확대 / 이동 / 팝업은
       * openMarkerInfo에서 통합 처리
       */
      openMarkerInfo(
        index,
        marker,
        infoWindow
      );
    }

    /* =========================================================
       FIT MAP
    ========================================================= */

    function fitMap() {
      if (
        !map ||
        !records.length
      ) {
        return;
      }

      const bounds =
        new kakao.maps.LatLngBounds();

      let validCount = 0;

      records.forEach(
        item => {
          const latitude =
            Number(
              item.latitude
            );

          const longitude =
            Number(
              item.longitude
            );

          if (
            Number.isFinite(
              latitude
            ) &&
            Number.isFinite(
              longitude
            )
          ) {
            bounds.extend(
              new kakao.maps.LatLng(
                latitude,
                longitude
              )
            );

            validCount++;
          }
        }
      );

      if (validCount) {
        map.setBounds(
          bounds,
          50,
          50,
          50,
          50
        );
      }
    }

    fitButton.addEventListener(
      "click",
      () => {
        closeActiveInfoWindow();

        activeRecordIndex =
          -1;

        document
          .querySelectorAll(
            ".record"
          )
          .forEach(
            element => {
              element.classList.remove(
                "active"
              );
            }
          );

        fitMap();
      }
    );

    /* =========================================================
       SEARCH
    ========================================================= */

    function filterRecords(
      keyword
    ) {
      const normalized =
        String(
          keyword ?? ""
        )
          .trim()
          .toLowerCase();

      if (!normalized) {
        return records;
      }

      return records.filter(
        item => {
          const values = [
            item.carnum,
            item.car,
            item.date,
            item.reason
          ];

          return values.some(
            value =>
              String(
                value ?? ""
              )
                .toLowerCase()
                .includes(
                  normalized
                )
          );
        }
      );
    }

    searchInput.addEventListener(
      "input",
      event => {
        const filtered =
          filterRecords(
            event.target.value
          );

        activeRecordIndex =
          -1;

        closeActiveInfoWindow();

        renderList(
          filtered
        );

        createMarkers(
          filtered
        );
      }
    );

    /* =========================================================
       LOAD JSON
    ========================================================= */

    async function loadData() {
      try {
        const response =
          await fetch(
            "./list.json"
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const json =
          await response.json();

        if (
          !Array.isArray(json)
        ) {
          throw new Error(
            "list.json 형식이 배열이 아닙니다."
          );
        }

        records =
          json.map(
            (item, index) => ({
              ...item,

              originalIndex:
                index
            })
          );

        /*
         * 좌표가 유효한 데이터만
         * 지도에 표시
         */
        records =
          records.filter(
            item =>
              Number.isFinite(
                Number(
                  item.latitude
                )
              ) &&
              Number.isFinite(
                Number(
                  item.longitude
                )
              )
          );

        updateStats(
          records
        );

        renderList(
          records
        );

        createMarkers(
          records
        );

        fitMap();

      } catch (error) {
        console.error(
          error
        );

        recordList.innerHTML =
          `
            <div class="status error">
              데이터를 불러오지 못했습니다.<br>
              list.json 파일을 확인해주세요.
            </div>
          `;
      }
    }

    /* =========================================================
       MAP INIT
    ========================================================= */

    function initMap() {
      const container =
        document.getElementById(
          "map"
        );

      map =
        new kakao.maps.Map(
          container,
          {
            center:
              new kakao.maps.LatLng(
                37.5665,
                126.978
              ),

            level: 8
          }
        );

      /*
       * Kakao Zoom Control
       */
      const zoomControl =
        new kakao.maps.ZoomControl();

      map.addControl(
        zoomControl,
        kakao.maps.ControlPosition
          .RIGHT
      );

      /*
       * Marker Clusterer
       */
      clusterer =
        new kakao.maps.MarkerClusterer(
          {
            map,

            averageCenter: true,

            minLevel: 6,

            disableClickZoom: false
          }
        );

      loadData();
    }

    /* =========================================================
       WINDOW
    ========================================================= */

    window.addEventListener(
      "resize",
      () => {
        updateSheetForViewport();

        if (map) {
          map.relayout();
        }
      }
    );

    /* =========================================================
       START
    ========================================================= */

    window.addEventListener(
      "load",
      () => {
        if (isMobile()) {
          setSheetPosition(
            "collapsed",
            false
          );
        }

        if (
          typeof kakao ===
            "undefined" ||
          !kakao.maps
        ) {
          recordList.innerHTML =
            `
              <div class="status error">
                Kakao Maps SDK를 불러오지 못했습니다.
              </div>
            `;

          return;
        }

        kakao.maps.load(
          () => {
            initMap();
          }
        );
      }
    );
  </script>
</body>
</html>
