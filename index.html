<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>차량 사고·고장 기록</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;
            background: #0b0d10;
            color: #f3f4f6;
        }

        body {
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: relative;
            z-index: 10;

            width: 390px;
            min-width: 390px;
            height: 100vh;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    #111419 0%,
                    #0c0f13 100%
                );

            border-right: 1px solid #252a31;

            box-shadow:
                10px 0 40px rgba(0, 0, 0, 0.25);
        }

        .header {
            padding: 26px 26px 22px;

            border-bottom: 1px solid #252a31;
        }

        .eyebrow {
            margin-bottom: 7px;

            color: #8d96a3;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.16em;
        }

        .title {
            margin: 0;

            color: #ffffff;

            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin-top: 8px;

            color: #7e8794;

            font-size: 13px;
            line-height: 1.5;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 10px;

            padding: 16px 18px;

            border-bottom: 1px solid #252a31;
        }

        .stat {
            padding: 14px 15px;

            background: #15191e;
            border: 1px solid #242a31;
            border-radius: 10px;
        }

        .stat-label {
            margin-bottom: 6px;

            color: #747d89;

            font-size: 11px;
            font-weight: 600;
        }

        .stat-value {
            color: #f5f6f7;

            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-wrap {
            padding: 15px 18px 12px;
        }

        .search {
            width: 100%;
            height: 42px;

            padding: 0 14px;

            color: #ffffff;

            background: #15191e;

            border: 1px solid #292f37;
            border-radius: 9px;

            outline: none;

            font-size: 13px;

            transition:
                border-color 0.2s,
                background 0.2s;
        }

        .search::placeholder {
            color: #626b77;
        }

        .search:focus {
            background: #181d23;
            border-color: #555f6d;
        }

        /* =========================
           LIST
        ========================= */

        .list {
            flex: 1;

            overflow-y: auto;

            padding: 0 12px 18px;
        }

        .list::-webkit-scrollbar {
            width: 6px;
        }

        .list::-webkit-scrollbar-track {
            background: transparent;
        }

        .list::-webkit-scrollbar-thumb {
            background: #303640;
            border-radius: 999px;
        }

        .record {
            padding: 16px 14px;

            margin-bottom: 8px;

            background: #12161b;

            border: 1px solid #242a31;
            border-radius: 10px;

            cursor: pointer;

            transition:
                background 0.18s,
                border-color 0.18s,
                transform 0.18s;
        }

        .record:hover {
            background: #171c22;
            border-color: #39414c;
            transform: translateY(-1px);
        }

        .record.active {
            background: #191f26;
            border-color: #697482;
        }

        .record-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 8px;
        }

        .car-number {
            color: #ffffff;

            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .date {
            flex-shrink: 0;

            color: #858e9a;

            font-size: 11px;
            font-weight: 600;
        }

        .car-name {
            margin-bottom: 8px;

            color: #aab2bd;

            font-size: 12px;
            font-weight: 600;
        }

        .reason {
            color: #707a87;

            font-size: 12px;
            line-height: 1.55;

            word-break: keep-all;
        }

        .empty {
            padding: 50px 20px;

            text-align: center;

            color: #646d79;

            font-size: 13px;
        }

        /* =========================
           MAP
        ========================= */

        #map {
            flex: 1;

            width: calc(100vw - 390px);
            height: 100vh;

            background: #e8eaed;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            position: fixed;
            z-index: 9999;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(8, 10, 13, 0.96);

            transition:
                opacity 0.3s,
                visibility 0.3s;
        }

        .loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-box {
            text-align: center;
        }

        .spinner {
            width: 34px;
            height: 34px;

            margin: 0 auto 15px;

            border: 3px solid #2a3038;
            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #9ba3ae;

            font-size: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           ERROR
        ========================= */

        .error-screen {
            position: fixed;
            z-index: 10000;

            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background: #090b0e;
        }

        .error-screen.show {
            display: flex;
        }

        .error-box {
            width: min(500px, 100%);

            padding: 30px;

            background: #12161b;

            border: 1px solid #30363f;
            border-radius: 14px;
        }

        .error-title {
            margin-bottom: 12px;

            color: #ffffff;

            font-size: 20px;
            font-weight: 800;
        }

        .error-message {
            color: #8e97a3;

            font-size: 13px;
            line-height: 1.7;

            white-space: pre-wrap;
            word-break: break-word;
        }

        /* =========================
           INFO WINDOW
        ========================= */

        .info-window {
            min-width: 250px;

            padding: 16px;

            color: #20242a;

            background: #ffffff;

            border-radius: 10px;
        }

        .info-title {
            margin-bottom: 10px;

            font-size: 15px;
            font-weight: 800;
        }

        .info-row {
            display: flex;

            gap: 10px;

            margin-bottom: 6px;

            font-size: 12px;
            line-height: 1.45;
        }

        .info-label {
            width: 38px;

            flex-shrink: 0;

            color: #8a919a;
            font-weight: 600;
        }

        .info-value {
            color: #343a42;
            font-weight: 600;

            word-break: keep-all;
        }

        .info-reason {
            margin-top: 10px;
            padding-top: 10px;

            color: #5e6670;

            border-top: 1px solid #eceef1;

            font-size: 12px;
            line-height: 1.55;

            word-break: keep-all;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {
            body {
                display: block;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48vh;

                border-right: 0;
                border-bottom: 1px solid #252a31;
            }

            #map {
                width: 100%;
                height: 52vh;
            }

            .header {
                padding: 18px 18px 15px;
            }

            .title {
                font-size: 20px;
            }

            .stats {
                padding: 10px 12px;
            }

            .search-wrap {
                padding: 10px 12px;
            }

            .list {
                padding: 0 8px 12px;
            }
        }
    </style>

    <!--
        Kakao Maps JavaScript SDK

        반드시 본인의 JavaScript 키를 넣으세요.
        libraries=clusterer : 마커 클러스터러 사용
    -->
    <script
        type="text/javascript"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer">
    </script>
</head>

<body>

    <!-- =========================
         LOADING
    ========================== -->

    <div class="loading" id="loading">
        <div class="loading-box">
            <div class="spinner"></div>
            <div class="loading-text">
                차량 기록을 불러오는 중...
            </div>
        </div>
    </div>

    <!-- =========================
         ERROR
    ========================== -->

    <div class="error-screen" id="errorScreen">
        <div class="error-box">
            <div class="error-title">
                지도를 불러오지 못했습니다.
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <header class="header">
            <div class="eyebrow">
                VEHICLE INCIDENT DATABASE
            </div>

            <h1 class="title">
                차량 사고 · 고장 기록
            </h1>

            <div class="subtitle">
                사고 및 차량 관련 기록을 지도에서 확인합니다.
            </div>
        </header>

        <section class="stats">

            <div class="stat">
                <div class="stat-label">
                    TOTAL RECORDS
                </div>

                <div class="stat-value" id="totalCount">
                    -
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    UNIQUE VEHICLES
                </div>

                <div class="stat-value" id="carCount">
                    -
                </div>
            </div>

        </section>

        <div class="search-wrap">
            <input
                type="text"
                class="search"
                id="search"
                placeholder="차량번호, 차종, 사고내용 검색..."
                autocomplete="off"
            >
        </div>

        <div class="list" id="recordList"></div>

    </aside>

    <!-- =========================
         MAP
    ========================== -->

    <main id="map"></main>


    <script>

        /* =====================================================
           전역 변수
        ===================================================== */

        let map = null;

        let clusterer = null;

        let records = [];

        let markers = [];

        let activeIndex = -1;


        /* =====================================================
           DOM
        ===================================================== */

        const loading =
            document.getElementById("loading");

        const errorScreen =
            document.getElementById("errorScreen");

        const errorMessage =
            document.getElementById("errorMessage");

        const recordList =
            document.getElementById("recordList");

        const searchInput =
            document.getElementById("search");

        const totalCount =
            document.getElementById("totalCount");

        const carCount =
            document.getElementById("carCount");


        /* =====================================================
           유틸
        ===================================================== */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function formatDate(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "날짜 없음";
            }

            const text = String(value);

            /*
             * 250712 → 2025.07.12
             */

            if (/^\d{6}$/.test(text)) {

                const year =
                    Number(text.substring(0, 2));

                const month =
                    Number(text.substring(2, 4));

                const day =
                    Number(text.substring(4, 6));

                /*
                 * 00월 / 00일 등의 비정상 날짜
                 */

                if (
                    month < 1 ||
                    month > 12 ||
                    day < 1 ||
                    day > 31
                ) {
                    return "날짜 확인 필요";
                }

                const fullYear =
                    year >= 70
                        ? 1900 + year
                        : 2000 + year;

                return (
                    fullYear +
                    "." +
                    String(month).padStart(2, "0") +
                    "." +
                    String(day).padStart(2, "0")
                );
            }

            return escapeHtml(text);
        }


        function showError(message) {

            loading.classList.add("hidden");

            errorMessage.textContent = message;

            errorScreen.classList.add("show");
        }


        /* =====================================================
           Kakao SDK 확인
        ===================================================== */

        function checkKakaoSDK() {

            if (
                typeof kakao === "undefined" ||
                !kakao.maps
            ) {

                showError(
                    "Kakao Maps JavaScript SDK가 로드되지 않았습니다.\n\n" +
                    "확인할 사항:\n" +
                    "1. 카카오 JavaScript 키가 올바른지 확인\n" +
                    "2. 카카오 Developers에 GitHub Pages 도메인이 등록되어 있는지 확인\n" +
                    "3. 브라우저 개발자도구 Network에서 dapi.kakao.com 요청 확인"
                );

                return false;
            }

            return true;
        }


        /* =====================================================
           지도 초기화
        ===================================================== */

        function initMap() {

            if (!checkKakaoSDK()) {
                return;
            }

            const container =
                document.getElementById("map");

            const options = {

                center:
                    new kakao.maps.LatLng(
                        37.5,
                        127.5
                    ),

                level: 11
            };

            map =
                new kakao.maps.Map(
                    container,
                    options
                );


            /*
             * 확대 / 축소 컨트롤
             */

            const zoomControl =
                new kakao.maps.ZoomControl();

            map.addControl(
                zoomControl,
                kakao.maps.ControlPosition.RIGHT
            );


            /*
             * 클러스터러
             */

            clusterer =
                new kakao.maps.MarkerClusterer({

                    map: map,

                    averageCenter: true,

                    minLevel: 7,

                    disableClickZoom: true,

                    styles: [
                        {
                            width: "44px",
                            height: "44px",

                            background: "#20252c",

                            border: "2px solid #ffffff",

                            borderRadius: "50%",

                            color: "#ffffff",

                            textAlign: "center",

                            lineHeight: "40px",

                            fontSize: "12px",

                            fontWeight: "800",

                            boxShadow:
                                "0 3px 10px rgba(0,0,0,0.25)"
                        }
                    ]
                });


            loadData();
        }


        /* =====================================================
           JSON 불러오기
        ===================================================== */

        async function loadData() {

            try {

                const response =
                    await fetch("./list.json", {
                        cache: "no-cache"
                    });


                if (!response.ok) {

                    throw new Error(
                        "list.json을 불러오지 못했습니다. " +
                        "HTTP " +
                        response.status
                    );
                }


                const data =
                    await response.json();


                if (!Array.isArray(data)) {

                    throw new Error(
                        "list.json의 최상위 데이터는 배열이어야 합니다."
                    );
                }


                records = data;


                updateStats();

                renderList(records);

                createMarkers(records);

                fitMap();


                loading.classList.add("hidden");

            } catch (error) {

                console.error(error);

                showError(
                    "데이터를 불러오는 중 오류가 발생했습니다.\n\n" +
                    error.message
                );
            }
        }


        /* =====================================================
           통계
        ===================================================== */

        function updateStats() {

            totalCount.textContent =
                records.length.toLocaleString();


            const cars =
                new Set(
                    records
                        .map(item => item.carnum)
                        .filter(Boolean)
                );


            carCount.textContent =
                cars.size.toLocaleString();
        }


        /* =====================================================
           리스트 렌더링
        ===================================================== */

        function renderList(data) {

            recordList.innerHTML = "";


            if (!data.length) {

                recordList.innerHTML = `
                    <div class="empty">
                        검색 결과가 없습니다.
                    </div>
                `;

                return;
            }


            data.forEach((item) => {

                const originalIndex =
                    records.indexOf(item);


                const element =
                    document.createElement("div");


                element.className =
                    "record";


                element.dataset.index =
                    originalIndex;


                element.innerHTML = `

                    <div class="record-top">

                        <div class="car-number">
                            ${escapeHtml(item.carnum || "차량번호 없음")}
                        </div>

                        <div class="date">
                            ${formatDate(item.date)}
                        </div>

                    </div>

                    <div class="car-name">
                        ${escapeHtml(item.car || "차종 정보 없음")}
                    </div>

                    <div class="reason">
                        ${escapeHtml(item.reason || "사고·고장 내용 없음")}
                    </div>

                `;


                element.addEventListener(
                    "click",
                    () => {

                        selectRecord(
                            originalIndex
                        );

                    }
                );


                recordList.appendChild(element);

            });
        }


        /* =====================================================
           마커 생성
        ===================================================== */

        function createMarkers(data) {

            /*
             * 기존 마커 제거
             */

            markers.forEach(marker => {

                marker.setMap(null);

            });

            markers = [];


            if (clusterer) {

                clusterer.clear();

            }


            data.forEach((item, index) => {

                const latitude =
                    Number(item.latitude);

                const longitude =
                    Number(item.longitude);


                if (
                    !Number.isFinite(latitude) ||
                    !Number.isFinite(longitude)
                ) {
                    return;
                }


                const position =
                    new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );


                const marker =
                    new kakao.maps.Marker({

                        position: position,

                        title:
                            item.carnum || "차량"
                    });


                marker.__recordIndex =
                    records.indexOf(item);


                const infoWindow =
                    new kakao.maps.InfoWindow({

                        content:
                            createInfoWindowContent(
                                item
                            ),

                        removable: true

                    });


                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {

                        selectRecord(
                            marker.__recordIndex
                        );


                        infoWindow.open(
                            map,
                            marker
                        );

                    }
                );


                marker.__infoWindow =
                    infoWindow;


                markers.push(marker);

            });


            if (clusterer) {

                clusterer.addMarkers(
                    markers
                );

            } else {

                markers.forEach(marker => {
                    marker.setMap(map);
                });

            }
        }


        /* =====================================================
           InfoWindow
        ===================================================== */

        function createInfoWindowContent(item) {

            return `

                <div class="info-window">

                    <div class="info-title">
                        ${escapeHtml(
                            item.carnum || "차량 정보"
                        )}
                    </div>

                    <div class="info-row">

                        <div class="info-label">
                            차종
                        </div>

                        <div class="info-value">
                            ${escapeHtml(
                                item.car || "-"
                            )}
                        </div>

                    </div>

                    <div class="info-row">

                        <div class="info-label">
                            날짜
                        </div>

                        <div class="info-value">
                            ${formatDate(item.date)}
                        </div>

                    </div>

                    <div class="info-reason">
                        ${escapeHtml(
                            item.reason || "기록 없음"
                        )}
                    </div>

                </div>

            `;
        }


        /* =====================================================
           기록 선택
        ===================================================== */

        function selectRecord(index) {

            if (
                index < 0 ||
                index >= records.length
            ) {
                return;
            }


            activeIndex = index;


            /*
             * 리스트 active 상태
             */

            document
                .querySelectorAll(".record")
                .forEach(element => {

                    element.classList.remove(
                        "active"
                    );

                });


            const activeElement =
                document.querySelector(
                    `.record[data-index="${index}"]`
                );


            if (activeElement) {

                activeElement.classList.add(
                    "active"
                );

                activeElement.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });

            }


            /*
             * 지도 이동
             */

            const item =
                records[index];


            const latitude =
                Number(item.latitude);

            const longitude =
                Number(item.longitude);


            if (
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude)
            ) {
                return;
            }


            const position =
                new kakao.maps.LatLng(
                    latitude,
                    longitude
                );


            map.setCenter(position);

            map.setLevel(4);


            /*
             * InfoWindow 열기
             */

            markers.forEach(marker => {

                if (
                    marker.__recordIndex === index
                ) {

                    if (
                        marker.__infoWindow
                    ) {

                        marker.__infoWindow.open(
                            map,
                            marker
                        );

                    }

                }

            });

        }


        /* =====================================================
           전체 데이터 기준 지도 범위
        ===================================================== */

        function fitMap() {

            if (
                !records.length ||
                !map
            ) {
                return;
            }


            const bounds =
                new kakao.maps.LatLngBounds();


            let count = 0;


            records.forEach(item => {

                const latitude =
                    Number(item.latitude);

                const longitude =
                    Number(item.longitude);


                if (
                    !Number.isFinite(latitude) ||
                    !Number.isFinite(longitude)
                ) {
                    return;
                }


                bounds.extend(
                    new kakao.maps.LatLng(
                        latitude,
                        longitude
                    )
                );


                count++;

            });


            if (count > 0) {

                map.setBounds(bounds);

            }

        }


        /* =====================================================
           검색
        ===================================================== */

        searchInput.addEventListener(
            "input",
            function () {

                const keyword =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!keyword) {

                    renderList(records);

                    createMarkers(records);

                    fitMap();

                    return;
                }


                const filtered =
                    records.filter(item => {

                        const text = [

                            item.carnum,

                            item.car,

                            item.date,

                            item.reason

                        ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        return text.includes(
                            keyword
                        );

                    });


                renderList(filtered);

                createMarkers(filtered);


                /*
                 * 검색 결과가 있을 경우
                 * 검색된 위치로 지도 이동
                 */

                if (filtered.length) {

                    const bounds =
                        new kakao.maps.LatLngBounds();

                    let count = 0;


                    filtered.forEach(item => {

                        const latitude =
                            Number(item.latitude);

                        const longitude =
                            Number(item.longitude);


                        if (
                            !Number.isFinite(latitude) ||
                            !Number.isFinite(longitude)
                        ) {
                            return;
                        }


                        bounds.extend(
                            new kakao.maps.LatLng(
                                latitude,
                                longitude
                            )
                        );


                        count++;

                    });


                    if (count) {

                        map.setBounds(
                            bounds
                        );

                    }

                }

            }
        );


        /* =====================================================
           시작
        ===================================================== */

        /*
         * Kakao SDK가 정상적으로 로드된 이후
         * DOM이 준비되었을 때 실행
         */

        window.addEventListener(
            "load",
            function () {

                /*
                 * SDK 로딩 여부 확인
                 */

                if (
                    typeof kakao === "undefined"
                ) {

                    showError(
                        "Kakao Maps SDK를 불러오지 못했습니다.\n\n" +
                        "카카오 Developers의 Web 플랫폼 도메인 등록과 " +
                        "JavaScript 키를 확인해주세요."
                    );

                    return;
                }


                /*
                 * kakao.maps.load을 이용해
                 * 지도 SDK 초기화 완료 후 실행
                 */

                kakao.maps.load(
                    function () {

                        initMap();

                    }
                );

            }
        );

    </script>

</body>
</html>
