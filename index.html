<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>전손맵</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
      background: #111;
      color: #fff;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       DESKTOP SIDEBAR
    ========================================================= */

    .sidebar {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 390px;
      height: 100vh;
      padding: 28px 22px 22px;
      background: rgba(17, 17, 17, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }

    .brand {
      flex-shrink: 0;
      margin-bottom: 24px;
    }

    .brand-title {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: #888;
      font-size: 12px;
      letter-spacing: 0.4px;
    }

    .search-box {
      flex-shrink: 0;
      position: relative;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 14px;
      transition: 0.2s;
    }

    .search-box input::placeholder {
      color: #666;
    }

    .search-box input:focus {
      border-color: rgba(255, 92, 45, 0.7);
      background: rgba(255, 255, 255, 0.08);
    }

    .stats {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .stat {
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-label {
      color: #777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
    }

    .list-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .list-title {
      color: #888;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .list-count {
      color: #555;
      font-size: 11px;
    }

    .record-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 3px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .record-list::-webkit-scrollbar {
      width: 4px;
    }

    .record-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .record-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    .record-item {
      width: 100%;
      margin-bottom: 8px;
      padding: 13px 14px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.045);
      color: #fff;
      text-align: left;
      cursor: pointer;
      transition:
        background 0.18s,
        border-color 0.18s,
        transform 0.18s;
    }

    .record-item:hover {
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .record-item.active {
      background: rgba(255, 92, 45, 0.13);
      border-color: rgba(255, 92, 45, 0.55);
    }

    .record-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .record-car {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .record-date {
      flex-shrink: 0;
      color: #999;
      font-size: 11px;
      font-weight: 600;
    }

    .record-info {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 7px;
      min-width: 0;
    }

    .record-model {
      overflow: hidden;
      color: #aaa;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-dot {
      width: 3px;
      height: 3px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #555;
    }

    .record-reason {
      overflow: hidden;
      color: #777;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      padding: 40px 15px;
      color: #666;
      text-align: center;
      font-size: 13px;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    .mobile-brand {
      display: none;
    }

    .mobile-sheet {
      display: none;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .mobile-brand {
        position: fixed;
        z-index: 900;
        top: 18px;
        left: 18px;
        display: block;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(17, 17, 17, 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        pointer-events: none;
      }

      .mobile-brand-title {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .mobile-sheet {
        position: fixed;
        z-index: 1000;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        height: 45vh;
        min-height: 260px;
        max-height: calc(100vh - 70px);
        padding: 10px 14px max(14px, env(safe-area-inset-bottom));
        border-radius: 20px 20px 0 0;
        background: rgba(17, 17, 17, 0.97);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 -12px 35px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transform: translateY(calc(100% - 78px));
        transition: transform 0.28s ease;
        will-change: transform;
      }

      .mobile-sheet.middle {
        transform: translateY(0);
      }

      .mobile-sheet.expanded {
        height: calc(100vh - 70px);
        max-height: calc(100vh - 70px);
        transform: translateY(0);
      }

      .sheet-handle-area {
        flex-shrink: 0;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        cursor: grab;
      }

      .sheet-handle {
        width: 38px;
        height: 4px;
        border-radius: 999px;
        background: #555;
      }

      .mobile-search {
        flex-shrink: 0;
        margin-bottom: 10px;
      }

      .mobile-search input {
        width: 100%;
        height: 43px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 11px;
        outline: none;
        background: rgba(255, 255, 255, 0.055);
        color: #fff;
        font-size: 13px;
      }

      .mobile-search input::placeholder {
        color: #666;
      }

      .mobile-stats {
        flex-shrink: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .mobile-stat {
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.045);
      }

      .mobile-stat-label {
        color: #666;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.8px;
      }

      .mobile-stat-value {
        margin-top: 1px;
        font-size: 16px;
        font-weight: 800;
      }

      .mobile-list-header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 0 2px;
      }

      .mobile-list-title {
        color: #888;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.2px;
      }

      .mobile-list-count {
        color: #555;
        font-size: 10px;
      }

      /*
       * 핵심 수정:
       * 리스트 자체가 시트의 남은 공간을 전부 차지하도록 하고
       * safe-area + 추가 bottom padding을 확보한다.
       */
      .mobile-record-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 1px 28px;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .mobile-record-list::-webkit-scrollbar {
        display: none;
      }

      .mobile-record-item {
        width: 100%;
        margin-bottom: 8px;
        padding: 12px 13px;
        border: 1px solid rgba(255, 255, 255, 0.055);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.045);
        color: #fff;
        text-align: left;
      }

      .mobile-record-item.active {
        background: rgba(255, 92, 45, 0.13);
        border-color: rgba(255, 92, 45, 0.55);
      }

      .mobile-record-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .mobile-record-car {
        font-size: 14px;
        font-weight: 800;
      }

      .mobile-record-date {
        color: #999;
        font-size: 10px;
        font-weight: 600;
      }

      .mobile-record-info {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        min-width: 0;
      }

      .mobile-record-model,
      .mobile-record-reason {
        overflow: hidden;
        color: #888;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-record-model {
        color: #aaa;
      }

      .mobile-record-dot {
        width: 3px;
        height: 3px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #555;
      }

      .mobile-empty {
        padding: 35px 10px;
        color: #666;
        text-align: center;
        font-size: 12px;
      }
    }

    /* =========================================================
       CUSTOM KAKAO INFO WINDOW
    ========================================================= */

    .custom-infowindow {
      position: relative;
      min-width: 210px;
      padding: 13px 15px;
      border: 1px solid rgba(255, 92, 45, 0.45);
      border-radius: 12px;
      background: rgba(17, 17, 17, 0.96);
      color: #fff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .custom-infowindow::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #111;
      border-right: 1px solid rgba(255, 92, 45, 0.45);
      border-bottom: 1px solid rgba(255, 92, 45, 0.45);
      transform: translateX(-50%) rotate(45deg);
    }

    .info-car {
      font-size: 15px;
      font-weight: 800;
    }

    .info-date {
      margin-top: 4px;
      color: #aaa;
      font-size: 11px;
    }

    .info-model {
      margin-top: 8px;
      color: #ddd;
      font-size: 12px;
    }

    .info-reason {
      margin-top: 3px;
      color: #888;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- =======================================================
       DESKTOP
  ======================================================== -->

  <aside class="sidebar">

    <div class="brand">
      <h1 class="brand-title">전손맵</h1>
      <div class="brand-subtitle">VEHICLE INCIDENT MAP</div>
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="차량번호, 차종, 날짜, 사고내용 검색"
        autocomplete="off"
      />
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">RECORDS</div>
        <div class="stat-value" id="recordCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">VEHICLES</div>
        <div class="stat-value" id="vehicleCount">0</div>
      </div>
    </div>

    <div class="list-header">
      <div class="list-title">INCIDENT RECORDS</div>
      <div class="list-count" id="listCount">0</div>
    </div>

    <div class="record-list" id="recordList"></div>

  </aside>


  <!-- =======================================================
       MOBILE BRAND
  ======================================================== -->

  <div class="mobile-brand">
    <div class="mobile-brand-title">전손맵</div>
  </div>


  <!-- =======================================================
       MOBILE BOTTOM SHEET
  ======================================================== -->

  <section class="mobile-sheet" id="mobileSheet">

    <div class="sheet-handle-area" id="sheetHandle">
      <div class="sheet-handle"></div>
    </div>

    <div class="mobile-search">
      <input
        id="mobileSearchInput"
        type="text"
        placeholder="차량번호, 차종, 날짜, 사고내용 검색"
        autocomplete="off"
      />
    </div>

    <div class="mobile-stats">

      <div class="mobile-stat">
        <div class="mobile-stat-label">RECORDS</div>
        <div class="mobile-stat-value" id="mobileRecordCount">0</div>
      </div>

      <div class="mobile-stat">
        <div class="mobile-stat-label">VEHICLES</div>
        <div class="mobile-stat-value" id="mobileVehicleCount">0</div>
      </div>

    </div>

    <div class="mobile-list-header">
      <div class="mobile-list-title">VEHICLE INCIDENT MAP</div>
      <div class="mobile-list-count" id="mobileListCount">0</div>
    </div>

    <div class="mobile-record-list" id="mobileRecordList"></div>

  </section>


  <!-- =======================================================
       KAKAO MAP
  ======================================================== -->

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer"
  ></script>

  <script>
    /* =========================================================
       GLOBAL
    ========================================================= */

    let map;
    let clusterer;

    let records = [];
    let markers = [];

    let activeRecordIndex = null;
    let currentInfoWindow = null;


    /* =========================================================
       DOM
    ========================================================= */

    const recordList = document.getElementById("recordList");
    const mobileRecordList = document.getElementById("mobileRecordList");

    const searchInput = document.getElementById("searchInput");
    const mobileSearchInput = document.getElementById("mobileSearchInput");


    /* =========================================================
       MAP INIT
    ========================================================= */

    function initMap() {

      const container = document.getElementById("map");

      map = new kakao.maps.Map(container, {
        center: new kakao.maps.LatLng(36.5, 127.8),
        level: 13
      });

      clusterer = new kakao.maps.MarkerClusterer({
        map: map,
        averageCenter: true,
        minLevel: 7
      });

      loadData();
    }


    /* =========================================================
       DATE
       YYMMDD → YYYY.MM.DD
    ========================================================= */

    function parseRecordDate(value) {

      if (value === null || value === undefined) {
        return {
          valid: false,
          text: "-"
        };
      }

      const str = String(value).trim();

      if (!/^\d{6}$/.test(str)) {
        return {
          valid: false,
          text: str || "-"
        };
      }

      const yy = Number(str.slice(0, 2));
      const mm = Number(str.slice(2, 4));
      const dd = Number(str.slice(4, 6));

      const year = 2000 + yy;

      const date = new Date(year, mm - 1, dd);

      if (
        date.getFullYear() !== year ||
        date.getMonth() !== mm - 1 ||
        date.getDate() !== dd
      ) {
        return {
          valid: false,
          text: str
        };
      }

      return {
        valid: true,
        text:
          String(year).padStart(4, "0") +
          "." +
          String(mm).padStart(2, "0") +
          "." +
          String(dd).padStart(2, "0")
      };
    }


    function getRecordDateTimestamp(value) {

      const parsed = parseRecordDate(value);

      if (!parsed.valid) {
        return NaN;
      }

      const str = String(value).trim();

      const yy = Number(str.slice(0, 2));
      const mm = Number(str.slice(2, 4));
      const dd = Number(str.slice(4, 6));

      return new Date(
        2000 + yy,
        mm - 1,
        dd
      ).getTime();
    }


    /* =========================================================
       SORT
       최신 날짜 → 과거 날짜
       잘못된 날짜는 가장 아래
    ========================================================= */

    function sortRecordsByDateDesc(data) {

      return [...data].sort((a, b) => {

        const dateA = getRecordDateTimestamp(a.date);
        const dateB = getRecordDateTimestamp(b.date);

        const validA = Number.isFinite(dateA);
        const validB = Number.isFinite(dateB);

        // 유효한 날짜가 먼저
        if (validA && !validB) {
          return -1;
        }

        if (!validA && validB) {
          return 1;
        }

        // 둘 다 유효한 경우 최신 날짜 우선
        if (validA && validB) {

          if (dateB !== dateA) {
            return dateB - dateA;
          }
        }

        // 날짜가 같으면 원본 JSON 순서 유지
        return a.originalIndex - b.originalIndex;
      });
    }


    /* =========================================================
       DATA LOAD
    ========================================================= */

    async function loadData() {

      try {

        const response = await fetch("./list.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("list.json을 불러오지 못했습니다.");
        }

        const json = await response.json();

        const source =
          Array.isArray(json)
            ? json
            : Array.isArray(json.records)
              ? json.records
              : [];

        /*
         * 원본 index를 먼저 부여한다.
         * 날짜 정렬 이후에도 각 기록의 고유 식별자로 사용한다.
         */
        records = source
          .map((item, index) => ({
            ...item,
            originalIndex: index
          }))
          .filter(item => {

            const lat = Number(
              item.lat ??
              item.latitude ??
              item.y
            );

            const lng = Number(
              item.lng ??
              item.longitude ??
              item.lon ??
              item.x
            );

            return Number.isFinite(lat) && Number.isFinite(lng);
          });

        /*
         * 핵심:
         * 리스트와 검색 결과 모두 최신 날짜가 위로 오도록
         * 전체 records 자체를 날짜 내림차순으로 정렬한다.
         */
        records = sortRecordsByDateDesc(records);

        updateStats(records);
        renderList(records);
        createMarkers(records);
        fitMap();

      } catch (error) {

        console.error(error);

        recordList.innerHTML =
          '<div class="empty">데이터를 불러오지 못했습니다.</div>';

        mobileRecordList.innerHTML =
          '<div class="mobile-empty">데이터를 불러오지 못했습니다.</div>';
      }
    }


    /* =========================================================
       RECORD LOOKUP
       정렬 후에도 originalIndex로 정확하게 찾기
    ========================================================= */

    function findRecordByOriginalIndex(originalIndex) {

      return records.find(
        item => Number(item.originalIndex) === Number(originalIndex)
      );
    }


    /* =========================================================
       FIELD HELPERS
    ========================================================= */

    function getCarNumber(item) {

      return (
        item.carNumber ??
        item.car_number ??
        item.number ??
        item.plate ??
        item.차량번호 ??
        "-"
      );
    }


    function getCarModel(item) {

      return (
        item.carModel ??
        item.car_model ??
        item.model ??
        item.vehicle ??
        item.차종 ??
        "-"
      );
    }


    function getReason(item) {

      return (
        item.reason ??
        item.incident ??
        item.accident ??
        item.content ??
        item.description ??
        item.사고내용 ??
        "-"
      );
    }


    function getDateValue(item) {

      return (
        item.date ??
        item.incidentDate ??
        item.incident_date ??
        item.accidentDate ??
        item.accident_date ??
        item.사고일 ??
        "-"
      );
    }


    function getLat(item) {

      return Number(
        item.lat ??
        item.latitude ??
        item.y
      );
    }


    function getLng(item) {

      return Number(
        item.lng ??
        item.longitude ??
        item.lon ??
        item.x
      );
    }


    /* =========================================================
       STATS
    ========================================================= */

    function updateStats(data) {

      const uniqueVehicles = new Set(
        data.map(item => String(getCarNumber(item)))
      );

      const recordCount = data.length;
      const vehicleCount = uniqueVehicles.size;

      document.getElementById("recordCount").textContent =
        recordCount.toLocaleString();

      document.getElementById("vehicleCount").textContent =
        vehicleCount.toLocaleString();

      document.getElementById("listCount").textContent =
        recordCount.toLocaleString();

      document.getElementById("mobileRecordCount").textContent =
        recordCount.toLocaleString();

      document.getElementById("mobileVehicleCount").textContent =
        vehicleCount.toLocaleString();

      document.getElementById("mobileListCount").textContent =
        recordCount.toLocaleString();
    }


    /* =========================================================
       LIST RENDER
    ========================================================= */

    function renderList(data) {

      if (!data.length) {

        recordList.innerHTML =
          '<div class="empty">검색 결과가 없습니다.</div>';

        mobileRecordList.innerHTML =
          '<div class="mobile-empty">검색 결과가 없습니다.</div>';

        return;
      }

      /*
       * 혹시 renderList에 정렬되지 않은 배열이 전달되더라도
       * 항상 최신 날짜 순으로 표시한다.
       */
      const sortedData = sortRecordsByDateDesc(data);

      recordList.innerHTML = sortedData
        .map(item => {

          const date = parseRecordDate(getDateValue(item));

          return `
            <button
              class="record-item ${activeRecordIndex === item.originalIndex ? "active" : ""}"
              data-index="${item.originalIndex}"
              type="button"
            >
              <div class="record-top">
                <div class="record-car">
                  ${escapeHtml(getCarNumber(item))}
                </div>

                <div class="record-date">
                  ${escapeHtml(date.text)}
                </div>
              </div>

              <div class="record-info">

                <div class="record-model">
                  ${escapeHtml(getCarModel(item))}
                </div>

                <div class="record-dot"></div>

                <div class="record-reason">
                  ${escapeHtml(getReason(item))}
                </div>

              </div>
            </button>
          `;
        })
        .join("");

      mobileRecordList.innerHTML = sortedData
        .map(item => {

          const date = parseRecordDate(getDateValue(item));

          return `
            <button
              class="mobile-record-item ${activeRecordIndex === item.originalIndex ? "active" : ""}"
              data-index="${item.originalIndex}"
              type="button"
            >
              <div class="mobile-record-top">

                <div class="mobile-record-car">
                  ${escapeHtml(getCarNumber(item))}
                </div>

                <div class="mobile-record-date">
                  ${escapeHtml(date.text)}
                </div>

              </div>

              <div class="mobile-record-info">

                <div class="mobile-record-model">
                  ${escapeHtml(getCarModel(item))}
                </div>

                <div class="mobile-record-dot"></div>

                <div class="mobile-record-reason">
                  ${escapeHtml(getReason(item))}
                </div>

              </div>
            </button>
          `;
        })
        .join("");

      bindListEvents();
    }


    /* =========================================================
       LIST EVENT
    ========================================================= */

    function bindListEvents() {

      document
        .querySelectorAll(".record-item, .mobile-record-item")
        .forEach(button => {

          button.addEventListener("click", () => {

            const originalIndex =
              Number(button.dataset.index);

            selectRecord(originalIndex);

          });

        });
    }


    /* =========================================================
       MARKERS
    ========================================================= */

    function createMarkers(data) {

      clusterer.clear();

      markers.forEach(marker => {
        marker.setMap(null);
      });

      markers = [];

      data.forEach(item => {

        const position = new kakao.maps.LatLng(
          getLat(item),
          getLng(item)
        );

        const marker = new kakao.maps.Marker({
          position: position
        });

        kakao.maps.event.addListener(
          marker,
          "click",
          () => {

            openMarkerInfo(
              item.originalIndex,
              marker
            );

          }
        );

        markers.push(marker);
      });

      clusterer.addMarkers(markers);
    }


    /* =========================================================
       INFO WINDOW
    ========================================================= */

    function createInfoWindowContent(item) {

      const date = parseRecordDate(
        getDateValue(item)
      );

      return `
        <div class="custom-infowindow">

          <div class="info-car">
            ${escapeHtml(getCarNumber(item))}
          </div>

          <div class="info-date">
            ${escapeHtml(date.text)}
          </div>

          <div class="info-model">
            ${escapeHtml(getCarModel(item))}
          </div>

          <div class="info-reason">
            ${escapeHtml(getReason(item))}
          </div>

        </div>
      `;
    }


    function openMarkerInfo(originalIndex, marker) {

      const item =
        findRecordByOriginalIndex(originalIndex);

      if (!item) {
        return;
      }

      if (currentInfoWindow) {
        currentInfoWindow.close();
      }

      currentInfoWindow =
        new kakao.maps.InfoWindow({
          content: createInfoWindowContent(item),
          removable: false
        });

      currentInfoWindow.open(map, marker);

      activeRecordIndex = originalIndex;

      renderList(filterRecords(searchInput.value));

      /*
       * 모바일에서는 선택한 차량이 목록 안에 보이도록
       * 해당 항목을 자동 스크롤한다.
       */
      setTimeout(() => {

        scrollActiveItemIntoView();

      }, 50);
    }


    /* =========================================================
       SELECT RECORD
    ========================================================= */

    function selectRecord(originalIndex) {

      const item =
        findRecordByOriginalIndex(originalIndex);

      if (!item) {
        return;
      }

      activeRecordIndex = originalIndex;

      const marker =
        markers.find(marker => {

          const position =
            marker.getPosition();

          return (
            Math.abs(position.getLat() - getLat(item)) < 0.000001 &&
            Math.abs(position.getLng() - getLng(item)) < 0.000001
          );

        });

      if (marker) {

        map.setCenter(
          marker.getPosition()
        );

        if (map.getLevel() > 5) {
          map.setLevel(5);
        }

        openMarkerInfo(
          originalIndex,
          marker
        );
      } else {

        renderList(
          filterRecords(searchInput.value)
        );
      }
    }


    /* =========================================================
       SEARCH
    ========================================================= */

    function filterRecords(keyword) {

      const query =
        String(keyword || "")
          .trim()
          .toLowerCase();

      if (!query) {
        return records;
      }

      return records.filter(item => {

        const values = [

          getCarNumber(item),
          getCarModel(item),
          getDateValue(item),
          getReason(item)

        ];

        return values.some(value =>
          String(value ?? "")
            .toLowerCase()
            .includes(query)
        );
      });
    }


    function handleSearch(keyword) {

      const filtered =
        filterRecords(keyword);

      updateStats(filtered);
      renderList(filtered);
      createMarkers(filtered);

      /*
       * 검색 결과가 있을 때 지도도 검색 결과에 맞춘다.
       */
      if (filtered.length) {
        fitMap(filtered);
      }
    }


    searchInput.addEventListener(
      "input",
      event => {

        const value =
          event.target.value;

        mobileSearchInput.value = value;

        handleSearch(value);

      }
    );


    mobileSearchInput.addEventListener(
      "input",
      event => {

        const value =
          event.target.value;

        searchInput.value = value;

        handleSearch(value);

      }
    );


    /* =========================================================
       FIT MAP
    ========================================================= */

    function fitMap(data = records) {

      if (!data.length) {
        return;
      }

      const bounds =
        new kakao.maps.LatLngBounds();

      data.forEach(item => {

        bounds.extend(
          new kakao.maps.LatLng(
            getLat(item),
            getLng(item)
          )
        );

      });

      map.setBounds(bounds, 70, 70, 70, 70);
    }


    /* =========================================================
       MOBILE ACTIVE ITEM SCROLL
    ========================================================= */

    function scrollActiveItemIntoView() {

      const item =
        mobileRecordList.querySelector(
          `.mobile-record-item[data-index="${activeRecordIndex}"]`
        );

      if (!item) {
        return;
      }

      item.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }


    /* =========================================================
       MOBILE BOTTOM SHEET
    ========================================================= */

    const mobileSheet =
      document.getElementById("mobileSheet");

    const sheetHandle =
      document.getElementById("sheetHandle");

    let sheetStartY = 0;
    let sheetStartTranslate = 0;
    let sheetDragging = false;


    function getSheetState() {

      if (
        mobileSheet.classList.contains("expanded")
      ) {
        return "expanded";
      }

      if (
        mobileSheet.classList.contains("middle")
      ) {
        return "middle";
      }

      return "collapsed";
    }


    function setSheetState(state) {

      mobileSheet.classList.remove(
        "middle",
        "expanded"
      );

      if (state === "middle") {
        mobileSheet.classList.add("middle");
      }

      if (state === "expanded") {
        mobileSheet.classList.add("expanded");
      }
    }


    sheetHandle.addEventListener(
      "pointerdown",
      event => {

        sheetDragging = true;
        sheetStartY = event.clientY;

        sheetHandle.setPointerCapture(
          event.pointerId
        );

        mobileSheet.style.transition = "none";
      }
    );


    sheetHandle.addEventListener(
      "pointermove",
      event => {

        if (!sheetDragging) {
          return;
        }

        const delta =
          event.clientY - sheetStartY;

        if (delta < -35) {
          setSheetState("expanded");
        } else if (delta > 35) {
          setSheetState("collapsed");
        }
      }
    );


    sheetHandle.addEventListener(
      "pointerup",
      event => {

        sheetDragging = false;

        mobileSheet.style.transition = "";

        sheetHandle.releasePointerCapture(
          event.pointerId
        );
      }
    );


    sheetHandle.addEventListener(
      "click",
      () => {

        const state =
          getSheetState();

        if (state === "collapsed") {
          setSheetState("middle");
        } else if (state === "middle") {
          setSheetState("expanded");
        } else {
          setSheetState("collapsed");
        }

      }
    );


    /*
     * 모바일 시트 내부를 터치했을 때
     * 리스트 스크롤을 방해하지 않도록 한다.
     */
    mobileRecordList.addEventListener(
      "touchstart",
      event => {
        event.stopPropagation();
      },
      { passive: true }
    );


    mobileRecordList.addEventListener(
      "touchmove",
      event => {
        event.stopPropagation();
      },
      { passive: true }
    );


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================================
       KAKAO LOAD
    ========================================================= */

    if (
      typeof kakao !== "undefined" &&
      kakao.maps
    ) {

      kakao.maps.load(
        initMap
      );

    }
  </script>

</body>
</html>
