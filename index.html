<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>전손맵</title>

  <style>
    :root {
      --bg: #080b0f;
      --panel: #0d1117;
      --panel-2: #11161d;
      --panel-3: #171d25;

      --text: #f5f7fa;
      --text-soft: #c4cbd4;
      --text-muted: #89929e;

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);

      --accent: #f05a3d;
      --accent-soft: rgba(240, 90, 61, 0.12);
      --accent-border: rgba(240, 90, 61, 0.42);

      --danger: #ff6962;

      --sidebar-width: 390px;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button,
    input {
      font: inherit;
    }

    #app {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--bg);
    }

    /* =========================================================
       MAP
    ========================================================= */

    #map {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #10151b;
    }

    /* =========================================================
       MOBILE BRAND
    ========================================================= */

    .mobile-top-brand {
      display: none;
    }

    /* =========================================================
       MAP ACTION
    ========================================================= */

    .map-actions {
      position: absolute;
      z-index: 20;

      top: 18px;
      right: calc(var(--sidebar-width) + 18px);
    }

    .map-button {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid var(--border-strong);
      border-radius: 12px;

      background: rgba(13, 17, 23, 0.92);
      color: var(--text);

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .map-button:hover {
      background: #171d25;
    }

    .map-button:active {
      transform: scale(0.94);
    }

    .map-button svg {
      width: 20px;
      height: 20px;

      stroke: currentColor;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      position: absolute;
      z-index: 30;

      top: 0;
      right: 0;
      bottom: 0;

      width: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          180deg,
          rgba(13, 17, 23, 0.98),
          rgba(9, 12, 16, 0.98)
        );

      border-left: 1px solid var(--border);

      box-shadow:
        -15px 0 40px rgba(0, 0, 0, 0.22);

      overflow: hidden;
    }

    .sidebar-handle-area {
      display: none;
    }

    /* =========================================================
       SIDEBAR HEADER
    ========================================================= */

    .sidebar-header {
      flex: 0 0 auto;

      padding: 28px 24px 20px;

      border-bottom: 1px solid var(--border);
    }

    .brand {
      margin-bottom: 22px;
    }

    .brand-title {
      display: flex;
      align-items: center;

      gap: 9px;

      font-size: 25px;
      font-weight: 800;

      letter-spacing: -0.055em;
    }

    .brand-icon {
      font-size: 22px;
      line-height: 1;
    }

    .brand-subtitle {
      margin-top: 7px;

      color: var(--text-muted);

      font-size: 11px;
      font-weight: 500;

      line-height: 1.5;
    }

    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;

      left: 13px;
      top: 50%;

      width: 16px;
      height: 16px;

      transform: translateY(-50%);

      color: var(--text-muted);

      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 43px;

      padding: 0 14px 0 39px;

      border: 1px solid var(--border);
      border-radius: 11px;

      outline: none;

      background: var(--panel-2);
      color: var(--text);

      font-size: 13px;

      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    #searchInput::placeholder {
      color: #68717d;
    }

    #searchInput:focus {
      border-color: var(--accent-border);
      background: var(--panel-3);
    }

    /* =========================================================
       STATS
       PC ONLY
    ========================================================= */

    .stats {
      flex: 0 0 auto;

      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 8px;

      padding: 13px 18px;
    }

    .stat {
      min-height: 72px;

      padding: 13px 14px;

      border: 1px solid var(--border);
      border-radius: var(--radius-sm);

      background: rgba(255, 255, 255, 0.018);
    }

    .stat-label {
      color: var(--text-muted);

      font-size: 9px;
      font-weight: 700;

      letter-spacing: 0.1em;
    }

    .stat-value {
      margin-top: 7px;

      color: var(--text);

      font-size: 22px;
      font-weight: 750;

      letter-spacing: -0.04em;
    }

    /* =========================================================
       LIST HEADER
    ========================================================= */

    .list-header {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 18px 9px;

      border-top: 1px solid var(--border);
    }

    .list-title {
      color: var(--text-muted);

      font-size: 9px;
      font-weight: 800;

      letter-spacing: 0.12em;
    }

    .list-count {
      min-width: 25px;
      height: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 7px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--text-soft);

      background: rgba(255, 255, 255, 0.025);

      font-size: 10px;
      font-weight: 700;
    }

    /* =========================================================
       LIST
    ========================================================= */

    .list {
      flex: 1 1 auto;
      min-height: 0;

      padding: 0 12px 20px;

      overflow-y: auto;
      overflow-x: hidden;

      overscroll-behavior-y: contain;
      overscroll-behavior-x: none;

      touch-action: pan-y;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;
      scrollbar-color:
        rgba(255, 255, 255, 0.12)
        transparent;
    }

    .list::-webkit-scrollbar {
      width: 5px;
    }

    .list::-webkit-scrollbar-track {
      background: transparent;
    }

    .list::-webkit-scrollbar-thumb {
      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.12);
    }

    /* =========================================================
       RECORD
    ========================================================= */

    .record {
      width: 100%;

      display: block;

      margin: 0 0 7px;
      padding: 15px;

      border: 1px solid transparent;
      border-radius: 13px;

      background:
        rgba(255, 255, 255, 0.025);

      color: var(--text);

      text-align: left;

      cursor: pointer;

      touch-action: manipulation;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .record:hover {
      background:
        rgba(255, 255, 255, 0.045);

      border-color: var(--border);
    }

    .record:active {
      transform: scale(0.99);
    }

    .record.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .record-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .record-car-number {
      color: var(--text);

      font-size: 14px;
      font-weight: 750;

      letter-spacing: -0.025em;
    }

    .record-date {
      flex: 0 0 auto;

      color: var(--text-muted);

      font-size: 10px;
      font-weight: 600;

      white-space: nowrap;
    }

    .record-car {
      margin-top: 6px;

      color: var(--text-soft);

      font-size: 12px;
      font-weight: 550;

      line-height: 1.4;
    }

    .record-reason {
      margin-top: 8px;

      color: var(--text-muted);

      font-size: 11px;

      line-height: 1.45;
    }

    /* =========================================================
       EMPTY
    ========================================================= */

    .empty {
      padding: 40px 20px;

      color: var(--text-muted);

      font-size: 12px;

      line-height: 1.6;

      text-align: center;
    }

    /* =========================================================
       INFO WINDOW
    ========================================================= */

    .custom-info {
      min-width: 235px;
      max-width: 290px;

      padding: 14px 15px;

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;

      background:
        rgba(13, 17, 23, 0.97);

      color: var(--text);

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35),
        inset 0 1px 0
          rgba(255, 255, 255, 0.025);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .custom-info-title {
      font-size: 14px;
      font-weight: 800;

      letter-spacing: -0.02em;
    }

    .custom-info-car {
      margin-top: 5px;

      color: var(--text-soft);

      font-size: 11px;
    }

    .custom-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-top: 9px;
      padding-top: 9px;

      border-top: 1px solid var(--border);

      font-size: 10px;
    }

    .custom-info-label {
      color: var(--text-muted);
    }

    .custom-info-value {
      color: var(--text-soft);

      font-weight: 600;

      text-align: right;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {
      :root {
        /*
          시트 전체 높이.
          collapsed가 높을수록 화면 아래로 더 많이 내려감.
        */
        --sheet-height: 82vh;
      }

      #map {
        inset: 0;
      }

      /* -------------------------------------------------------
         MOBILE BRAND
      ------------------------------------------------------- */

      .mobile-top-brand {
        position: absolute;
        z-index: 15;

        top: max(
          14px,
          env(safe-area-inset-top)
        );

        left: 16px;

        display: block;

        pointer-events: none;

        text-shadow:
          0 2px 8px rgba(0, 0, 0, 0.65);
      }

      .mobile-top-brand-title {
        display: flex;
        align-items: center;

        gap: 7px;

        font-size: 17px;
        font-weight: 800;

        letter-spacing: -0.045em;
      }

      .mobile-top-brand-icon {
        font-size: 16px;
      }

      .mobile-top-brand-subtitle {
        margin-top: 3px;

        color:
          rgba(255, 255, 255, 0.72);

        font-size: 8px;
        font-weight: 500;
      }

      /* -------------------------------------------------------
         MAP BUTTON
      ------------------------------------------------------- */

      .map-actions {
        top: max(
          14px,
          env(safe-area-inset-top)
        );

        right: 14px;
      }

      .map-button {
        width: 40px;
        height: 40px;
      }

      /* -------------------------------------------------------
         SIDEBAR
      ------------------------------------------------------- */

      .sidebar {
        position: absolute;

        top: auto;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100%;
        height: var(--sheet-height);

        display: flex;
        flex-direction: column;

        border-top: 1px solid var(--border);
        border-left: 0;

        border-radius:
          20px
          20px
          0
          0;

        background:
          linear-gradient(
            180deg,
            rgba(13, 17, 23, 0.99),
            rgba(9, 12, 16, 0.99)
          );

        box-shadow:
          0 -15px 45px
          rgba(0, 0, 0, 0.32);

        /*
          중요:
          기존 코드의 pointer-events:none 제거.
          iPhone Safari에서 터치 이벤트가 막히는 것을 방지.
        */
        pointer-events: auto;

        /*
          JS가 직접 transform을 제어한다.
        */
        transform:
          translateY(
            calc(
              var(--sheet-height)
              -
              21vh
            )
          );

        transition:
          transform
          0.28s
          cubic-bezier(
            0.22,
            0.75,
            0.2,
            1
          );

        overflow: hidden;

        /*
          리스트는 내부에서 직접 처리하므로
          sidebar 전체를 브라우저 기본 스크롤로 만들지 않는다.
        */
        touch-action: none;
      }

      /* -------------------------------------------------------
         SHEET HANDLE
      ------------------------------------------------------- */

      .sidebar-handle-area {
        flex: 0 0 auto;

        height: 32px;

        display: flex;
        align-items: center;
        justify-content: center;

        /*
          핸들에서만 시트 드래그.
        */
        touch-action: none;

        -webkit-user-select: none;
        user-select: none;

        cursor: grab;
      }

      .sidebar-handle-area:active {
        cursor: grabbing;
      }

      .sidebar-handle {
        width: 38px;
        height: 4px;

        border-radius: 999px;

        background:
          rgba(255, 255, 255, 0.22);
      }

      /* -------------------------------------------------------
         HEADER
      ------------------------------------------------------- */

      .sidebar-header {
        flex: 0 0 auto;

        padding:
          0
          18px
          12px;

        border-bottom:
          1px solid var(--border);
      }

      .brand {
        display: none;
      }

      #searchInput {
        height: 41px;
      }

      /* -------------------------------------------------------
         REMOVE RECORDS / VEHICLES ON MOBILE
      ------------------------------------------------------- */

      .stats {
        display: none;
      }

      /* -------------------------------------------------------
         LIST HEADER
      ------------------------------------------------------- */

      .list-header {
        flex: 0 0 auto;

        padding:
          10px
          18px
          7px;

        border-top: 0;
      }

      /* -------------------------------------------------------
         LIST
      ------------------------------------------------------- */

      .list {
        position: relative;

        min-height: 0;
        height: 0;

        flex: 1 1 auto;

        padding:
          0
          10px
          calc(
            40px
            +
            env(safe-area-inset-bottom)
          );

        overflow-y: scroll;
        overflow-x: hidden;

        -webkit-overflow-scrolling: touch;

        overscroll-behavior-y: contain;
        overscroll-behavior-x: none;

        /*
          핵심:
          리스트는 세로 스크롤만 담당.
          부모 시트 드래그와 분리.
        */
        touch-action: pan-y;

        /*
          iOS 렌더링 안정화.
        */
        transform: translateZ(0);
        -webkit-transform: translateZ(0);

        /*
          반드시 클릭/스크롤 가능.
        */
        pointer-events: auto;
      }

      .record {
        padding: 14px;

        touch-action: manipulation;
      }

      .custom-info {
        min-width: 220px;
        max-width: 270px;

        padding: 13px 14px;
      }

      .custom-info-title {
        font-size: 13px;
      }
    }

    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 420px) {
      .mobile-top-brand {
        left: 14px;
      }

      .mobile-top-brand-title {
        font-size: 16px;
      }

      .list {
        padding-left: 9px;
        padding-right: 9px;
      }

      .record {
        padding: 13px;
      }

      .record-car-number {
        font-size: 13px;
      }

      .record-car {
        font-size: 11px;
      }

      .record-reason {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- =======================================================
         MAP
    ======================================================== -->

    <div id="map"></div>

    <!-- =======================================================
         MOBILE BRAND
    ======================================================== -->

    <div class="mobile-top-brand">

      <div class="mobile-top-brand-title">
        <span class="mobile-top-brand-icon">
          🤪
        </span>

        <span>
          전손맵
        </span>
      </div>

      <div class="mobile-top-brand-subtitle">
        다음은 너다!!! -사고차주 일동-
      </div>

    </div>

    <!-- =======================================================
         MAP ACTION
    ======================================================== -->

    <div class="map-actions">

      <button
        type="button"
        class="map-button"
        id="fitButton"
        aria-label="전체 보기"
        title="전체 보기"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M16 3h3a2 2 0 0 1 2 2v3" />
          <path d="M21 16v3a2 2 0 0 1-2 2h-3" />
          <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
        </svg>

      </button>

    </div>

    <!-- =======================================================
         SIDEBAR / BOTTOM SHEET
    ======================================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <!-- MOBILE HANDLE -->

      <div
        class="sidebar-handle-area"
        id="sheetHandle"
      >
        <div class="sidebar-handle"></div>
      </div>

      <!-- HEADER -->

      <div class="sidebar-header">

        <div class="brand">

          <div class="brand-title">

            <span class="brand-icon">
              🤪
            </span>

            <span>
              전손맵
            </span>

          </div>

          <div class="brand-subtitle">
            다음은 너다!!! -사고차주 일동-
          </div>

        </div>

        <!-- SEARCH -->

        <div class="search-wrap">

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle
              cx="11"
              cy="11"
              r="7"
            ></circle>

            <path
              d="m20 20-3.5-3.5"
            ></path>
          </svg>

          <input
            type="search"
            id="searchInput"
            placeholder="차량번호, 차종, 사고사유 검색"
            autocomplete="off"
            spellcheck="false"
          />

        </div>

      </div>

      <!-- =====================================================
           STATS
           PC에서는 표시.
           모바일에서는 display:none.
      ====================================================== -->

      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            RECORDS
          </div>

          <div
            class="stat-value"
            id="totalCount"
          >
            0
          </div>

        </div>

        <div class="stat">

          <div class="stat-label">
            VEHICLES
          </div>

          <div
            class="stat-value"
            id="vehicleCount"
          >
            0
          </div>

        </div>

      </div>

      <!-- =====================================================
           LIST HEADER
      ====================================================== -->

      <div class="list-header">

        <div class="list-title">
          INCIDENT RECORDS
        </div>

        <div
          class="list-count"
          id="listCount"
        >
          0
        </div>

      </div>

      <!-- =====================================================
           RECORD LIST
      ====================================================== -->

      <div
        class="list"
        id="recordList"
      ></div>

    </aside>

  </div>

  <!-- =========================================================
       KAKAO MAP SDK
  ========================================================== -->

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f26ddb0373cd3b598ff54652cbbdc24&libraries=clusterer"
  ></script>

  <script>
    /* =========================================================
       GLOBAL
    ========================================================= */

    let map = null;

    let clusterer = null;

    let records = [];

    let markers = [];

    /*
      원본 recordId → record
    */
    let recordById = new Map();

    /*
      recordId → {
        marker,
        infoWindow
      }
    */
    let markerByRecordId = new Map();

    let activeRecordId = null;

    let activeInfoWindow = null;


    /* =========================================================
       SHEET STATE
    ========================================================= */

    const sheetState = {

      current: "collapsed",

      dragging: false,

      startY: 0,

      startTranslate: 0,

      currentTranslate: 0,

      lastY: 0,

      lastTime: 0,

      velocity: 0

    };


    /* =========================================================
       DOM
    ========================================================= */

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const sheetHandle =
      document.getElementById(
        "sheetHandle"
      );

    const recordList =
      document.getElementById(
        "recordList"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const totalCount =
      document.getElementById(
        "totalCount"
      );

    const vehicleCount =
      document.getElementById(
        "vehicleCount"
      );

    const listCount =
      document.getElementById(
        "listCount"
      );

    const fitButton =
      document.getElementById(
        "fitButton"
      );


    /* =========================================================
       MOBILE
    ========================================================= */

    function isMobile() {
      return window.matchMedia(
        "(max-width: 800px)"
      ).matches;
    }


    /*
      실제 화면에서 시트의 위치.

      expanded:
        화면 위쪽까지 거의 올라온 상태.

      middle:
        중간 상태.

      collapsed:
        지도 대부분을 보여주는 상태.
    */

    function getSheetPositions() {

      const height =
        window.innerHeight;

      return {

        expanded:
          height * 0.14,

        middle:
          height * 0.43,

        collapsed:
          height * 0.79

      };
    }


    function getCurrentSheetTranslate() {

      if (
        Number.isFinite(
          sheetState.currentTranslate
        ) &&
        sheetState.currentTranslate !== 0
      ) {
        return sheetState.currentTranslate;
      }

      return getSheetPositions()[
        sheetState.current
      ];
    }


    function clampSheetTranslate(
      value
    ) {

      const positions =
        getSheetPositions();

      const min =
        positions.expanded;

      const max =
        positions.collapsed;

      return Math.max(
        min,
        Math.min(max, value)
      );
    }


    function getNearestSheetState(
      translate,
      velocity = 0
    ) {

      const positions =
        getSheetPositions();

      /*
        velocity는 px/ms.

        위쪽으로 빠르게 이동:
        velocity < 0

        아래쪽으로 빠르게 이동:
        velocity > 0
      */

      if (
        Math.abs(velocity) > 0.45
      ) {

        if (velocity < 0) {

          if (
            translate >
            positions.middle
          ) {
            return "middle";
          }

          return "expanded";
        }

        if (
          translate <
          positions.middle
        ) {
          return "middle";
        }

        return "collapsed";
      }


      const entries =
        Object.entries(
          positions
        );

      entries.sort(
        (a, b) =>
          Math.abs(
            a[1] - translate
          ) -
          Math.abs(
            b[1] - translate
          )
      );

      return entries[0][0];
    }


    /*
      실제 transform 적용.

      중요:
      getSheetPositions()는
      화면 기준의 위치이고,

      transform에는
      expanded 위치를 기준으로 한
      상대적인 translate를 넣는다.
    */

    function applySheetTranslate(
      translate,
      animate = false
    ) {

      if (!isMobile()) {
        return;
      }

      const positions =
        getSheetPositions();

      const min =
        positions.expanded;

      const max =
        positions.collapsed;

      const value =
        Math.max(
          min,
          Math.min(max, translate)
        );

      const relative =
        value - min;

      sidebar.style.transition =
        animate
          ? "transform 0.28s cubic-bezier(0.22, 0.75, 0.2, 1)"
          : "none";

      sidebar.style.transform =
        `translateY(${relative}px)`;

      sheetState.currentTranslate =
        value;
    }


    function setSheetPosition(
      state,
      animate = true
    ) {

      if (!isMobile()) {
        return;
      }

      const positions =
        getSheetPositions();

      const translate =
        positions[state];

      if (
        !Number.isFinite(
          translate
        )
      ) {
        return;
      }

      sheetState.current =
        state;

      sheetState.currentTranslate =
        translate;

      applySheetTranslate(
        translate,
        animate
      );
    }


    /* =========================================================
       POINTER EVENTS
       iPhone / Safari 대응
    ========================================================= */

    function startSheetDrag(
      event
    ) {

      if (!isMobile()) {
        return;
      }

      /*
        마우스라면 왼쪽 버튼만.
      */
      if (
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }

      sheetState.dragging =
        true;

      sheetState.startY =
        event.clientY;

      sheetState.startTranslate =
        getCurrentSheetTranslate();

      sheetState.currentTranslate =
        sheetState.startTranslate;

      sheetState.lastY =
        event.clientY;

      sheetState.lastTime =
        performance.now();

      sheetState.velocity = 0;

      sidebar.style.transition =
        "none";

      /*
        iOS Safari에서도
        핸들이 pointer를 계속 잡도록 한다.
      */
      try {
        sheetHandle.setPointerCapture(
          event.pointerId
        );
      } catch (_) {}

      event.preventDefault();
    }


    function moveSheetDrag(
      event
    ) {

      if (
        !sheetState.dragging ||
        !isMobile()
      ) {
        return;
      }

      const now =
        performance.now();

      const delta =
        event.clientY -
        sheetState.startY;

      const next =
        clampSheetTranslate(
          sheetState.startTranslate +
          delta
        );

      const dt =
        Math.max(
          1,
          now -
          sheetState.lastTime
        );

      sheetState.velocity =
        (
          event.clientY -
          sheetState.lastY
        ) / dt;

      sheetState.lastY =
        event.clientY;

      sheetState.lastTime =
        now;

      applySheetTranslate(
        next,
        false
      );

      event.preventDefault();
    }


    function endSheetDrag(
      event
    ) {

      if (
        !sheetState.dragging
      ) {
        return;
      }

      sheetState.dragging =
        false;

      try {
        sheetHandle.releasePointerCapture(
          event.pointerId
        );
      } catch (_) {}

      const state =
        getNearestSheetState(
          sheetState.currentTranslate,
          sheetState.velocity
        );

      setSheetPosition(
        state,
        true
      );
    }


    /*
      기존 touch 이벤트가 아니라
      Pointer Events만 사용.
    */

    sheetHandle.addEventListener(
      "pointerdown",
      startSheetDrag
    );

    sheetHandle.addEventListener(
      "pointermove",
      moveSheetDrag
    );

    sheetHandle.addEventListener(
      "pointerup",
      endSheetDrag
    );

    sheetHandle.addEventListener(
      "pointercancel",
      endSheetDrag
    );


    /* =========================================================
       LIST TOUCH
       리스트 스크롤과 시트 드래그 분리
    ========================================================= */

    [
      "touchstart",
      "touchmove",
      "touchend",
      "touchcancel"
    ].forEach(type => {

      recordList.addEventListener(
        type,
        event => {

          event.stopPropagation();

        },
        {
          passive: true
        }
      );

    });


    /* =========================================================
       DATE
    ========================================================= */

    function parseRecordDate(
      value
    ) {

      const text =
        String(
          value ?? ""
        ).trim();

      if (
        !/^\d{6}$/.test(text)
      ) {
        return "날짜 확인 필요";
      }

      const yy =
        Number(
          text.slice(0, 2)
        );

      const mm =
        Number(
          text.slice(2, 4)
        );

      const dd =
        Number(
          text.slice(4, 6)
        );

      const year =
        2000 + yy;

      const date =
        new Date(
          year,
          mm - 1,
          dd
        );

      if (
        date.getFullYear() !==
          year ||
        date.getMonth() !==
          mm - 1 ||
        date.getDate() !==
          dd
      ) {
        return "날짜 확인 필요";
      }

      return (
        `${year}.` +
        `${String(mm).padStart(2, "0")}.` +
        `${String(dd).padStart(2, "0")}`
      );
    }


    function getDateSortValue(
      value
    ) {

      const text =
        String(
          value ?? ""
        ).trim();

      if (
        !/^\d{6}$/.test(text)
      ) {
        return -1;
      }

      const yy =
        Number(
          text.slice(0, 2)
        );

      const mm =
        Number(
          text.slice(2, 4)
        );

      const dd =
        Number(
          text.slice(4, 6)
        );

      const year =
        2000 + yy;

      const date =
        new Date(
          year,
          mm - 1,
          dd
        );

      if (
        date.getFullYear() !==
          year ||
        date.getMonth() !==
          mm - 1 ||
        date.getDate() !==
          dd
      ) {
        return -1;
      }

      return Number(text);
    }


    function sortRecordsByDate(
      data
    ) {

      return [
        ...data
      ].sort(
        (a, b) => {

          const aValue =
            getDateSortValue(
              a.date
            );

          const bValue =
            getDateSortValue(
              b.date
            );

          /*
            최신 날짜 → 가장 위.
          */

          return (
            bValue -
            aValue
          );
        }
      );
    }


    /* =========================================================
       ESCAPE
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =========================================================
       FIND RECORD
    ========================================================= */

    function findRecordById(
      recordId
    ) {

      return recordById.get(
        Number(recordId)
      );
    }


    /* =========================================================
       STATS
    ========================================================= */

    function updateStats(
      data
    ) {

      totalCount.textContent =
        data.length;

      const uniqueVehicles =
        new Set(
          data
            .map(
              item =>
                String(
                  item.carnum ?? ""
                ).trim()
            )
            .filter(Boolean)
        );

      vehicleCount.textContent =
        uniqueVehicles.size;

      listCount.textContent =
        data.length;
    }


    /* =========================================================
       RENDER LIST
    ========================================================= */

    function renderList(
      data
    ) {

      updateStats(data);

      if (!data.length) {

        recordList.innerHTML = `
          <div class="empty">
            검색 결과가 없습니다.
          </div>
        `;

        return;
      }

      /*
        절대 여기서 다시 정렬하지 않는다.

        records는 이미 날짜 내림차순이고
        filter()도 그 순서를 유지한다.
      */

      recordList.innerHTML =
        data
          .map(item => {

            const recordId =
              Number(
                item.recordId
              );

            const carnum =
              escapeHtml(
                item.carnum ||
                "차량번호 없음"
              );

            const car =
              escapeHtml(
                item.car ||
                "차종 정보 없음"
              );

            const reason =
              escapeHtml(
                item.reason ||
                "사고사유 정보 없음"
              );

            const date =
              escapeHtml(
                parseRecordDate(
                  item.date
                )
              );

            const active =
              activeRecordId ===
              recordId
                ? "active"
                : "";

            return `
              <button
                type="button"
                class="record ${active}"
                data-record-id="${recordId}"
              >

                <div class="record-top">

                  <div
                    class="record-car-number"
                  >
                    ${carnum}
                  </div>

                  <div
                    class="record-date"
                  >
                    ${date}
                  </div>

                </div>

                <div class="record-car">
                  ${car}
                </div>

                <div class="record-reason">
                  ${reason}
                </div>

              </button>
            `;

          })
          .join("");


      recordList
        .querySelectorAll(
          ".record"
        )
        .forEach(element => {

          element.addEventListener(
            "click",
            () => {

              const id =
                Number(
                  element.dataset.recordId
                );

              selectRecord(id);

            }
          );

        });
    }


    /* =========================================================
       INFO WINDOW
    ========================================================= */

    function createInfoWindowContent(
      item
    ) {

      const carnum =
        escapeHtml(
          item.carnum ||
          "차량번호 없음"
        );

      const car =
        escapeHtml(
          item.car ||
          "차종 정보 없음"
        );

      const date =
        escapeHtml(
          parseRecordDate(
            item.date
          )
        );

      const reason =
        escapeHtml(
          item.reason ||
          "사고사유 정보 없음"
        );

      return `
        <div class="custom-info">

          <div
            class="custom-info-title"
          >
            ${carnum}
          </div>

          <div
            class="custom-info-car"
          >
            ${car}
          </div>

          <div
            class="custom-info-row"
          >

            <span
              class="custom-info-label"
            >
              DATE
            </span>

            <span
              class="custom-info-value"
            >
              ${date}
            </span>

          </div>

          <div
            class="custom-info-row"
          >

            <span
              class="custom-info-label"
            >
              REASON
            </span>

            <span
              class="custom-info-value"
            >
              ${reason}
            </span>

          </div>

        </div>
      `;
    }


    function closeActiveInfoWindow() {

      if (
        activeInfoWindow
      ) {

        activeInfoWindow.close();

        activeInfoWindow =
          null;
      }
    }


    /* =========================================================
       OPEN MARKER INFO
    ========================================================= */

    function openMarkerInfo(
      recordId
    ) {

      if (!map) {
        return;
      }

      const id =
        Number(recordId);

      const item =
        findRecordById(id);

      const markerEntry =
        markerByRecordId.get(id);

      if (
        !item ||
        !markerEntry
      ) {
        return;
      }

      closeActiveInfoWindow();

      activeRecordId =
        id;


      /*
        리스트 active 처리.
      */

      document
        .querySelectorAll(
          ".record"
        )
        .forEach(element => {

          element.classList.toggle(
            "active",

            Number(
              element.dataset.recordId
            ) === id
          );

        });


      const marker =
        markerEntry.marker;

      const infoWindow =
        markerEntry.infoWindow;

      const position =
        marker.getPosition();


      /*
        모바일에서 팝업이
        시트에 가리지 않도록
        시트를 아래로 내린다.
      */

      if (isMobile()) {

        setSheetPosition(
          "collapsed",
          true
        );

      }


      map.setLevel(4);

      map.panTo(position);


      /*
        시트 애니메이션 후
        팝업을 연다.
      */

      setTimeout(
        () => {

          if (!map) {
            return;
          }

          map.panTo(position);

          infoWindow.open(
            map,
            marker
          );

          activeInfoWindow =
            infoWindow;

        },
        isMobile()
          ? 350
          : 150
      );


      /*
        리스트에서도
        해당 차량을 찾는다.
      */

      const selectedElement =
        document.querySelector(
          `.record[data-record-id="${id}"]`
        );

      if (
        selectedElement
      ) {

        selectedElement.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }

    }


    /* =========================================================
       MARKERS
    ========================================================= */

    function createMarkers(
      data
    ) {

      if (
        !map ||
        !clusterer
      ) {
        return;
      }


      /*
        기존 cluster 제거.
      */

      clusterer.clear();


      /*
        기존 marker 제거.
      */

      markers.forEach(
        marker => {

          marker.setMap(
            null
          );

        }
      );

      markers = [];

      markerByRecordId.clear();


      /*
        새 marker 생성.
      */

      data.forEach(
        item => {

          const recordId =
            Number(
              item.recordId
            );

          const position =
            new kakao.maps.LatLng(
              Number(
                item.latitude
              ),
              Number(
                item.longitude
              )
            );


          const marker =
            new kakao.maps.Marker({
              position
            });


          const infoWindow =
            new kakao.maps.InfoWindow({
              content:
                createInfoWindowContent(
                  item
                ),

              removable: false,

              zIndex: 10
            });


          kakao.maps.event.addListener(
            marker,
            "click",
            () => {

              openMarkerInfo(
                recordId
              );

            }
          );


          /*
            좌표가 아니라
            recordId로 marker를 찾는다.

            같은 좌표에 여러 차량이 있어도
            리스트 ↔ 마커 연결이 깨지지 않는다.
          */

          markerByRecordId.set(
            recordId,
            {
              marker,
              infoWindow
            }
          );


          markers.push(
            marker
          );

        }
      );


      clusterer.addMarkers(
        markers
      );
    }


    /* =========================================================
       SELECT RECORD
    ========================================================= */

    function selectRecord(
      recordId
    ) {

      const id =
        Number(recordId);

      const item =
        findRecordById(id);

      const markerEntry =
        markerByRecordId.get(id);

      if (
        !item ||
        !markerEntry
      ) {
        return;
      }

      openMarkerInfo(id);
    }


    /* =========================================================
       FIT MAP
    ========================================================= */

    function fitMap() {

      if (
        !map ||
        !records.length
      ) {
        return;
      }

      closeActiveInfoWindow();

      activeRecordId =
        null;


      document
        .querySelectorAll(
          ".record"
        )
        .forEach(element => {

          element.classList.remove(
            "active"
          );

        });


      const bounds =
        new kakao.maps.LatLngBounds();


      records.forEach(
        item => {

          bounds.extend(
            new kakao.maps.LatLng(
              Number(
                item.latitude
              ),
              Number(
                item.longitude
              )
            )
          );

        }
      );


      map.setBounds(
        bounds,
        50,
        50,
        50,
        50
      );
    }


    fitButton.addEventListener(
      "click",
      fitMap
    );


    /* =========================================================
       SEARCH
    ========================================================= */

    function filterRecords(
      keyword
    ) {

      const query =
        String(
          keyword ?? ""
        )
          .trim()
          .toLowerCase();


      if (!query) {
        return records;
      }


      /*
        records가 이미 날짜 내림차순이므로
        filter() 후에도 날짜순 유지.
      */

      return records.filter(
        item => {

          const values = [
            item.carnum,
            item.car,
            item.reason,
            item.date
          ];


          return values.some(
            value =>
              String(
                value ?? ""
              )
                .toLowerCase()
                .includes(query)
          );

        }
      );
    }


    searchInput.addEventListener(
      "input",
      event => {

        const filtered =
          filterRecords(
            event.target.value
          );


        activeRecordId =
          null;

        closeActiveInfoWindow();


        renderList(
          filtered
        );


        createMarkers(
          filtered
        );

      }
    );


    /* =========================================================
       LOAD JSON
    ========================================================= */

    async function loadData() {

      try {

        const response =
          await fetch(
            "./list.json",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `list.json HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        if (
          !Array.isArray(json)
        ) {

          throw new Error(
            "list.json 형식이 배열이 아닙니다."
          );

        }


        /*
          JSON 원본 순서를 기준으로
          절대 변하지 않는 ID 생성.
        */

        const normalized =
          json.map(
            (item, index) => ({
              ...item,

              recordId:
                index
            })
          );


        /*
          좌표가 정상인 데이터만 사용.
        */

        const valid =
          normalized.filter(
            item => {

              const lat =
                Number(
                  item.latitude
                );

              const lng =
                Number(
                  item.longitude
                );


              return (
                Number.isFinite(lat) &&
                Number.isFinite(lng)
              );

            }
          );


        /*
          최신 날짜가 위.
        */

        records =
          sortRecordsByDate(
            valid
          );


        /*
          recordId → record.
        */

        recordById =
          new Map(
            records.map(
              item => [
                Number(
                  item.recordId
                ),
                item
              ]
            )
          );


        /*
          초기 목록.
        */

        updateStats(
          records
        );

        renderList(
          records
        );


        /*
          초기 marker.
        */

        createMarkers(
          records
        );


        /*
          전체 차량 표시.
        */

        setTimeout(
          () => {

            fitMap();

          },
          100
        );


      } catch (error) {

        console.error(
          "데이터 로드 실패:",
          error
        );


        recordList.innerHTML = `
          <div class="empty">
            데이터를 불러오지 못했습니다.<br>
            list.json 파일을 확인해주세요.
          </div>
        `;

      }

    }


    /* =========================================================
       MAP INIT
    ========================================================= */

    function initMap() {

      const container =
        document.getElementById(
          "map"
        );


      const options = {

        center:
          new kakao.maps.LatLng(
            37.5665,
            126.9780
          ),

        level: 8

      };


      map =
        new kakao.maps.Map(
          container,
          options
        );


      /*
        줌 컨트롤.
      */

      const zoomControl =
        new kakao.maps.ZoomControl();


      map.addControl(
        zoomControl,

        kakao.maps.ControlPosition.RIGHT
      );


      /*
        Marker Clusterer.
      */

      clusterer =
        new kakao.maps.MarkerClusterer({

          map,

          averageCenter: true,

          minLevel: 6,

          disableClickZoom: false

        });


      loadData();

    }


    /* =========================================================
       RESIZE
    ========================================================= */

    window.addEventListener(
      "resize",
      () => {

        if (!map) {
          return;
        }


        if (isMobile()) {

          /*
            현재 시트 상태를
            새 화면 높이에 맞춰 재계산.
          */

          setSheetPosition(
            sheetState.current,
            false
          );

        } else {

          /*
            PC에서는 transform 제거.
          */

          sidebar.style.transform =
            "";

          sidebar.style.transition =
            "";

        }


        map.relayout();

      }
    );


    /* =========================================================
       WINDOW LOAD
    ========================================================= */

    window.addEventListener(
      "load",
      () => {

        if (
          typeof kakao ===
            "undefined" ||
          !kakao.maps
        ) {

          console.error(
            "Kakao Maps SDK를 불러오지 못했습니다."
          );

          return;
        }


        /*
          모바일 최초 상태:
          아래로 내려간 상태.
        */

        if (isMobile()) {

          setSheetPosition(
            "collapsed",
            false
          );

        }


        kakao.maps.load(
          () => {

            initMap();

          }
        );

      }
    );
